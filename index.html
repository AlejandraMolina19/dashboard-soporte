// ═════ Panorama (resumen automático) de Soporte y de Desarrollo ═════
function panoramaHtml(tipo){
  const ctx=window._repCtx,stA=window._repStatsActual;if(!ctx||!stA)return'';
  const all=ctx.ticketsActual,total=all.length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  const top=(rows,letra,n)=>{const m={};rows.forEach(r=>{const v=cv(r,letra).trim();if(v)m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);};
  const lista=arr=>arr.map(([k,v])=>`<b>${cap(k)}</b> (${v})`).join(', ');
  const esSop=tipo==='soporte';
  const rows=esSop?all.filter(r=>esAgenteSoporte(r)&&!esDesarrollo(r)):all.filter(esDesarrollo);
  const sla=esSop?stA.slaSoporte:stA.slaDesarrollo;
  const res=rows.filter(esCerradoJ).length,abiertos=rows.length-res;
  const d=distribucionTiempos(tiemposSLA(rows.filter(esResuelto),'días')); // propia, no depende del orden de render
  const dot=sla&&sla.color?{verde:'🟢',amarillo:'🟡',rojo:'🔴'}[sla.color]:'';
  const L=[];
  if(!rows.length)return`<div class="card"><div class="card-head"><div class="card-title">Panorama de ${esSop?'Soporte':'Desarrollo'}</div></div><div class="etk-foot">Sin tickets en ${ctx.rangoLabel}.</div></div>`;
  if(esSop){
    L.push(['📥',`Soporte atendió <b>${rows.length}</b> tickets sin escalar (${pct(rows.length,total)}% del total): <b>${res}</b> resueltos y <b>${abiertos}</b> siguen abiertos.`]);
  }else{
    const deSop=rows.filter(esAgenteSoporte).length,otros=rows.length-deSop;
    L.push(['📥',`Llegaron <b>${rows.length}</b> tickets a Desarrollo (${pct(rows.length,total)}% del total): <b>${deSop}</b> escalados por Soporte${otros?` y <b>${otros}</b> por guardias o agente de apoyo`:''}. <b>${res}</b> resueltos, <b>${abiertos}</b> abiertos.`]);
  }
  if(sla&&sla.total){
    const pv=pct(sla.buckets.verde,sla.total),pr=pct(sla.buckets.rojo,sla.total);
    L.push(['⏱',`Tiempo promedio de solución: ${dot} <b>${sla.promedio.toFixed(1)} días operativos</b>${d&&d.p50!=null?` (mediana ${d.p50} d)`:''} contra una meta verde de ≤ ${sla.vMax} d. <b>${pv}%</b> quedó en verde y <b>${pr}%</b> en rojo (≥ ${sla.aMax} d).`]);
  }
  if(esSop){
    const ag=stA.porSoporte.filter(p=>!/por[\s_]+asignar/i.test(p.nombre));
    const pa=stA.porSoporte.find(p=>/por[\s_]+asignar/i.test(p.nombre));
    if(ag.length)L.push(['👥',`Carga por agente: ${ag.map(p=>`<b>${cap(p.nombre)}</b> (${p.total})`).join(', ')}${pa?` · por asignar: ${pa.total}`:''}.`]);
    const esc=all.filter(r=>esAgenteSoporte(r)&&esDesarrollo(r)).length,base=all.filter(esAgenteSoporte).length;
    if(base)L.push(['🛠',`Se escalaron a Desarrollo <b>${esc}</b> de ${base} tickets de Soporte (${pct(esc,base)}%).`]);
    const tc=top(rows,'T',2),tm=top(rows,'U',2);
    if(tc.length||tm.length)L.push(['🏷',`Lo más frecuente: ${tc.length?'categoría '+lista(tc):''}${tc.length&&tm.length?' · ':''}${tm.length?'módulo '+lista(tm):''}.`]);
    const ia=calcularDudasIA(rows);
    if(ia.colOk&&ia.dudas)L.push(['🤖',`<b>${ia.dudas}</b> son dudas de cliente (${ia.pct}%) que podría resolver una IA.`]);
    if(ctx.llStats&&ctx.llStats.totalValidas)L.push(['📞',`<b>${ctx.llStats.totalValidas}</b> llamadas completadas: ${ctx.llStats.porAgente.map(a=>`${a.nombre} (${a.total})`).join(', ')}.`]);
  }else{
    const devs=top(rows,'P',4),sin=rows.filter(r=>!cv(r,'P').trim()).length;
    if(devs.length||sin)L.push(['👥',`Quién atiende: ${devs.length?lista(devs):'—'}${sin?` · <b>${sin}</b> sin desarrollador asignado`:''}.`]);
    const tm=top(rows,'U',2),tv=top(rows,'V',2);
    if(tm.length||tv.length)L.push(['🏷',`Lo que más se escala: ${tm.length?'módulo '+lista(tm):''}${tm.length&&tv.length?' · ':''}${tv.length?'causa '+lista(tv):''}.`]);
    const bl=rows.filter(esRequerimientoBL);
    const blFueraDev=all.filter(r=>esRequerimientoBL(r)&&!esDesarrollo(r)).length;
    if(hayColumnasNuevas(all)){
      const tProm=rs=>{const ts=rs.filter(esCerradoJ).map(r=>diasOperativos(cv(r,'L'),cv(r,'M'))).filter(v=>v!=null&&v>=0);return ts.length?(ts.reduce((a,b)=>a+b,0)/ts.length).toFixed(1)+' d':'—';};
      L.push(['📋',`<b>${bl.length}</b> son requerimientos con BL levantado (${pct(bl.length,rows.length)}% de lo escalado) y <b>${rows.length-bl.length}</b> son incidencias. Tiempo promedio: incidencias ${tProm(rows.filter(r=>!esRequerimientoBL(r)))} · requerimientos ${tProm(bl)}.${blFueraDev?` ⚠ ${blFueraDev} ticket${blFueraDev===1?'':'s'} con BL no tiene${blFueraDev===1?'':'n'} marca de Desarrollo (col. S): revisar.`:''}`]);
    }
    const abiertosRows=rows.filter(r=>!esCerradoJ(r)).map(r=>({r,d:diasOperativos(cv(r,'L'),new Date())})).filter(x=>x.d!=null).sort((a,b)=>b.d-a.d);
    if(abiertosRows.length){const x=abiertosRows[0];L.push(['⏳',`El ticket abierto más antiguo es <b>#${cv(x.r,'I')}</b> (${cv(x.r,'K')||'sin empresa'}): lleva <b>${x.d.toFixed(1)} días operativos</b>${cv(x.r,'P').trim()?` con ${cap(cv(x.r,'P').trim())}`:' sin desarrollador asignado'}.`]);}
  }
  return`<div class="card">
    <div class="card-head"><div class="card-title">${esSop?'🎧 Panorama de Soporte':'🛠 Panorama de Desarrollo'}</div><span class="etk-note">${ctx.rangoLabel} · resumen automático</span></div>
    <div class="etk-pan">${L.map(([i,txt])=>`<div class="etk-pan-l"><span>${i}</span><div>${txt}</div></div>`).join('')}</div>
    <div class="etk-foot" style="padding-top:0">⚠ Los tiempos usan la col. M (Resuelto), que puede incluir cierre automático o actualizaciones posteriores; se corregirán al agregar la fecha de <i>solved</i> de Zendesk.</div>
  </div>`;
}

function personasRep(){

function seleccionarPersonaRep(nombre){REP_PERSONA=nombre;const b=el('rep-desempeno-body');if(b)b.innerHTML=desempenoHtml();}
function statsPersona(rows,persona){
  const col=persona.tipo==='soporte'?'O':'P';
  const mias=rows.filter(r=>cv(r,col).trim().toLowerCase()===persona.nombre.toLowerCase());
  const cerradas=mias.filter(esCerradoJ);
  const paraSla=persona.tipo==='soporte'?cerradas.filter(r=>!esDesarrollo(r)):cerradas;
  const lim=slaLimites(persona.tipo);
  const tiempo=r=>diasOperativos(cv(r,'L'),cv(r,'M'));
  const conT=paraSla.map(r=>({r,d:tiempo(r)})).filter(x=>x.d!=null&&x.d>=0);
  const b={verde:0,amarillo:0,rojo:0};conT.forEach(x=>{if(x.d<=lim.vMax)b.verde++;else if(x.d<lim.aMax)b.amarillo++;else b.rojo++;});
  const prom=conT.length?conT.reduce((a,x)=>a+x.d,0)/conT.length:null;
  const solved=mias.filter(esSolvedJ);let ot=0;
  solved.forEach(r=>{const a=new Date(cv(r,'L')),m=new Date(cv(r,'M'));if(!isNaN(a)&&!isNaN(m)&&a.toDateString()===m.toDateString()&&a.getHours()===m.getHours())ot++;});
  // Desglose de TODO lo asignado (suma = asignados)
  let desglose;
  if(persona.tipo==='soporte'){
    const esc=mias.filter(esDesarrollo),escC=esc.filter(esCerradoJ).length;
    const sinEsc=mias.filter(r=>!esDesarrollo(r)),sopC=sinEsc.filter(esCerradoJ).length;
    desglose=[
      ['🟢',`Resueltos en Soporte dentro de meta (≤ ${lim.vMax} d)`,b.verde,'#91cc75'],
      ['🟡',`Resueltos en Soporte entre ${lim.vMax} y ${lim.aMax} d`,b.amarillo,'#fac858'],
      ['🔴',`Resueltos en Soporte fuera de SLA (≥ ${lim.aMax} d)`,b.rojo,'#ee6666'],
      ['⚪','Resueltos en Soporte sin fechas válidas (no se pueden medir)',sopC-conT.length,'#cfd6e3'],
      ['⏳','Siguen abiertos en Soporte',sinEsc.length-sopC,'#9db0d9'],
      ['🛠','Escalados a Desarrollo · ya resueltos',escC,'#9a60b4'],
      ['🛠','Escalados a Desarrollo · siguen abiertos',esc.length-escC,'#c9a7dd'],
    ];
  }else{
    desglose=[
      ['🟢',`Resueltos dentro de meta (≤ ${lim.vMax} d)`,b.verde,'#91cc75'],
      ['🟡',`Resueltos entre ${lim.vMax} y ${lim.aMax} d`,b.amarillo,'#fac858'],
      ['🔴',`Resueltos fuera de SLA (≥ ${lim.aMax} d)`,b.rojo,'#ee6666'],
      ['⚪','Resueltos sin fechas válidas (no se pueden medir)',cerradas.length-conT.length,'#cfd6e3'],
      ['⏳','Siguen abiertos',mias.length-cerradas.length,'#9db0d9'],
    ];
  }
  // Top 10 más tardados en resolverse (de los tickets que llegaron en el periodo). Soporte: incluye los escalados.
  const lentos=cerradas.map(r=>({r,d:tiempo(r),dev:esDesarrollo(r)})).filter(x=>x.d!=null&&x.d>=0).sort((x,y)=>y.d-x.d).slice(0,10);
  return{mias,recibidos:mias.length,resueltos:cerradas.length,abiertos:mias.length-cerradas.length,prom,b,nSla:conT.length,lim,desglose,
    escalados:persona.tipo==='soporte'?mias.filter(esDesarrollo).length:null,
    oneTouch:solved.length?Math.round(ot/solved.length*100):null,lentos};
}
// Tabla del equipo de Desarrollo (tickets escalados que llegaron en el periodo, por col. P)
function equipoDevStats(rows){
  const dev=rows.filter(esDesarrollo),hoy=new Date();
  const m={};
  dev.forEach(r=>{const k=cv(r,'P').trim()||'Sin asignar';(m[k]=m[k]||[]).push(r);});
  const fila=(nombre,rs)=>{
    const c=rs.filter(esCerradoJ);
    const ts=c.map(r=>diasOperativos(cv(r,'L'),cv(r,'M'))).filter(v=>v!=null&&v>=0);
    const ab=rs.filter(r=>!esCerradoJ(r));
    const viejos=ab.filter(r=>{const d=diffDias(cv(r,'L'),hoy);return d!=null&&d>30;}).length;
    return{nombre,asig:rs.length,res:c.length,pct:rs.length?Math.round(c.length/rs.length*1000)/10:0,prom:ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null,ab:ab.length,viejos,bl:rs.filter(esRequerimientoBL).length};
  };
  const filas=Object.entries(m).map(([k,rs])=>fila(k,rs)).sort((a,b)=>(a.nombre==='Sin asignar')-(b.nombre==='Sin asignar')||a.pct-b.pct);
  return{filas,equipo:fila('Equipo',dev)};
}

  const colSem=s.prom==null?'#9ca3af':s.prom<=s.lim.vMax?'#16a34a':s.prom<s.lim.aMax?'#d4a72c':'#ee6666';

  const tend=semTend.map(w=>({id:w.id,...statsPersona(ticketsPorSemanaIds(new Set([w.id])),per)}));

      <tbody>${ED.filas.map(f=>{const sel=f.nombre.toLowerCase()===per.nombre.toLowerCase();const clic=f.nombre!=='Sin asignar'&&personas.some(p=>p.nombre.toLowerCase()===f.nombre.toLowerCase());return`<tr style="${sel?'background:#eef2fd;':''}${clic?'cursor:pointer':''}" ${clic?`onclick="seleccionarPersonaRep('${personas.find(p=>p.nombre.toLowerCase()===f.nombre.toLowerCase()).nombre.replace(/'/g,"\\'")}')"`:''}>
        <td style="font-weight:600">${cap(f.nombre)}</td><td>${f.asig}</td><td>${f.res}</td><td>${f.pct}%</td><td>${f.prom!=null?slaPunto('desarrollo',f.prom)+f.prom.toFixed(1):'—'}</td><td>${f.ab}</td><td style="${f.viejos?'color:#ee6666;font-weight:600':''}">${f.viejos}</td>${hayColumnasNuevas(ctx.ticketsActual)?`<td>${f.bl} <span class="etk-note">(${f.asig?Math.round(f.bl/f.asig*100):0}%)</span></td>`:''}</tr>`;}).join('')}
        <tr style="border-top:2px solid var(--etk-line)"><td style="font-weight:700">Equipo</td><td style="font-weight:700">${ED.equipo.asig}</td><td style="font-weight:700">${ED.equipo.res}</td><td style="font-weight:700">${ED.equipo.pct}%</td><td style="font-weight:700">${fmtD(ED.equipo.prom)}</td><td style="font-weight:700">${ED.equipo.ab}</td><td style="font-weight:700">${ED.equipo.viejos}</td>${hayColumnasNuevas(ctx.ticketsActual)?`<td style="font-weight:700">${ED.equipo.bl}</td>`:''}</tr>
      </tbody></table>

  <div class="etk-row2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)">
    <div class="card"><div class="card-head"><div class="card-title">Semana a semana</div><span class="etk-note">para ver si mejora o empeora</span></div>

        <thead><tr><th>Semana</th><th>Asignados</th><th>Cerrados</th><th>Prom. solución</th><th>🔴 en rojo</th></tr></thead>

      <div style="overflow-x:auto;padding:0 16px 14px">${s.lentos.length?`<table class="etk-table" style="font-size:12.5px">
        <thead><tr><th>Ticket</th><th>Empresa</th><th>Categoría</th><th>Creado</th>${esSop?'<th>¿Pasó a Desarrollo?</th>':''}${hayColumnasNuevas(ctx.ticketsActual)?'<th>Tipo</th>':''}<th>Días op.</th></tr></thead>

// ── Componentes visuales estilo Etikto (Reportes) ──
// delta: % de cambio vs. periodo anterior; buenoAlSubir decide si sube = verde o rojo. unidad 'pts' = diferencia en puntos porcentuales
function etkDelta(a,b,buenoAlSubir,unidad){
  if(a==null||b==null||isNaN(a)||isNaN(b))return'';
  let txt,dif;
  if(unidad==='pts'){dif=Math.round((a-b)*10)/10;txt=(dif>=0?'+':'')+dif+' pts';}
  else{if(!b)return'';dif=a-b;const pct=Math.round(dif/b*1000)/10;txt=(pct>=0?'+':'')+pct+'%';}
  if(dif===0)return`<span class="etk-delta neutro">0% ▬</span>`;
  const bueno=(dif>0)===buenoAlSubir;
  return`<span class="etk-delta ${bueno?'bueno':'malo'}">${txt} ${dif>0?'▲':'▼'}</span>`;
}
function slaPunto(tipo,v){const l=slaLimites(tipo);return(v<=l.vMax?'🟢':v<l.aMax?'🟡':'🔴')+' ';}
function etkKpi(label,valor,delta,sub){
  return`<div class="etk-kpi" title="${label}: ${valor}">
    <div class="etk-kpi-top"><span>${label}</span><span class="etk-dots">•••</span></div>
    <div class="etk-kpi-val">${valor}${delta||''}</div>
    <div class="etk-kpi-sub">${delta?'vs. periodo anterior · ':''}${sub}</div>
  </div>`;
}
function etkDist(icon,color,label,valor,pctBarra,sub){
  return`<div class="etk-dist-item">
    <div class="etk-ico" style="background:${color}22;color:${color}">${icon}</div>
    <div style="flex:1;min-width:0">
      <div class="etk-dist-lbl">${label}</div>
      <div class="etk-dist-val">${valor}</div>
      ${pctBarra!=null?`<div class="etk-prog"><div style="width:${Math.min(100,pctBarra)}%;background:${color}"></div></div>`:''}
      <div class="etk-dist-sub">${sub}</div>
    </div>
  </div>`;
}

function renderAnalisisRango(){
  const semanas=getSemanasUnicas();
  if(!semanas.length){
    return`<div class="card"><div class="card-head"><div class="card-title">📅 Reporte por semana</div></div><div style="padding:16px;font-size:12px;color:var(--txt3)">No se encontró la columna de ID de semana en la BD conectada, o no hay semanas depuradas desde ${REP_SEMANA_MIN}.</div></div>`;
  }
  if(!REP_INI||!semanas.some(s=>s.id===REP_INI))REP_INI=semanas[semanas.length-1].id;
  if(!REP_FIN||!semanas.some(s=>s.id===REP_FIN))REP_FIN=REP_INI;

  // ── Rango seleccionado: "Desde" → "Hasta" (comparativa entre semanas cuando abarca más de una) ──
  const iniK0=parseSemanaId(REP_INI).key,finK0=parseSemanaId(REP_FIN).key;
  const kMin=Math.min(iniK0,finK0),kMax=Math.max(iniK0,finK0);
  REP_INI=semanas.find(s=>s.key===kMin).id;
  REP_FIN=semanas.find(s=>s.key===kMax).id;
  const semanasEnRango=semanas.filter(s=>s.key>=kMin&&s.key<=kMax);
  const iniIdx=semanas.findIndex(s=>s.key===kMin);
  const nSemanas=semanasEnRango.length;
  const esRango=nSemanas>1;

  const rangoActualIds=new Set(semanasEnRango.map(s=>s.id));
  const prevWeeks=semanas.slice(Math.max(0,iniIdx-nSemanas),iniIdx);
  const rangoPrevIds=new Set(prevWeeks.map(s=>s.id));

  const ticketsActual=ticketsPorSemanaIds(rangoActualIds);
  const ticketsPrev=rangoPrevIds.size?ticketsPorSemanaIds(rangoPrevIds):[];
  const stA=calcularRango(ticketsActual);
  const stP=rangoPrevIds.size?calcularRango(ticketsPrev):null;
  // Resueltos del periodo = tickets cerrados (solved/closed) cuya semana de cierre (col. G) cae en el periodo, sin importar cuándo se crearon
  stA.resueltosCierre=resueltosPorCierre(rangoActualIds).length;
  const conc=conciliarRecibidosResueltos(rangoActualIds,ticketsActual);
  window._repConciliacion=conc;
  if(stP)stP.resueltosCierre=resueltosPorCierre(rangoPrevIds).length;
  const evolucion=getEvolucionSemanal(semanas);
  const llStats=calcularLlamadasRango(rangoActualIds);

  // Comparativa semana a semana dentro del rango elegido (solo si son 2+ semanas)
  const comparativaRows=esRango?semanasEnRango.map(s=>{
    const rows=ticketsPorSemanaIds(new Set([s.id]));
    const st=calcularRango(rows);
    const resC=resueltosPorCierre(new Set([s.id])).length;
    return{id:s.id,total:st.total,resueltos:resC,pctRes:st.total?Math.round(resC/st.total*100):0,slaSop:st.slaSoporte.promedio,slaDev:st.slaDesarrollo.promedio,pctDev:st.pctDesarrollo};
  }):null;

  window._repStatsActual=stA;
  window._repCtx={ticketsActual,ticketsPrev,hayPrev:rangoPrevIds.size>0,nPrev:rangoPrevIds.size,semanasEnRango,semanas,llStats,rangoLabel:esRango?REP_INI+' → '+REP_FIN:REP_INI,iniIdx};
  window._repEvolucion=evolucion;
  window._repSemanaSel=REP_INI;
  window._repLlamadas=llStats;

  function delta2(a,b){
    if(b==null||!b)return'';
    const dif=a-b;const pct=b?Math.round(dif/b*100):0;
    const col=dif>=0?'#dc2626':'#16a34a';const sym=dif>=0?'▲':'▼';
    return`<span style="font-size:10px;color:${col};margin-left:4px">${sym}${Math.abs(pct)}%</span>`;
  }

  const opciones=semanas.map(s=>`<option value="${s.id}">${s.id}</option>`).join('');

  const maxBucket=Math.max(...Object.values(stA.buckets),1);
  const bucketRows=Object.entries(stA.buckets).map(([k,v])=>{
    const pct=Math.round(v/maxBucket*100);
    const col=k==='15+ días'?'#dc2626':k==='8-15 días'?'#d97706':k==='4-7 días'?'#eab308':'#16a34a';
    return`<div class="ag-bar-row" style="margin-bottom:6px" title="${k}: ${v} ticket${v===1?'':'s'}"><span class="ag-bar-lbl" style="font-size:11px">${k}</span><div class="ag-bar-track" style="height:14px"><div class="ag-bar-fill" style="width:${pct}%;background:${col};height:100%"></div></div><span class="ag-bar-val" style="font-size:11px;font-weight:700;color:${col}">${v}</span></div>`;
  }).join('');

  function seccion(titulo){
    return`<div style="display:flex;align-items:center;gap:10px;margin:6px 0 -4px;padding:0 4px">
      <span style="font-size:13px;font-weight:800;color:var(--txt);white-space:nowrap">${titulo}</span>
      <div style="flex:1;height:1px;background:var(--bdr)"></div>
    </div>`;
  }

  const empresasRows=stA.empresas.map(e=>{
    const col=e.total>=3?'#dc2626':'#2563eb';
    return`<tr onclick="toggleEmpresaDetalle('${e.org.replace(/'/g,"\\'")}')" style="cursor:pointer">
      <td style="padding:6px 14px;border-bottom:0.5px solid var(--bdr);font-weight:600">${e.org}${e.total>=3?' <span style="font-size:9px;background:#fef2f2;color:#dc2626;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px">REINCIDENTE</span>':''}</td>
      <td style="padding:6px 14px;border-bottom:0.5px solid var(--bdr);font-family:var(--mono);font-weight:700;color:${col}">${e.total}</td>
      <td style="padding:6px 14px;border-bottom:0.5px solid var(--bdr);font-size:11px;color:var(--txt2)">${e.topCategoria}</td>
      <td style="padding:6px 14px;border-bottom:0.5px solid var(--bdr);font-family:var(--mono);text-align:center">${e.llamadas||'—'}</td>
    </tr>`;
  }).join('');

  const rangoLabel=esRango?REP_INI+' → '+REP_FIN:REP_INI;
  const pctResueltos=stA.total?Math.round(stA.solved/stA.total*100):0;
  const topAgente=stA.porSoporte[0]||null;
  const estatusPills=stA.estatusBreakdown.map(e=>{
    const col=ESTATUS_COLOR_REP[e.estatus]||'#6b7280';
    const label=ESTATUS_LABEL[e.estatus]||e.estatus;
    return`<span style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;background:${col}18;color:${col};margin-right:6px;display:inline-block;margin-bottom:6px">${label}: ${e.total}</span>`;
  }).join('');
  const CANAL_COLOR={'Llamada':'#5470c6','Ticket':'#d4a72c','Sin dato':'#b6bfcf'};
  const canalPills=stA.canalBreakdown.map(c=>{
    const col=CANAL_COLOR[c.canal]||'#9ca3af';
    const icon=c.canal==='Llamada'?'📞':c.canal==='Ticket'?'🎫':'❓';
    return`<span style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;background:${col}18;color:${col};margin-right:6px;display:inline-block;margin-bottom:6px">${icon} ${c.canal}: ${c.total}</span>`;
  }).join('');
  const alertas=generarAlertasSemana(stA,stP,evolucion,REP_INI);

  const SEM_LABEL={verde:'En meta',amarillo:'Requiere seguimiento',rojo:'Fuera de SLA'};
  const SEM_DOT={verde:'🟢',amarillo:'🟡',rojo:'🔴'};
  function slaBlockHtml(sla,nombre,metaTxt,canvasId){
    if(!sla.total){
      return`<div style="flex:1;min-width:260px;padding:14px;text-align:center">
        <div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${nombre}</div>
        <div style="font-size:12px;color:var(--txt3)">Sin tickets resueltos esta semana</div>
      </div>`;
    }
    const col=SEM_COLOR[sla.color]||'#9ca3af';
    const promTxt=sla.unidad==='horas'?sla.promedio.toFixed(1)+'h':sla.promedio.toFixed(1)+'d';
    const veces=sla.vMax?Math.round(sla.promedio/sla.vMax*10)/10:0;
    return`<div style="flex:1;min-width:280px;padding:14px;border-radius:var(--rl);background:${col}0d;border:1px solid ${col}30">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:6px">
        <div style="font-size:10.5px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em">${nombre} <span style="font-weight:500;color:var(--txt3);text-transform:none">· meta ${metaTxt}</span></div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="font-size:15px">${SEM_DOT[sla.color]}</span>
          <span style="font-size:19px;font-weight:800;color:${col}">${promTxt}</span>
          <span style="font-size:9.5px;font-weight:700;color:${col}">${SEM_LABEL[sla.color]}${veces>1?' · '+veces+'× la meta':''}</span>
        </div>
      </div>
      <div style="position:relative;height:86px"><canvas id="${canvasId}"></canvas></div>
      <div style="font-size:9.5px;color:var(--txt3);margin-top:6px">${sla.total} resuelto${sla.total===1?'':'s'} esta semana · clic en la barra para ver el detalle de rangos</div>
    </div>`;

function exportarPanelReportes(formato){
  const area=document.getElementById('reportes-export-area');

  if(typeof html2canvas==='undefined'){showToast('No se pudo cargar la herramienta de exportación','#dc2626');return;}
  showToast('Generando '+formato.toUpperCase()+'…','#2563eb');
  html2canvas(area,{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(canvas=>{
    const nombre='reporte_semanal_'+(REP_INI||new Date().toISOString().split('T')[0]);
    if(formato==='png'){

      a.href=canvas.toDataURL('image/png');
      a.download=nombre+'.png';
      a.click();
      showToast('✓ Imagen descargada','#16a34a');
    } else {
      try{
        const{jsPDF}=window.jspdf;
        const imgData=canvas.toDataURL('image/png');
        const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:[canvas.width,canvas.height]});
        pdf.addImage(imgData,'PNG',0,0,canvas.width,canvas.height);
        pdf.save(nombre+'.pdf');

      }catch(e){

// Relleno degradado vertical para áreas (estilo Etikto)
function etkGradiente(c,rgb){
  const{ctx,chartArea}=c.chart;
  if(!chartArea)return`rgba(${rgb},.15)`;
  const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
  g.addColorStop(0,`rgba(${rgb},.38)`);g.addColorStop(1,`rgba(${rgb},.02)`);
  return g;
}
// Tipografía, leyendas y cuadrícula punteada uniformes para las gráficas de Reportes
function etkTemaChart(ch){
  if(!ch||!ch.options)return;
  const F="'IBM Plex Sans','Plus Jakarta Sans',sans-serif";
  const o=ch.options;
  if(o.plugins&&o.plugins.legend&&o.plugins.legend.labels){
    Object.assign(o.plugins.legend.labels,{usePointStyle:true,pointStyle:'rectRounded',boxWidth:10,boxHeight:10,padding:14,color:'#5b6b84',font:{size:11,family:F}});
  }
  Object.values(o.scales||{}).forEach(s=>{
    s.ticks=Object.assign(s.ticks||{},{color:'#8a97ab',font:Object.assign({},(s.ticks&&s.ticks.font)||{},{family:F})});
    s.border=Object.assign(s.border||{},{display:false,dash:[4,4]});
    if(!s.grid||s.grid.display!==false)s.grid=Object.assign(s.grid||{},{color:'#e6eaf1'});
  });
  ch.update('none');
}

  // Canal de atención

  Object.keys(CH).filter(k=>k.startsWith('rep-')).forEach(k=>etkTemaChart(CH[k]));
  // Acumulado: barras = tickets por rango de días (color por semáforo) · línea = % acumulado
  [['soporte','rep-acum-soporte-chart'],['desarrollo','rep-acum-desarrollo-chart'],['soporte','rep-acum-soporte-res-chart'],['desarrollo','rep-acum-desarrollo-res-chart']].forEach(([tipo,id])=>{

    const ctx=el(id);const info=window._repDist&&window._repDist[tipo];

    CH[id]=new Chart(ctx,{

        {type:'bar',label:'Tickets',data:d.filas.map(f=>f.c),backgroundColor:colores,borderRadius:6,maxBarThickness:34,yAxisID:'y'}

          title:items=>'Resueltos en '+d.filas[items[0].dataIndex].label,
          label:()=>null,
          afterBody:items=>{const f=d.filas[items[0].dataIndex];return[`${f.c} de ${d.n} tickets (${f.pct}%)`,`Acumulado: ${f.acum}% ya estaba resuelto en este tiempo o menos`];}
        }}},
        scales:{y:{position:'left',ticks:{precision:0},title:{display:true,text:'tickets'},grid:{color:'#e6eaf1'}},
          y2:{position:'right',min:0,max:100,ticks:{callback:v=>v+'%'},grid:{display:false}},x:{grid:{display:false}}}}

  });
  Object.keys(CH).filter(k=>k.startsWith('rep-acum-')).forEach(k=>etkTemaChart(CH[k]));
  buildSlaRangoChartIfOpen();
}

// ═════ Clientes: comparación vs. periodo anterior y candidatos a capacitación ═════
function conteoPorEmpresa(rows,filtro){const m={};rows.forEach(r=>{if(filtro&&!filtro(r))return;const o=cv(r,'K').trim()||'Sin clasificar';m[o]=(m[o]||0)+1;});return m;}
let _empPrevCache=null;
function empPrevMap(){const c=window._repCtx;if(!c)return{};if(!_empPrevCache||_empPrevCache.ctx!==c)_empPrevCache={ctx:c,m:conteoPorEmpresa(c.ticketsPrev||[])};return _empPrevCache.m;}
// ▲ más tickets = rojo (empeora) · ▼ menos = verde
function vsAnteriorHtml(actual,anterior){
  const c=window._repCtx;if(!c||!c.hayPrev)return'<span class="etk-note">—</span>';
  if(!anterior)return actual?'<span class="etk-vs up" title="sin tickets en el periodo anterior">nuevo</span>':'—';
  const d=actual-anterior,pct=Math.round(d/anterior*100);
  if(d===0)return'<span class="etk-vs eq">= 0</span>';
  return`<span class="etk-vs ${d>0?'up':'down'}" title="periodo anterior: ${anterior}">${d>0?'▲ +':'▼ '}${d} (${d>0?'+':''}${pct}%)</span>`;
}
function candidatosCapacitacionHtml(){
  const ctx=window._repCtx;if(!ctx)return'';
  const head=`<div class="card-head"><div class="card-title">🎓 Candidatos a capacitación</div><span class="etk-note">clientes con más dudas · causa = cliente y S-CLIENTE = duda_ · clic para ver sus tickets</span></div>`;
  if(!colSClienteKey())return`<div class="card">${head}<div class="etk-foot">No se encontró la columna S-CLIENTE en Tickets BD.</div></div>`;
  const tot=conteoPorEmpresa(ctx.ticketsActual);
  const dud=conteoPorEmpresa(ctx.ticketsActual,esDudaIA);
  const dudPrev=conteoPorEmpresa(ctx.ticketsPrev||[],esDudaIA);
  const lista=Object.entries(dud).filter(([,n])=>n>=2).map(([org,n])=>{
    const rs=ctx.ticketsActual.filter(r=>(cv(r,'K').trim()||'Sin clasificar')===org&&esDudaIA(r));
    const top=l=>{const m={};rs.forEach(r=>{const v=l==='SC'?valorSCliente(r):cv(r,l).trim();if(v)m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]||null;};
    const pct=Math.round(n/tot[org]*100);
    const prio=n>=5&&pct>=50?'alta':n>=3&&pct>=40?'media':'';
    return{org,n,total:tot[org],pct,duda:top('SC'),mod:top('U'),prev:dudPrev[org]||0,prio};
  }).sort((a,b)=>b.n-a.n||b.pct-a.pct).slice(0,12);
  const nSem=ctx.semanasEnRango.length||1;
  if(!lista.length)return`<div class="card">${head}<div class="etk-foot">Ningún cliente tuvo 2 o más dudas en ${ctx.rangoLabel}.</div></div>`;
  const esc=o=>o.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return`<div class="card">${head}
    <div style="overflow-x:auto;padding:0 16px 6px"><table class="etk-table">
      <thead><tr><th>Empresa</th><th style="text-align:right">Dudas</th><th style="text-align:right">% de sus tickets</th><th>Duda más repetida</th><th>Módulo</th><th style="text-align:right">Dudas vs. ant.</th><th>Prioridad</th></tr></thead>
      <tbody>${lista.map(c=>`<tr style="cursor:pointer" onclick="toggleEmpresaDetalle('${esc(c.org)}')">
        <td style="font-weight:600">${c.org}</td>
        <td style="text-align:right;font-weight:700;color:#9a60b4">${c.n}</td>
        <td style="text-align:right">${c.n} ÷ ${c.total} = ${c.pct}%</td>
        <td>${c.duda?`${c.duda[0]} <span class="etk-note">(${c.duda[1]})</span>`:'—'}</td>
        <td>${c.mod?c.mod[0]:'—'}</td>
        <td style="text-align:right">${vsAnteriorHtml(c.n,c.prev)}</td>
        <td>${c.prio==='alta'?'<span class="etk-prio alta">🔴 Alta</span>':c.prio==='media'?'<span class="etk-prio media">🟡 Sugerido</span>':'<span class="etk-note">—</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="etk-foot">🔴 Alta = 5+ dudas y al menos la mitad de sus tickets · 🟡 Sugerido = 3+ dudas y 40% o más. Capacita sobre la <b>duda más repetida</b> y, 2 a 4 semanas después, revisa "Dudas vs. ant.": si baja (▼ verde), la capacitación funcionó. Periodo: ${ctx.rangoLabel} (${nSem} semana${nSem===1?'':'s'}).</div>
  </div>`;
}

function filtrarEmpresasRep(){
  const q=(el('emp-buscar')?.value||'').trim().toLowerCase(),solo=el('emp-solo-reinc')?.checked,crece=el('emp-solo-crece')?.checked;
  let n=0;
  document.querySelectorAll('#emp-tabla .emp-fila').forEach(tr=>{const ok=(!q||tr.dataset.org.includes(q))&&(!solo||tr.dataset.reinc==='1')&&(!crece||tr.dataset.crece==='1');tr.style.display=ok?'':'none';if(ok)n++;});
  const c=el('emp-contador');if(c)c.textContent=(q||solo||crece)?n+' empresa'+(n===1?'':'s'):'';
  // si el filtro deja una sola empresa exacta, abre su detalle
  const exacta=[...document.querySelectorAll('#emp-tabla .emp-fila')].find(tr=>tr.style.display!=='none'&&tr.dataset.org===q);
  if(exacta&&n===1){const cont=el('empresa-detalle');const org=window._repCtx.ticketsActual.map(r=>cv(r,'K').trim()).find(o=>o.toLowerCase()===q);if(org&&(!cont||cont.dataset.open!==org))toggleEmpresaDetalle(org);}
}
function ticketsDeEmpresa(orgName){return(window._repCtx?window._repCtx.ticketsActual:[]).filter(r=>(cv(r,'K').trim()||'Sin clasificar')===orgName);}
function resumenEmpresa(orgName,rows){
  const ctx=window._repCtx,stA=window._repStatsActual,n=rows.length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const nSem=ctx.semanasEnRango.length||1;
  const llam=rows.filter(r=>canalDe(r)==='Llamada').length,tick=rows.filter(r=>canalDe(r)==='Ticket').length;
  const cerr=rows.filter(esCerradoJ),ab=rows.filter(r=>!esCerradoJ(r));
  const esc=rows.filter(esDesarrollo).length;
  const ts=cerr.filter(esUniversoReportes).map(r=>diasOperativos(cv(r,'L'),cv(r,'M'))).filter(v=>v!=null&&v>=0);
  const prom=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null;
  const top=(l,k)=>{const m={};rows.forEach(r=>{const v=cv(r,l).trim();if(v)m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,k);};
  const ia=calcularDudasIA(rows);
  const porSem=ctx.semanasEnRango.map(s=>({id:s.id,n:rows.filter(r=>r[colKey('H')]===s.id).length}));
  const hoy=new Date();
  const masViejo=ab.map(r=>({r,d:diffDias(cv(r,'L'),hoy)})).filter(x=>x.d!=null).sort((a,b)=>b.d-a.d)[0];
  const agentes=top('O',2);
  const L=[];
  L.push(`📥 <b>${n}</b> tickets en ${nSem} semana${nSem===1?'':'s'} (≈ <b>${(n/nSem).toFixed(1)}</b> por semana): <b>${llam}</b> por llamada (${pct(llam,n)}%) y <b>${tick}</b> por ticket (${pct(tick,n)}%).`);
  L.push(`✅ <b>${cerr.length}</b> resueltos y <b>${ab.length}</b> abiertos${masViejo?` · el más antiguo es #${cv(masViejo.r,'I')} con ${Math.round(masViejo.d)} días naturales`:''}.`);
  if(prom!=null)L.push(`⏱ Tarda en promedio <b>${prom.toFixed(1)} días operativos</b> en resolverse${stA&&stA.tiempoProm!=null?` (general: ${stA.tiempoProm.toFixed(1)} d)`:''}.`);
  L.push(`🛠 <b>${esc}</b> pasaron a Desarrollo (${pct(esc,n)}%${stA?`; general: ${stA.pctDesarrollo}%`:''}).`);
  const tc=top('T',3),tm=top('U',3),tf=top('AF',2);
  if(tc.length)L.push(`🏷 Temas: ${tc.map(([k,v])=>`<b>${k}</b> (${v})`).join(', ')}${tm.length?` · módulos: ${tm.map(([k,v])=>`<b>${k}</b> (${v})`).join(', ')}`:''}${tf.length?` · función: ${tf.map(([k,v])=>`${k} (${v})`).join(', ')}`:''}.`);
  if(ia.colOk&&ia.dudas)L.push(`🤖 <b>${ia.dudas}</b> son dudas (${ia.pct}%)${ia.topDudas.length?`, sobre todo ${ia.topDudas.slice(0,2).map(d=>d.valor).join(' y ')}`:''}.`);
  if(hayColumnasNuevas(rows)){
    const bl=rows.filter(esRequerimientoBL);
    if(bl.length)L.push(`📋 <b>${bl.length}</b> requerimiento${bl.length===1?'':'s'} con BL levantado${bl.some(idTeam)?` (R-ID Team: ${[...new Set(bl.map(idTeam).filter(Boolean))].slice(0,5).map(escHtml).join(', ')})`:''}.`);
    const res=rows.filter(resumenProblema).slice(0,5);
    if(res.length)L.push(`📝 <b>Lo que pide recientemente:</b><ul class="etk-pide">${res.map(r=>`<li><b>#${cv(r,'I')}</b> ${escHtml(resumenProblema(r))}</li>`).join('')}</ul>`);
  }
  if(agentes.length)L.push(`👤 Lo atiende principalmente ${agentes.map(([k,v])=>`<b>${k}</b> (${v})`).join(', ')}.`);
  if(porSem.length>=2){
    const mitad=Math.floor(porSem.length/2),a=porSem.slice(0,mitad).reduce((s,x)=>s+x.n,0)/mitad,b=porSem.slice(mitad).reduce((s,x)=>s+x.n,0)/(porSem.length-mitad);
    const cambio=a?Math.round((b-a)/a*100):null;
    L.push(`📈 Tendencia: ${cambio==null?'sin base para comparar':cambio>15?`<b style="color:#ee6666">al alza</b> (+${cambio}% en la segunda mitad del periodo)`:cambio<-15?`<b style="color:#16a34a">a la baja</b> (${cambio}%)`:'estable'}.`);
  }
  // Recomendación
  const rec=[];
  if(ia.colOk&&ia.pct>=40)rec.push('muchas de sus consultas son dudas: candidato a <b>capacitación personalizada</b> o a artículos del Help Module sobre sus temas principales');
  if(pct(esc,n)>=Math.max(30,(stA?stA.pctDesarrollo:0)+10))rec.push('escala a Desarrollo más que el promedio: revisa si son errores reales o necesidades que ya cubre el sistema');
  if(pct(llam,n)>=60)rec.push('la mayoría llega por llamada: invítalo a levantar ticket para dar seguimiento por escrito');
  if(masViejo&&masViejo.d>30)rec.push(`tiene un ticket abierto de más de 30 días (#${cv(masViejo.r,'I')}): dale seguimiento`);
  if(n/nSem>=5&&!rec.length)rec.push('es un cliente de alto volumen: vale la pena una reunión de seguimiento para entender sus necesidades');

async function fetchCSV(url){
  const delay=ms=>new Promise(res=>setTimeout(res,ms));
  const sheetId=API_SHEET_ID||'';
  const gid=API_GID||'1757881997';
  // Variantes: pub URL guardada, pub URL directa, export URL
  const variantes=[
    url,
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0f2wmDr_QSUDaZKujOMQl3jZ4Vdo0cSz-k2_CT7usxjjXezyo1HSzPqxQRnNP-aL7VowJ5q2BmjA6/pub?gid=1757881997&single=true&output=csv',
    url+(url.includes('?')?'&':'?')+'t='+Date.now(),
  ].filter((u,i,a)=>u&&a.indexOf(u)===i);
  let lastErr;
  for(let i=0;i<variantes.length;i++){
    try{
      if(i>0)await delay(800);
      const r=await fetch(variantes[i],{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status+' en '+variantes[i].substring(0,60));
      const txt=await r.text();
      if(!txt||txt.trim().length<10)throw new Error('Respuesta vacía');
      // Si funcionó con una URL diferente, guardarla para próximas veces
      if(i>0&&variantes[i]!==url)localStorage.setItem('api_pub_url',variantes[i]);
      return parseCSV(txt);
    }catch(e){
      lastErr=e;
      console.warn('fetchCSV intento '+(i+1)+'/'+variantes.length+' falló:',e.message);
    }
  }
  throw new Error('No se pudo conectar al CSV. Republica el Sheets: Archivo → Publicar en la web → Ant_Tickets → CSV. ('+lastErr?.message+')');
}
function fmtDate(str){if(!str||str==='—')return'—';const d=new Date(str);if(isNaN(d))return str;const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDateShort(str){if(!str)return'—';const d=new Date(str);if(isNaN(d))return str;const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();}
function downloadCSV(tickets,filename){if(!tickets||!tickets.length)return;const cols=['id','subject','org','status','priority','rangoStr','agente','dResp','areaAsig','score','created','ultimoSeg'];const heads=['Ticket','Asunto','Empresa','Estado','Prioridad','Antigüedad','Agente','Desarrollador','Área','Score','Creado','Último seguimiento'];const rows=[heads.join(','),...tickets.map(t=>cols.map(k=>{const v=String(t[k]||'').replace(/,/g,';').replace(/\n/g,' ');return v.includes('"')?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));a.download=(filename||'export')+'.csv';a.click();}
function parseCSV(text){const lines=text.split('\n');function clean(v){return(v||'').replace(/^"|"$/g,'').trim();}let hi=-1;for(let i=0;i<Math.min(15,lines.length);i++){const r=csvLine(lines[i]).map(v=>clean(v).toLowerCase());const hasId=r.some(v=>v==='id'||v==='n.'||v==='n');const hasStatus=r.some(v=>['estado','status'].includes(v));const hasExtra=r.some(v=>v.includes('traducci')||v.includes('etiqueta')||v==='prioridad');if(hasId&&hasStatus&&hasExtra){hi=i;break;}if(hi<0&&hasId&&hasStatus){hi=i;}}if(hi<0)return{rows:[],headers:[]};const headers=csvLine(lines[hi]).map(v=>clean(v));const idIdx=headers.findIndex(h=>h.toLowerCase()==='id');if(idIdx<0)return{rows:[],headers:[]};const rows=[];for(let i=hi+1;i<lines.length;i++){const line=lines[i];if(!line.trim())continue;const vals=csvLine(line);const idVal=clean(vals[idIdx]||'');if(!/^\d{5,7}$/.test(idVal))continue;const row={};headers.forEach((h,j)=>{if(h)row[h]=clean(vals[j]);});rows.push(row);}return{rows,headers};}
function csvLine(line){const r=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){r.push(cur);cur='';}else cur+=ch;}r.push(cur);return r;}
