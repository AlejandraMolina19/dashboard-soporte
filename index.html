<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Supervisor — Santi Soluciones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f2f7;--sur:#fff;--sur2:#f7f8fc;--sur3:#eef0f6;
  --bdr:#e2e5ef;--bdr2:#d0d4e8;
  --txt:#111827;--txt2:#4b5568;--txt3:#9ca3af;
  --acc:#2563eb;--acc2:#eff4ff;--acc3:#dbeafe;
  --grn:#16a34a;--red:#dc2626;--red2:#fef2f2;--red3:#fee2e2;
  --org:#d97706;--org2:#fffbeb;--pur:#7c3aed;--pur2:#f5f3ff;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:48px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:30;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:28px;height:28px;border-radius:6px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.brand-name{font-size:13px;font-weight:700;color:var(--txt)}
.brand-sep{width:1px;height:18px;background:var(--bdr);margin:0 4px}
.brand-sub{font-size:11px;color:var(--txt3);font-weight:500}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2);font-family:var(--mono)}
.chip.live{color:var(--grn);background:#f0fdf4;border-color:#bbf7d0}
.ubtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.ubtn:hover{background:#1d4ed8}
.ubtn:disabled{opacity:.5;cursor:not-allowed}
.ubtn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.nav{display:flex;padding:0 12px;background:var(--sur);border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:0 14px;height:40px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.ntab:hover{color:var(--txt2)}
.ntab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--acc3);color:var(--acc);font-family:var(--mono)}
.main{flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.slbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kc{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--sh)}
.kc:hover{border-color:var(--bdr2);box-shadow:var(--sh2);transform:translateY(-1px)}
.kc.active{box-shadow:0 0 0 3px var(--acc3),var(--sh2)}
.kc-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.kc-arrow{font-size:10px;font-weight:700;color:var(--txt3);opacity:0;transition:opacity .15s}
.kc:hover .kc-arrow,.kc.active .kc-arrow{opacity:1}
.kc-val{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.04em;margin-bottom:4px;font-family:var(--mono)}
.kc-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.kc-sub{font-size:10px;color:var(--txt3);margin-top:2px}
.kc-bar{height:3px;border-radius:2px;margin-top:12px;background:var(--sur3);overflow:hidden}
.kc-fill{height:100%;border-radius:2px;transition:width 1s ease}
.kc-hint{font-size:10px;color:var(--txt3);margin-top:4px}
.charts-row{display:grid;grid-template-columns:240px 1fr 1fr;gap:12px}
@media(max-width:920px){.charts-row{grid-template-columns:1fr 1fr}}
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.ch{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.ct{font-size:12px;font-weight:700;color:var(--txt)}
.cb{padding:14px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--txt2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.detail-card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.detail-head{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--bdr);transition:background .2s}
.detail-title{font-size:13px;font-weight:700;color:var(--txt)}
.detail-meta{display:flex;align-items:center;gap:8px}
.detail-count{font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:10px}
.detail-clear{background:none;border:1px solid var(--bdr);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--txt3);font-family:var(--font)}
.detail-clear:hover{background:var(--sur2);color:var(--txt)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
thead th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)}
tbody tr:last-child td{border-bottom:none}
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:var(--mono)}
.sel{background:var(--sur);border:1px solid var(--bdr);color:var(--txt);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:500;font-family:var(--font);cursor:pointer}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.ring{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.msk{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:48px;backdrop-filter:blur(3px)}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);padding:22px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.12);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mttl{font-size:15px;font-weight:700;line-height:1.4;flex:1;margin-right:10px}
.mx{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--txt3);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mx:hover{background:var(--sur3);color:var(--txt)}
.mdv{height:1px;background:var(--bdr);margin:12px 0}
.mr{display:flex;gap:8px;margin-bottom:8px;font-size:12px}
.ml{color:var(--txt3);min-width:145px;flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.mv{color:var(--txt);font-weight:500}
.score-block{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.score-num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.tbox{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.empty{padding:32px;text-align:center;color:var(--txt3);font-size:13px;font-weight:500}
/* Agent card active state */
.agent-card-active{border-color:#2563eb !important;box-shadow:0 0 0 3px #dbeafe,var(--sh2) !important}
/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--sur);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.back-btn:hover{background:var(--sur2);border-color:var(--bdr2);color:var(--txt)}
</style>
</head>
<body>

<div class="tb">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="brand">
      <div class="brand-icon">SS</div>
      <span class="brand-name">Santi Soluciones</span>
      <div class="brand-sep"></div>
      <span class="brand-sub">Dashboard Supervisor</span>
    </div>
    <div class="chips">
      <span class="chip live">● En línea</span>
      <span class="chip" id="cf">–</span>
      <span class="chip" id="cs">–</span>
      <span class="chip" id="ct">–</span>
      <span class="chip" id="cu" style="color:var(--txt3)">Sin actualizar</span>
    </div>
  </div>
  <button class="ubtn" id="ubtn" onclick="loadData()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Actualizar datos
  </button>
</div>

<!-- Solo 2 pestañas: Indicadores y Op. Interna -->
<div class="nav" id="main-nav">
  <button class="ntab on" onclick="go('ind')">Indicadores <span class="nb" id="nb-ind">–</span></button>
  <button class="ntab" onclick="go('int')">Op. Interna <span class="nb" id="nb-int">–</span></button>
</div>

<div class="main">
  <div class="ldr" id="ldr"><div class="ring"></div><div style="font-size:12px;color:var(--txt3);font-weight:500" id="ls">Conectando con Google Sheets…</div></div>
  <div class="view" id="v-ind"></div>
  <div class="view" id="v-int"></div>
</div>

<div class="msk" id="msk" onclick="if(event.target===this)cm()"><div class="mbox" id="mb"></div></div>

<script>
const API='https://docs.google.com/spreadsheets/d/e/2PACX-1vS0f2wmDr_QSUDaZKujOMQl3jZ4Vdo0cSz-k2_CT7usxjjXezyo1HSzPqxQRnNP-aL7VowJ5q2BmjA6/pub?gid=1757881997&single=true&output=csv';
const MN=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

const PCOLORS={urgent:'#FF5C5C',high:'#FF9A3C',normal:'#4B9BFF',low:'#8BC4FF'};
const PC={
  urgent:{t:'Urgente',c:'#FF5C5C',bg:'#FFF0F0'},
  high:{t:'Alto',c:'#FF9A3C',bg:'#FFF8EF'},
  normal:{t:'Normal',c:'#4B9BFF',bg:'#EFF6FF'},
  low:{t:'Bajo',c:'#8BC4FF',bg:'#F0F7FF'},
  '':{t:'—',c:'#9ca3af',bg:'#f9fafb'}
};
const SC={
  open:{t:'Abierto',c:'#dc2626',bg:'#fef2f2'},
  pending:{t:'Pendiente',c:'#d97706',bg:'#fffbeb'},
  solved:{t:'Resuelto',c:'#16a34a',bg:'#f0fdf4'},
  '':{t:'—',c:'#9ca3af',bg:'#f9fafb'}
};
const SLA_BANDS=[
  {max:7,k:'n',t:'≤7d',c:'#22C55E'},
  {max:30,k:'r',t:'8-30d',c:'#3B82F6'},
  {max:90,k:'s',t:'31-90d',c:'#F59E0B'},
  {max:365,k:'c',t:'91-365d',c:'#EF4444'},
  {max:99999,k:'p',t:'+365d',c:'#6B7280'}
];

let T=[], CH={}, TAB='ind', AKPI=null, HDR=[];

const el=id=>document.getElementById(id);
const bdg=(t,c,bg)=>`<span class="b" style="background:${bg};color:${c}">${t}</span>`;
function wk(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}

function parseDias(str){
  if(!str)return -1;
  const s=str.trim().toLowerCase();
  if(s==='corriente')return 0;
  const m=s.match(/(\d+)/);
  return m?parseInt(m[1]):-1;
}
function isSlaVencido(str){return parseDias(str)>=7;}
function getRangoColor(str){
  const d=parseDias(str);
  if(d<=0)return'#22C55E';if(d<=7)return'#22C55E';
  if(d<=30)return'#3B82F6';if(d<=90)return'#F59E0B';
  if(d<=365)return'#EF4444';return'#6B7280';
}
function isSinSeguimiento(fechaStr,now){
  if(!fechaStr||fechaStr.trim()==='')return false;
  const d=new Date(fechaStr);
  if(isNaN(d))return false;
  return(now-d)/86400000>3;
}

// ── mapRows — Agente siempre de col M (posición 12), Área de col N (posición 13) ──
function mapRows(rows,headers){
  if(!rows.length)return[];
  HDR=headers||Object.keys(rows[0]);
  const colE=HDR[4]||'';   // Último seguimiento
  const colG=HDR[6]||'';   // Empresa
  const colK=HDR[10]||'';  // Creado
  const colM=HDR[12]||'';  // Agente (SIEMPRE col M)
  const colN=HDR[13]||'';  // Área asignada (col N)
  const colU=HDR[20]||'';  // Desarrollador

  const keys=HDR;
  function fkv(pats){return keys.find(k=>pats.some(p=>{try{return new RegExp(p,'i').test(k);}catch{return false;}}));}
  const kId=fkv(['^ID$','^Id$','^id$']);
  const kSt=fkv(['^Estado$','^Status$']);
  const kPr=fkv(['^Prioridad$','^Priority$']);
  const kSub=fkv(['^Asunto$','^Subject$']);
  const kAssign=fkv(['Agente asignado','Assignee Name','Assignee']);
  const kSResp=fkv(['Responsable Soporte','S-Responsable','s-responsable']);
  const kRango=fkv(['Antigüedad.*ETIQUETA','Antiguedad.*ETIQUETA','antigüedad.*etiq']);
  const kTiempo=fkv(['Horas de atraso','tiempo transcurrido','horas.*atraso']);
  const kMesAnt=fkv(['Antigüedad.*Mes','Mes$','^Mes$']);

  const now=new Date();
  const ST=[{d:0,s:0},{d:1,s:1},{d:2,s:2},{d:3,s:3},{d:4,s:5},{d:5,s:7},{d:6,s:9},{d:7,s:12},{d:15,s:20},{d:30,s:30},{d:45,s:40},{d:60,s:50},{d:90,s:60},{d:120,s:68},{d:180,s:75},{d:240,s:80},{d:360,s:88},{d:720,s:99}];
  const PS={urgent:400,high:300,normal:200,low:100,'':0};

  return rows.map(r=>{
    const id=parseInt(kId?r[kId]:'');if(!id||isNaN(id))return null;
    const priority=(kPr?r[kPr]||'':'').toLowerCase().trim();
    const status=(kSt?r[kSt]||'':'').toLowerCase().trim();
    const rangoStr=(kRango?r[kRango]||'':'').trim();
    const crRaw=(colK&&r[colK]?r[colK]:r[colE]||'').trim();
    const crDate=crRaw?new Date(crRaw):null;
    const created=crDate&&!isNaN(crDate)?crDate.toISOString().split('T')[0]:'';
    const days=created?Math.max(0,Math.floor((now-new Date(created))/86400000)):0;
    let brSc=0;for(const e of ST){if(days>=e.d)brSc=e.s;else break;}
    const score=(PS[priority]||0)+brSc;
    function act(s){if(s>=350)return{t:'Resolver hoy',c:'#dc2626'};if(s>=220)return{t:'Atender hoy',c:'#d97706'};if(s>=200)return{t:'Mañana',c:'#2563eb'};if(s>=100)return{t:'Esta semana',c:'#6b7280'};return{t:'—',c:'#9ca3af'};}
    let tiempo='';
    if(kTiempo&&r[kTiempo]&&/\d+:\d{2}:\d{2}/.test(r[kTiempo])){tiempo=r[kTiempo].trim();}
    else{for(const v of Object.values(r)){if(/^\d{1,5}:\d{2}:\d{2}$/.test((v||'').trim())){tiempo=v.trim();break;}}}
    const areaN=(colN?r[colN]||'':'').trim();
    const isSinAsignar=/sin\s+asignar|sin\s+clasificar/i.test(areaN);
    const org=colG?r[colG]||'':'';
    const ultimoSegRaw=(colE?r[colE]||'':'').trim();
    // Agente SIEMPRE de col M
    const agenteVal=colM?r[colM]||'':'';
    return{
      id,status,priority,
      subject:kSub?r[kSub]||'':'',
      org,
      agente:agenteVal,         // col M siempre
      areaAsig:areaN,            // col N
      dResp:colU?r[colU]||'':'',
      sResp:kSResp?r[kSResp]||'':'',
      assignee:kAssign?r[kAssign]||'':'',
      created,days,rangoStr,
      isSla:isSlaVencido(rangoStr),
      isSinAsignar,
      sinSeguimiento:isSinSeguimiento(ultimoSegRaw,now),
      createdFmt:fmtDateShort(crRaw),
      score,action:act(score),
      mes:created?MN[new Date(created).getMonth()+1]||'—':'—',
      mesAnt:kMesAnt?r[kMesAnt]||'':'',
      tiempo,ultimoSeg:ultimoSegRaw,
    };
  }).filter(Boolean);
}

// ── Chart helpers ────────────────────────────────────────────────────────────
function mkChart(id,type,labels,data,colors,horiz,onClickFn){
  if(CH[id])CH[id].destroy();
  const ctx=el(id);if(!ctx)return;
  const opts={
    responsive:true,maintainAspectRatio:false,
    indexAxis:horiz?'y':'x',
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{label:c=>`${c.raw} tickets`},backgroundColor:'#111827',titleColor:'#9ca3af',bodyColor:'#f9fafb',cornerRadius:6,padding:8}
    },
    scales:type==='doughnut'?{}:{
      x:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780',drawBorder:false}},
      y:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780'}}
    }
  };
  if(onClickFn){
    opts.onClick=(e,elements)=>{if(elements.length>0){const idx=elements[0].index;onClickFn(labels[idx]);}};
    ctx.style.cursor='pointer';
  }
  CH[id]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,borderRadius:type==='bar'?4:0,hoverBackgroundColor:colors.map(c=>c+'CC')}]},options:opts});
}

// ── Diagnóstico ──────────────────────────────────────────────────────────────
function getDiagnosis(tickets){
  if(!tickets||!tickets.length)return'';
  const total=tickets.length;
  const urg=tickets.filter(t=>t.priority==='urgent').length;
  const hi=tickets.filter(t=>t.priority==='high').length;
  const sla=tickets.filter(t=>t.isSla).length;
  const sinSeg=tickets.filter(t=>t.sinSeguimiento).length;
  const sinResp=tickets.filter(t=>t.isSinAsignar).length;
  const criticos=tickets.filter(t=>t.score>=350).length;
  const maxDias=Math.max(...tickets.map(t=>parseDias(t.rangoStr)).filter(d=>d>=0));
  const items=[];
  if(criticos>0)items.push(`<span style="color:#EF4444;font-weight:600">🚨 ${criticos} ticket${criticos>1?'s':''} crítico${criticos>1?'s':''}</span> con score ≥350 requieren atención inmediata.`);
  if(urg>0)items.push(`<span style="color:#FF5C5C;font-weight:600">⚡ ${urg} urgente${urg>1?'s':''}${hi>0?` y <span style="color:#FF9A3C;font-weight:600">${hi} de alta prioridad</span>`:''}</span> representan el ${Math.round((urg+hi)/total*100)}% de esta vista.`);
  if(sla>0)items.push(`<span style="color:#F59E0B;font-weight:600">🕐 ${sla} ticket${sla>1?'s':''}</span> con SLA vencido (+7d).`);
  if(sinSeg>0)items.push(`<span style="color:#e11d48;font-weight:600">📭 ${sinSeg} ticket${sinSeg>1?'s':''}</span> sin seguimiento en más de 3 días.`);
  if(sinResp>0)items.push(`<span style="color:#7c3aed;font-weight:600">👤 ${sinResp} ticket${sinResp>1?'s':''}</span> sin responsable asignado.`);
  if(maxDias>180)items.push(`El ticket más antiguo lleva <strong>${maxDias} días</strong>.`);
  if(!items.length)return'';
  return`<div style="background:var(--sur2);border:1px solid var(--bdr);border-radius:0 0 var(--rl) var(--rl);padding:14px 18px;border-top:none">
    <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px">Diagnóstico</div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:5px">${items.map(i=>`<li style="font-size:12px;color:var(--txt2);line-height:1.5">• ${i}</li>`).join('')}</ul>
  </div>`;
}

// ── KPI Definitions para Indicadores ────────────────────────────────────────
const KDEF=[
  {key:'total',  label:'Total tickets',       color:'#2563eb', fn:()=>T},
  {key:'urgent', label:'Urgentes',            color:'#FF5C5C', fn:()=>T.filter(t=>t.priority==='urgent')},
  {key:'high',   label:'Alta prioridad',      color:'#FF9A3C', fn:()=>T.filter(t=>t.priority==='high')},
  {key:'sla',    label:'Vencidos SLA +7d',    color:'#F59E0B', fn:()=>T.filter(t=>t.isSla)},
  {key:'sinSeg', label:'Sin seguimiento +3d', color:'#e11d48', fn:()=>T.filter(t=>t.sinSeguimiento)},
  {key:'sinA',   label:'Sin responsable',     color:'#7c3aed', fn:()=>T.filter(t=>t.isSinAsignar)},
];

// ── Render Indicadores ────────────────────────────────────────────────────────
function renderInd(){
  const kpis=KDEF.map(k=>{
    const list=k.fn();
    const pct=T.length?Math.round(list.length/T.length*100):0;
    const isA=AKPI===k.key;
    return`<div class="kc${isA?' active':''}" style="${isA?`border-color:${k.color};box-shadow:0 0 0 3px ${k.color}20,var(--sh2)`:''}" onclick="setKPI('${k.key}')">
      <div class="kc-top"><span class="kc-arrow" style="color:${k.color}">▼</span></div>
      <div class="kc-val" style="color:${k.color}">${list.length}</div>
      <div class="kc-lbl">${k.label}</div>
      <div class="kc-bar"><div class="kc-fill" style="width:${pct}%;background:linear-gradient(90deg,${k.color},${k.color}88)"></div></div>
      <div class="kc-hint">Ver detalle · ${pct}% del total</div>
    </div>`;
  }).join('');

  const orgMap={};T.forEach(t=>{const o=(t.org||'Sin clasificar').trim()||'Sin clasificar';orgMap[o]=(orgMap[o]||0)+1;});
  const orgS=Object.entries(orgMap).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const orgH=Math.max(180,orgS.length*32);
  const rVals=[...new Set(T.map(t=>t.rangoStr).filter(Boolean))];
  rVals.sort((a,b)=>parseDias(a)-parseDias(b));
  const rCounts=rVals.map(r=>T.filter(t=>t.rangoStr===r).length);
  const rColors=rVals.map(r=>getRangoColor(r));

  el('v-ind').innerHTML=`
    <div>
      <div class="slbl">Indicadores clave de operación</div>
      <div class="kpi-grid">${kpis}</div>
    </div>
    <div class="charts-row">
      <div class="ccard">
        <div class="ch"><span class="ct">Por prioridad</span></div>
        <div class="cb">
          <div style="position:relative;height:170px"><canvas id="cp"></canvas></div>
          <div class="chart-legend" id="pri-legend"></div>
        </div>
      </div>
      <div class="ccard">
        <div class="ch"><span class="ct">Antigüedad de tickets</span><span style="font-size:10px;color:var(--txt3)">clic para filtrar</span></div>
        <div class="cb"><div style="position:relative;height:220px;width:100%;overflow:hidden"><canvas id="ca"></canvas></div></div>
      </div>
      <div class="ccard">
        <div class="ch"><span class="ct">Tickets por empresa</span><span style="font-size:10px;color:var(--txt3)">${T.length} total</span></div>
        <div class="cb"><div style="position:relative;height:${orgH}px"><canvas id="cag"></canvas></div></div>
      </div>
    </div>
    <div class="detail-card" id="detail-card">
      <div class="detail-head" id="detail-head" style="background:#fef2f2;border-bottom:1px solid #fecaca">
        <span class="detail-title" id="detail-title">Sin responsable asignado</span>
        <div class="detail-meta">
          <span class="detail-count" id="detail-count" style="background:#fee2e2;color:#dc2626">0</span>
          <button class="detail-clear" id="detail-clear" onclick="clearFilter()" style="display:none">✕ Limpiar filtro</button>
          <button id="detail-dl" style="background:none;border:1px solid var(--bdr);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--txt2);font-family:var(--font);display:none">⬇ CSV</button>
        </div>
      </div>
      <div class="tw" id="detail-body"></div>
    </div>`;

  const priData=['urgent','high','normal','low'].map(k=>T.filter(t=>t.priority===k).length);
  const priColors=[PCOLORS.urgent,PCOLORS.high,PCOLORS.normal,PCOLORS.low];
  CH['cp']&&CH['cp'].destroy();
  const cpCtx=el('cp');
  if(cpCtx){
    CH['cp']=new Chart(cpCtx,{type:'doughnut',
      data:{labels:['Urgente','Alto','Normal','Bajo'],datasets:[{data:priData,backgroundColor:priColors,borderWidth:2,borderColor:'#ffffff',hoverBorderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw} tickets`},backgroundColor:'#111827',bodyColor:'#f9fafb',cornerRadius:6,padding:8}}}});
  }
  const legEl=el('pri-legend');
  if(legEl){
    const priLabels=['Urgente','Alto','Normal','Bajo'];
    legEl.innerHTML=priLabels.map((l,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${priColors[i]}"></div>${l}: ${priData[i]}</div>`).join('');
  }
  mkChart('ca','bar',rVals,rCounts,rColors,false,(label)=>{filterByChart('rango',label);});
  mkChart('cag','bar',orgS.map(x=>x[0]),orgS.map(x=>x[1]),orgS.map(()=>'#4B9BFF'),true,(label)=>{filterByChart('org',label);});
  renderDetail(AKPI,null,null);
}

let CHART_FILTER={type:null,value:null};

function filterByChart(type,value){
  CHART_FILTER={type,value};AKPI=null;
  document.querySelectorAll('.kc').forEach(c=>c.classList.remove('active'));
  renderDetail(null,type,value);
}
function setKPI(key){
  AKPI=AKPI===key?null:key;CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.kc').forEach((c,i)=>{
    const k=KDEF[i];if(!k)return;
    c.classList.toggle('active',AKPI===k.key);
    c.style.borderColor=AKPI===k.key?k.color:'';
    c.style.boxShadow=AKPI===k.key?`0 0 0 3px ${k.color}20,var(--sh2)`:'';
  });
  renderDetail(AKPI,null,null);
}
function clearFilter(){
  AKPI=null;CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.kc').forEach(c=>{c.classList.remove('active');c.style.borderColor='';c.style.boxShadow='';});
  renderDetail(null,null,null);
}

function renderDetail(kpiKey,chartType,chartValue){
  const titleEl=el('detail-title');const countEl=el('detail-count');const bodyEl=el('detail-body');
  const headEl=el('detail-head');const clearEl=el('detail-clear');
  if(!titleEl||!bodyEl)return;
  let tickets=[],title='Sin responsable asignado',headStyle='background:#fef2f2;border-bottom:1px solid #fecaca',countStyle='background:#fee2e2;color:#dc2626',showClear=false;
  if(chartType&&chartValue){
    showClear=true;title=chartValue;
    if(chartType==='rango'){tickets=T.filter(t=>t.rangoStr===chartValue);const rc=getRangoColor(chartValue);headStyle=`background:${rc}15;border-bottom:1px solid ${rc}40`;countStyle=`background:${rc}25;color:${rc}`;}
    else if(chartType==='org'){tickets=T.filter(t=>t.org===chartValue);headStyle='background:#eff4ff;border-bottom:1px solid #bfdbfe';countStyle='background:#bfdbfe;color:#1e40af';}
  } else if(kpiKey){
    showClear=true;
    const kd=KDEF.find(k=>k.key===kpiKey);
    if(kd){tickets=kd.fn();title=kd.label;headStyle=`background:${kd.color}12;border-bottom:1px solid ${kd.color}30`;countStyle=`background:${kd.color}25;color:${kd.color}`;}
  } else {tickets=T.filter(t=>t.isSinAsignar);}
  if(titleEl)titleEl.textContent=title;
  if(countEl){countEl.textContent=tickets.length;countEl.style.cssText=countStyle+';font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:10px';}
  headEl.style.cssText=headStyle;
  if(clearEl)clearEl.style.display=showClear?'':'none';
  const dlBtn=el('detail-dl');
  if(dlBtn){dlBtn.onclick=()=>downloadCSV(tickets,(kpiKey||chartValue||'tickets').replace(/[^a-zA-Z0-9]/g,'_'));dlBtn.style.display=tickets.length?'':'none';}
  if(!tickets.length){bodyEl.innerHTML='<div class="empty" style="color:#16a34a">✓ Sin tickets en esta categoría</div>';return;}
  window._detailTickets=tickets;
  function sortByAge(list){return[...list].sort((a,b)=>{const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);return db!==da?db-da:b.score-a.score;});}
  function buildRows(list){
    return list.map((t,i)=>{
      const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';
      const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
      return`<tr onclick="om(${t.id})">
        <td style="color:var(--txt3);font-weight:600;width:30px;font-size:11px">${i+1}</td>
        <td><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td>
        <td style="max-width:200px">${t.subject||'—'}</td>
        <td style="color:var(--txt2)">${t.org||'—'}</td>
        <td>${bdg(st.t,st.c,st.bg)}</td><td>${bdg(pr.t,pr.c,pr.bg)}</td>
        <td>${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</td>
        <td style="color:var(--txt2);font-size:11px">${t.createdFmt||'—'}</td>
        <td style="color:var(--txt2)">${t.agente||'—'}</td>
        <td style="color:var(--txt2)">${t.dResp||'—'}</td>
        <td style="color:var(--txt2);font-size:11px">${t.areaAsig||'—'}</td>
        <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
      </tr>`;
    }).join('');
  }
  const filterBar=`<div style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bdr);background:var(--sur2)">
    <select class="sel" id="df-area" onchange="refilterDetail()" style="font-size:11px"><option value="">Todas las áreas</option>${[...new Set(tickets.map(t=>t.areaAsig).filter(Boolean))].sort().map(a=>`<option>${a}</option>`).join('')}</select>
    <select class="sel" id="df-status" onchange="refilterDetail()" style="font-size:11px"><option value="">Todos los estados</option><option value="open">Abierto</option><option value="pending">Pendiente</option></select>
    <select class="sel" id="df-pri" onchange="refilterDetail()" style="font-size:11px"><option value="">Todas las prioridades</option><option value="urgent">Urgente</option><option value="high">Alto</option><option value="normal">Normal</option><option value="low">Bajo</option></select>
    <span style="font-size:11px;color:var(--txt3);align-self:center" id="df-count">${tickets.length} tickets</span>
  </div>`;
  bodyEl.innerHTML=filterBar+`<div class="tw"><table id="detail-tbl"><thead><tr><th style="width:30px">#</th><th>Ticket</th><th>Asunto</th><th>Empresa</th><th>Estado</th><th>Prioridad</th><th>Antigüedad</th><th>Creado</th><th>Agente</th><th>Desarrollador</th><th>Área</th><th>Score</th></tr></thead><tbody>${buildRows(sortByAge(tickets))}</tbody></table></div>`+getDiagnosis(tickets);
}

function refilterDetail(){
  const fa=el('df-area')?.value||'',fs=el('df-status')?.value||'',fp=el('df-pri')?.value||'';
  const base=window._detailTickets||[];
  const list=base.filter(t=>{if(fa&&t.areaAsig!==fa)return false;if(fs&&t.status!==fs)return false;if(fp&&t.priority!==fp)return false;return true;}).sort((a,b)=>b.score-a.score);
  const tbody=el('detail-tbl')?.querySelector('tbody');
  if(tbody){
    const sorted=[...list].sort((a,b)=>{const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);return db!==da?db-da:b.score-a.score;});
    tbody.innerHTML=sorted.map((t,i)=>{
      const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';
      const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
      return`<tr onclick="om(${t.id})">
        <td style="color:var(--txt3);font-weight:600;width:30px;font-size:11px">${i+1}</td>
        <td><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td>
        <td style="max-width:200px">${t.subject||'—'}</td>
        <td style="color:var(--txt2)">${t.org||'—'}</td>
        <td>${bdg(st.t,st.c,st.bg)}</td><td>${bdg(pr.t,pr.c,pr.bg)}</td>
        <td>${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</td>
        <td style="color:var(--txt2);font-size:11px">${t.createdFmt||'—'}</td>
        <td style="color:var(--txt2)">${t.agente||'—'}</td>
        <td style="color:var(--txt2)">${t.dResp||'—'}</td>
        <td style="color:var(--txt2);font-size:11px">${t.areaAsig||'—'}</td>
        <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
      </tr>`;
    }).join('');
    const cnt=el('df-count');if(cnt)cnt.textContent=list.length+' tickets';
  }
}

// ── Modal ────────────────────────────────────────────────────────────────────
function om(id){
  const t=T.find(x=>x.id===id);if(!t)return;
  const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#6b7280';
  const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
  el('mb').innerHTML=`
    <div class="mhdr"><div class="mttl">${t.subject||'Ticket #'+t.id}</div><button class="mx" onclick="cm()">×</button></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${bdg(st.t,st.c,st.bg)} ${bdg(pr.t,pr.c,pr.bg)} ${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</div>
    <div class="score-block" style="border-color:${sc}25">

    </div>
    ${t.tiempo?`<div class="tbox"><div><div style="font-family:var(--mono);font-size:18px;font-weight:600;color:#16a34a">${t.tiempo}</div><div style="font-size:11px;color:var(--txt3);margin-top:2px">Tiempo en espera</div></div></div>`:''}
    <div class="mdv"></div>
    <div class="mr"><span class="ml">ID Ticket</span><span class="mv"><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none">#${t.id} ↗</a></span></div>
    <div class="mr"><span class="ml">Empresa</span><span class="mv">${t.org||'—'}</span></div>
    <div class="mr"><span class="ml">Creado</span><span class="mv">${fmtDateShort(t.created)}</span></div>

    <div class="mr"><span class="ml">Desarrollador</span><span class="mv">${t.dResp||'—'}</span></div>`;
  el('msk').classList.add('on');
}
function cm(){el('msk').classList.remove('on');}

function intAreaChange(){
  window._intActiveAgent=null;
  el('int-detail-section').style.display='none';
  el('int-agent-section').style.display='';
  intFilt();
}

function intFiltSeg(){
  window._intSeg=!window._intSeg;
  const btn=el('int-seg-btn');
  if(btn){btn.style.background=window._intSeg?'var(--acc)':'var(--acc2)';btn.style.color=window._intSeg?'#fff':'var(--acc)';}
  intFilt();
}

function intClear(){
  const a=el('int-area');if(a)a.value='';
  window._intSeg=false;window._intActiveAgent=null;window._intCurrentArea='';
  const btn=el('int-seg-btn');
  if(btn){btn.style.background='var(--acc2)';btn.style.color='var(--acc)';}
  el('int-detail-section').style.display='none';
  el('int-agent-section').style.display='';
  intFilt();
}

function intFilt(){
  const fa=el('int-area')?.value||'';
  const fseg=window._intSeg||false;
  window._intCurrentArea=fa;

  // Lista base según filtros globales
  let baseList=T.filter(t=>{
    if(fa&&t.areaAsig!==fa)return false;
    if(fseg&&!t.sinSeguimiento)return false;
    return true;
  });

  window._intList=baseList;
  const cnt=el('int-count');if(cnt)cnt.textContent=baseList.length+' tickets';

  // ── KPIs dinámicos (reflejan el área seleccionada) ──
  const kpisEl=el('int-kpis');
  if(kpisEl){
    const tot=baseList.length||1;
    const urg=baseList.filter(t=>t.priority==='urgent').length;
    const hi=baseList.filter(t=>t.priority==='high').length;
    const sinSeg=baseList.filter(t=>t.sinSeguimiento).length;
    const sla=baseList.filter(t=>t.isSla).length;
    const criticos=baseList.filter(t=>t.score>=350).length;
    const sinR=baseList.filter(t=>t.isSinAsignar).length;
    const kpis=[
      {l:'Total tickets',      v:baseList.length, c:'#2563eb', pct:100},
      {l:'Sin seguimiento +3d',v:sinSeg,          c:'#e11d48', pct:Math.round(sinSeg/tot*100)},
      {l:'Vencidos SLA +7d',   v:sla,             c:'#d97706', pct:Math.round(sla/tot*100)},
      {l:'Urgente / Alto',     v:urg+hi,          c:'#FF5C5C', pct:Math.round((urg+hi)/tot*100)},
      {l:'Score crítico ≥350', v:criticos,        c:'#EF4444', pct:Math.round(criticos/tot*100)},
      {l:'Sin responsable',    v:sinR,            c:'#7c3aed', pct:Math.round(sinR/tot*100)},
    ];
    kpisEl.innerHTML=kpis.map(k=>`<div class="kc" style="cursor:default">
      <div class="kc-val" style="color:${k.c}">${k.v}</div>
      <div class="kc-lbl">${k.l}</div>
      <div class="kc-bar"><div class="kc-fill" style="width:${k.pct}%;background:${k.c}40"></div></div>
      <div class="kc-hint">${k.pct}% del total visible</div>
    </div>`).join('');
  }

  // ── Tarjetas de agentes ──────────────────────────────────────────────────
  // Lógica:
  //   - Si área = Desarrollo → agentes únicos de col M que tienen tickets en esa área
  //   - Si área = otra (Soporte, Customer, Implementación, etc.) → col M, validado por col N === área
  //   - Sin filtro de área → todos los agentes únicos de col M (excluyendo "No"/vacíos)

  const cardsEl=el('int-agent-cards');
  if(cardsEl){
    let agentList=[];
    if(fa){
      // Agentes que tienen al menos 1 ticket en el área seleccionada (validado por col N)
      agentList=[...new Set(
        baseList
          .filter(t=>t.areaAsig===fa)
          .map(t=>t.agente)
          .filter(a=>a&&a.toLowerCase()!=='no'&&a.trim()!=='')
      )].sort();
    } else {
      // Sin filtro: todos los agentes de col M
      agentList=[...new Set(
        T.map(t=>t.agente).filter(a=>a&&a.toLowerCase()!=='no'&&a.trim()!=='')
      )].sort();
    }

    cardsEl.innerHTML=agentList.map(ag=>{
      // Tickets del agente dentro del filtro actual
      const atks=baseList.filter(t=>t.agente===ag);
      if(!atks.length)return'';
      const asinSeg=atks.filter(t=>t.sinSeguimiento).length;
      const aurghi=atks.filter(t=>t.priority==='urgent'||t.priority==='high').length;
      const avgScore=Math.round(atks.reduce((s,t)=>s+t.score,0)/atks.length);
      const areas=[...new Set(atks.map(t=>t.areaAsig).filter(Boolean))];
      const devs2=[...new Set(atks.map(t=>t.dResp).filter(d=>d&&d.toLowerCase()!=='no'))];
      const pct=baseList.length?Math.round(atks.length/baseList.length*100):0;
      const initials=ag.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);
      const segColor=asinSeg>5?'#e11d48':asinSeg>2?'#d97706':'#16a34a';
      const isActive=window._intActiveAgent===ag;
      return`<div class="kc${isActive?' agent-card-active':''}" style="cursor:pointer;padding:16px" onclick="intAgentClick('${ag.replace(/'/g,"\\'")}')">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="width:36px;height:36px;border-radius:50%;background:${isActive?'#2563eb':'#dbeafe'};color:${isActive?'#fff':'#1e40af'};font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${initials}</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--txt)">${ag}</div>
            <div style="font-size:10px;color:var(--txt3)">${atks.length} tickets · ${pct}%</div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:11px;color:var(--txt2)">Sin seguimiento +3d</span>
          <span style="font-size:12px;font-weight:700;color:${segColor}">${asinSeg}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:11px;color:var(--txt2)">Urgente / Alto</span>
          <span style="font-size:12px;font-weight:700;color:${aurghi>0?'#d97706':'#16a34a'}">${aurghi}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:11px;color:var(--txt2)">Score promedio</span>
          <span style="font-size:12px;font-weight:700">${avgScore}</span>
        </div>
        <div class="kc-bar"><div class="kc-fill" style="width:${pct}%;background:${isActive?'#2563eb':'#4B9BFF'}"></div></div>
        <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
          ${areas.map(a=>`<span class="b" style="background:#eff4ff;color:#1e40af;font-size:9px">${a}</span>`).join('')}
          ${devs2.length?`<span style="font-size:10px;color:var(--txt3)">Dev: ${devs2.slice(0,2).join(', ')}</span>`:''}
        </div>
        <div style="margin-top:10px;text-align:center;font-size:10px;font-weight:600;color:var(--acc)">▼ Ver tickets</div>
      </div>`;
    }).join('');
  }

  // Si hay agente activo, renderizar su detalle
  if(window._intActiveAgent){
    intRenderAgentDetail(window._intActiveAgent,baseList);
  }
}

function intAgentClick(ag){
  window._intActiveAgent=ag;
  // Ocultar sección global, mostrar detalle
  el('int-detail-section').style.display='';
  el('int-global-tbl-card').style.display='none';
  // Re-render cards para marcar activo
  intFilt();
  // Scroll al detalle
  setTimeout(()=>{
    const d=el('int-detail-section');
    if(d)d.scrollIntoView({behavior:'smooth',block:'start'});
  },150);
}

function intBackToCards(){
  window._intActiveAgent=null;
  el('int-detail-section').style.display='none';
  // Re-render para limpiar estado activo en tarjetas
  intFilt();
  // Scroll a la sección de tarjetas
  setTimeout(()=>{
    const c=el('int-agent-cards');
    if(c)c.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

function intRenderAgentDetail(ag,baseList){
  const atks=[...baseList.filter(t=>t.agente===ag)].sort((a,b)=>{
    const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);
    return db!==da?db-da:b.score-a.score;
  });
  window._intAgentTickets=atks;

  const detailSection=el('int-detail-section');
  if(detailSection)detailSection.style.display='';

  const nameEl=el('int-detail-name');if(nameEl)nameEl.textContent=ag;
  const subEl=el('int-detail-sub');if(subEl)subEl.textContent=atks.length+' tickets';
  const cntEl=el('int-detail-count');if(cntEl)cntEl.textContent=atks.length;
  const initials=ag.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);
  const avEl=el('int-detail-avatar');if(avEl)avEl.textContent=initials;

  // Mini KPIs del agente
  const kpisEl=el('int-agent-kpis');
  if(kpisEl){
    const tot=atks.length||1;
    const sinSeg=atks.filter(t=>t.sinSeguimiento).length;
    const ug=atks.filter(t=>t.priority==='urgent').length;
    const hi=atks.filter(t=>t.priority==='high').length;
    const sla=atks.filter(t=>t.isSla).length;
    const crit=atks.filter(t=>t.score>=350).length;
    [
      {l:'Total',v:atks.length,c:'#2563eb'},
      {l:'Sin seguimiento +3d',v:sinSeg,c:'#e11d48'},
      {l:'SLA vencido',v:sla,c:'#d97706'},
      {l:'Urgente / Alto',v:ug+hi,c:'#FF5C5C'},
      {l:'Score crítico ≥350',v:crit,c:'#EF4444'},
    ].forEach(k=>{/* built below */});
    kpisEl.innerHTML=[
      {l:'Total',          v:atks.length, c:'#2563eb'},
      {l:'Sin seguim. +3d',v:sinSeg,      c:'#e11d48'},
      {l:'SLA vencido',    v:sla,         c:'#d97706'},
      {l:'Urgente / Alto', v:ug+hi,       c:'#FF5C5C'},
      {l:'Crítico ≥350',   v:crit,        c:'#EF4444'},
    ].map(k=>`<div style="text-align:center;padding:6px 4px">
      <div style="font-size:24px;font-weight:700;font-family:var(--mono);color:${k.c}">${k.v}</div>
      <div style="font-size:10px;font-weight:600;color:var(--txt3);margin-top:2px">${k.l}</div>
    </div>`).join('');
  }

  // Tabla de tickets del agente
  const tblEl=el('int-detail-tbl');
  if(!tblEl)return;
  const rows=atks.map((t,i)=>{
    const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';
    const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
    const segFlag=t.sinSeguimiento?`<span style="background:#fef2f2;color:#e11d48;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px">+3d</span>`:'';
    return`<tr onclick="om(${t.id})">
      <td style="color:var(--txt3);font-weight:600;width:30px;font-size:11px">${i+1}</td>
      <td><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td>
      <td style="max-width:200px">${t.subject||'—'}</td>
      <td style="color:var(--txt2)">${t.org||'—'}</td>
      <td>${bdg(st.t,st.c,st.bg)}</td>
      <td>${bdg(pr.t,pr.c,pr.bg)}</td>
      <td>${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</td>
      <td style="color:var(--txt2);font-size:11px">${t.createdFmt||'—'}</td>
      <td style="font-size:11px">${fmtDate(t.ultimoSeg)||'—'} ${segFlag}</td>
      <td style="color:var(--txt2)">${t.dResp||'—'}</td>
      <td style="color:var(--txt2);font-size:11px">${t.areaAsig||'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
    </tr>`;
  }).join('');
  tblEl.innerHTML=`<table><thead><tr>
    <th style="width:30px">#</th><th>Ticket</th><th>Asunto</th><th>Empresa</th>
    <th>Estado</th><th>Prioridad</th><th>Antigüedad</th><th>Creado</th>
    <th>Último seguimiento</th><th>Desarrollador</th><th>Área</th><th>Score</th>
  </tr></thead><tbody>${rows||'<tr><td colspan="12" class="empty">Sin tickets</td></tr>'}</tbody></table>`;
}

function intDownload(){const list=window._intList||[];downloadCSV(list,'operacion_interna');}
function intDownloadAgent(){const list=window._intAgentTickets||[];downloadCSV(list,'agente_'+( window._intActiveAgent||'').replace(/\s+/g,'_'));}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function go(tab){
  TAB=tab;AKPI=null;CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.ntab').forEach((b,i)=>b.classList.toggle('on',['ind','int'][i]===tab));
  ['ind','int'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
  const v=el('v-'+tab);if(v)v.classList.add('on');
  if(tab==='ind')renderInd();
  else if(tab==='int')renderInt();
}

// ── Utilidades ────────────────────────────────────────────────────────────────
async function fetchCSV(csvUrl){
  const url=csvUrl.includes('?')?csvUrl+'&cachebust='+Date.now():csvUrl+'?cachebust='+Date.now();
  const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
  return parseCSV(await res.text());
}

function fmtDate(str){
  if(!str||str==='—')return'—';const d=new Date(str);if(isNaN(d))return str;
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDateShort(str){
  if(!str)return'—';const d=new Date(str);if(isNaN(d))return str;
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();
}
function downloadCSV(tickets,filename){
  if(!tickets.length)return;
  const cols=['id','subject','org','status','priority','rangoStr','agente','dResp','areaAsig','score','created','ultimoSeg'];
  const heads=['Ticket','Asunto','Empresa','Estado','Prioridad','Antigüedad','Agente','Desarrollador','Área','Score','Creado','Último seguimiento'];
  const rows=[heads.join(','),...tickets.map(t=>cols.map(k=>{const v=String(t[k]||'').replace(/,/g,';').replace(/\n/g,' ');return v.includes('"')?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));a.download=filename+'.csv';a.click();
}
function parseCSV(text){
  const lines=text.split('\n');
  function clean(v){return(v||'').replace(/^"|"$/g,'').trim();}
  let hi=-1;
  for(let i=0;i<Math.min(10,lines.length);i++){
    const r=csvLine(lines[i]).map(v=>clean(v).toLowerCase());
    if(r.some(v=>v==='id')&&r.some(v=>['estado','status','prioridad','priority'].includes(v))){hi=i;break;}
  }
  if(hi<0)return{rows:[],headers:[]};
  const headers=csvLine(lines[hi]).map(v=>clean(v));
  const idIdx=headers.findIndex(h=>h.toLowerCase()==='id');
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const line=lines[i];if(!line.trim())continue;
    const vals=csvLine(line);
    const idVal=clean(vals[idIdx]||'');
    if(!/^\d{5,7}$/.test(idVal))continue;
    const row={};headers.forEach((h,j)=>{if(h)row[h]=clean(vals[j]);});rows.push(row);
  }
  return{rows,headers};
}
function csvLine(line){
  const r=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(ch===','&&!q){r.push(cur);cur='';}
    else cur+=ch;
  }r.push(cur);return r;
}
function safeSet(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}

async function loadData(){
  const btn=el('ubtn');btn.disabled=true;btn.classList.add('spin');
  el('ldr').style.display='flex';
  ['ind','int'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
  AKPI=null;CHART_FILTER={type:null,value:null};
  try{
    el('ls').textContent='Leyendo Ant_Tickets…';
    const{rows,headers:hdrs}=await fetchCSV(API);
    T=mapRows(rows,hdrs);
    const now=new Date();
    safeSet('cf',now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase());
    safeSet('cs','SEM '+wk(now));
    safeSet('ct',T.length+' tickets');
    safeSet('cu',now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
    safeSet('nb-ind',T.length);
    safeSet('nb-int',T.length);
    el('ldr').style.display='none';
    ['ind','int'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
    const v=el('v-'+TAB);if(v)v.classList.add('on');
    setTimeout(()=>{
      if(TAB==='ind')renderInd();
      else if(TAB==='int')renderInt();
    },10);
  }catch(e){
    el('ldr').style.display='none';
    const v=el('v-ind');
    if(v){v.classList.add('on');v.innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rl);padding:20px"><div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:6px">Error al cargar datos</div><div style="font-size:12px;color:#6b7280;margin-bottom:14px">${e.message}</div><button onclick="loadData()" style="padding:7px 16px;border-radius:var(--r);border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)">↺ Reintentar</button></div>`;}
    TAB='ind';document.querySelectorAll('.ntab').forEach((b,i)=>b.classList.toggle('on',i===0));
  }finally{btn.disabled=false;btn.classList.remove('spin');}
}
loadData();
</script>
