<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Supervisor — Santi Soluciones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f2f7;
  --sur:#ffffff;
  --sur2:#f7f8fc;
  --sur3:#eef0f6;
  --bdr:#e2e5ef;
  --bdr2:#d0d4e8;
  --txt:#111827;
  --txt2:#4b5568;
  --txt3:#9ca3af;
  --acc:#2563eb;
  --acc2:#eff4ff;
  --acc3:#dbeafe;
  --grn:#16a34a;
  --grn2:#f0fdf4;
  --red:#dc2626;
  --red2:#fef2f2;
  --red3:#fee2e2;
  --org:#d97706;
  --org2:#fffbeb;
  --org3:#fde68a;
  --pur:#7c3aed;
  --pur2:#f5f3ff;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Plus Jakarta Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);
  --shadow:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:58px;
  background:var(--sur);border-bottom:1px solid var(--bdr);
  position:sticky;top:0;z-index:30;gap:12px;flex-wrap:wrap;
  box-shadow:var(--shadow-sm);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{
  width:32px;height:32px;border-radius:8px;
  background:var(--acc);display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:16px;font-weight:700;
  font-family:var(--mono);box-shadow:0 2px 8px rgba(37,99,235,.3);
}
.brand-name{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.01em}
.brand-sep{width:1px;height:20px;background:var(--bdr);margin:0 4px}
.brand-sub{font-size:12px;color:var(--txt3);font-weight:500}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2);
  font-family:var(--mono);letter-spacing:.01em;
}
.chip.live{color:var(--grn);background:var(--grn2);border-color:#bbf7d0}
.upd-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:var(--r);
  border:none;background:var(--acc);
  color:#fff;font-family:var(--font);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
  box-shadow:0 2px 8px rgba(37,99,235,.25);
}
.upd-btn:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.upd-btn:disabled{opacity:.5;cursor:not-allowed}
.upd-btn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* NAV */
.nav{
  display:flex;padding:0 24px;
  background:var(--sur);border-bottom:1px solid var(--bdr);
  overflow-x:auto;gap:0;
}
.nav-tab{
  padding:0 18px;height:46px;
  font-size:13px;font-weight:600;font-family:var(--font);
  color:var(--txt3);border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
  white-space:nowrap;display:flex;align-items:center;gap:7px;
  letter-spacing:-.01em;
}
.nav-tab:hover{color:var(--txt2)}
.nav-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;
  background:var(--sur3);color:var(--txt3);font-family:var(--mono);
  transition:all .15s;
}
.nav-tab.on .nb{background:var(--acc3);color:var(--acc)}

/* MAIN */
.main{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}

/* SECTION LABEL */
.slbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin-bottom:4px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.kpi-card{
  background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--rl);
  padding:16px 18px;cursor:pointer;transition:all .18s;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.kpi-card:hover{border-color:var(--bdr2);box-shadow:var(--shadow);transform:translateY(-1px)}
.kpi-card.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc3),var(--shadow)}
.kpi-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

.kpi-trend{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;font-family:var(--mono)}
.kpi-val{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:4px;font-family:var(--mono)}
.kpi-lbl{font-size:12px;font-weight:600;color:var(--txt2);letter-spacing:-.01em}
.kpi-sub{font-size:10px;color:var(--txt3);margin-top:2px;font-weight:500}
.kpi-bar{height:3px;border-radius:2px;margin-top:14px;background:var(--sur3);overflow:hidden}
.kpi-fill{height:100%;border-radius:2px;transition:width 1s ease}
.kpi-hint{font-size:10px;color:var(--txt3);margin-top:5px;display:flex;align-items:center;gap:3px;font-weight:500}

/* KPI PANEL */
.kpi-panel{
  background:var(--sur);border:1.5px solid var(--acc);border-radius:var(--rl);
  box-shadow:0 0 0 3px var(--acc3),var(--shadow-lg);
  overflow:hidden;animation:panelIn .2s ease;
}
@keyframes panelIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.panel-head{
  padding:12px 18px;background:var(--acc2);
  border-bottom:1px solid var(--acc3);
  display:flex;justify-content:space-between;align-items:center;
}
.panel-title{font-size:13px;font-weight:700;color:var(--acc)}
.panel-count{font-size:11px;font-weight:600;color:var(--txt3);font-family:var(--mono)}
.panel-close{
  background:none;border:none;cursor:pointer;
  width:26px;height:26px;border-radius:6px;
  color:var(--txt3);font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.panel-close:hover{background:var(--acc3);color:var(--acc)}

/* CHART CARD */
.chart-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow-sm)}
.chart-head{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.chart-title{font-size:12px;font-weight:700;color:var(--txt);letter-spacing:-.01em}
.chart-body{padding:16px}
.cbox{position:relative;height:165px}
.charts-row{display:grid;grid-template-columns:220px 1fr 1.4fr;gap:12px}
@media(max-width:900px){.charts-row{grid-template-columns:1fr 1fr}}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
thead th{
  padding:9px 14px;text-align:left;
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);
  white-space:nowrap;
}
tbody td{
  padding:10px 14px;border-bottom:1px solid var(--bdr);
  font-size:12px;color:var(--txt);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:220px;
}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)}
tr.rc td{background:#fff5f5}
tr.rw td{background:#fffbf0}
tr.rm td{background:#f0f6ff}
tbody tr:last-child td{border-bottom:none}

/* BADGES */
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.02em;font-family:var(--mono)}

/* AREA KPIS */
.akrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ak{border-radius:var(--rl);padding:16px;text-align:center;border:1px solid}
.an{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
.al{font-size:10px;font-weight:700;margin-top:5px;letter-spacing:.05em;text-transform:uppercase}

/* SCORE GUIDE */
.sg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.si{font-size:11px;font-weight:600;padding:4px 11px;border-radius:4px;border:1px solid}

/* SEL */
.sel{
  background:var(--sur);border:1px solid var(--bdr);color:var(--txt);
  padding:4px 9px;border-radius:6px;font-size:11px;font-weight:500;
  font-family:var(--font);cursor:pointer;
}
.sel:focus{outline:none;border-color:var(--acc)}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.ring{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.ltxt{font-size:12px;color:var(--txt3);font-weight:500}

/* MODAL */
.msk{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:48px;backdrop-filter:blur(4px)}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);padding:22px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mtitle{font-size:15px;font-weight:700;line-height:1.4;flex:1;margin-right:10px;letter-spacing:-.01em}
.mx{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--txt3);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mx:hover{background:var(--sur3);color:var(--txt)}
.mdv{height:1px;background:var(--bdr);margin:14px 0}
.mr{display:flex;gap:8px;margin-bottom:9px;font-size:13px}
.ml{color:var(--txt3);min-width:145px;flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.mv{color:var(--txt);font-weight:500}
.score-block{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.score-num{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1}
.tbox{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}

/* EMPTY */
.empty{padding:36px;text-align:center;color:var(--txt3);font-size:13px;font-weight:500}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="brand">
      <div class="brand-icon">SS</div>
      <span class="brand-name">Santi Soluciones</span>
      <div class="brand-sep"></div>
      <span class="brand-sub">Dashboard Supervisor</span>
    </div>
    <div class="chips">
      <span class="chip live">● En línea</span>
      <span class="chip" id="cf">–</span>
      <span class="chip" id="cs">–</span>
      <span class="chip" id="ct">–</span>
      <span class="chip" id="cu" style="color:var(--txt3)">Sin actualizar</span>
    </div>
  </div>
  <button class="upd-btn" id="ubtn" onclick="loadData()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Actualizar datos
  </button>
</div>

<div class="nav">
  <button class="nav-tab on" onclick="go('g')">Operación general <span class="nb" id="nb-g">–</span></button>
  <button class="nav-tab" onclick="go('s')">Soporte <span class="nb" id="nb-s">–</span></button>
  <button class="nav-tab" onclick="go('d')">Desarrollo <span class="nb" id="nb-d">–</span></button>
  <button class="nav-tab" onclick="go('a')">Antigüedad</button>
  <button class="nav-tab" onclick="go('t')">Todos los tickets <span class="nb" id="nb-t">–</span></button>
</div>

<div class="main">
  <div id="ldr" class="loader"><div class="ring"></div><div class="ltxt" id="ls">Conectando con Google Sheets…</div></div>
  <div class="view" id="vg"></div>
  <div class="view" id="vs"></div>
  <div class="view" id="vd"></div>
  <div class="view" id="va"></div>
  <div class="view" id="vt"></div>
</div>

<div class="msk" id="msk" onclick="if(event.target===this)cm()"><div class="mbox" id="mb"></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbySvHkMhKE-bY7NHKY2LXKSJ65xbx62Zo10Mbzlm7EbBb-EyIa6CrIv6Siojpq0gfy-0g/exec';
const ST=[{d:0,s:0,l:'Corriente'},{d:1,s:1,l:'1d'},{d:2,s:2,l:'2d'},{d:3,s:3,l:'3d'},{d:4,s:5,l:'4d'},{d:5,s:7,l:'5d'},{d:6,s:9,l:'6d'},{d:7,s:12,l:'7d'},{d:15,s:20,l:'15d'},{d:30,s:30,l:'30d'},{d:45,s:40,l:'45d'},{d:60,s:50,l:'60d'},{d:90,s:60,l:'90d'},{d:120,s:68,l:'120d'},{d:180,s:75,l:'180d'},{d:240,s:80,l:'240d'},{d:300,s:84,l:'300d'},{d:360,s:88,l:'360d'},{d:720,s:99,l:'720d+'}];
const PS={urgent:400,high:300,normal:200,low:100,'':0};
const PC={urgent:{t:'Urgente',c:'#dc2626',bg:'#fef2f2'},high:{t:'Alto',c:'#d97706',bg:'#fffbeb'},normal:{t:'Normal',c:'#2563eb',bg:'#eff4ff'},low:{t:'Bajo',c:'#6b7280',bg:'#f9fafb'},'':{t:'—',c:'#9ca3af',bg:'#f9fafb'}};
const SC={open:{t:'Abierto',c:'#dc2626',bg:'#fef2f2'},pending:{t:'Pendiente',c:'#d97706',bg:'#fffbeb'},'':{t:'—',c:'#9ca3af',bg:'#f9fafb'}};
const MN=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const AB=[{k:'n',t:'≤7d',c:'#16a34a',bg:'#f0fdf4',x:7},{k:'r',t:'8-30d',c:'#2563eb',bg:'#eff4ff',x:30},{k:'s',t:'31-90d',c:'#d97706',bg:'#fffbeb',x:90},{k:'c',t:'91-365d',c:'#dc2626',bg:'#fef2f2',x:365},{k:'p',t:'+365d',c:'#6b7280',bg:'#f9fafb',x:99999}];
let T=[],CH={},TAB='g',AKPI=null;
const el=id=>document.getElementById(id);
const bdg=(t,c,bg)=>`<span class="b" style="background:${bg};color:${c}">${t}</span>`;
function brk(d){let b=ST[0];for(const e of ST){if(d>=e.d)b=e;else break;}return b;}
function age(d){return AB.find(b=>d<=b.x)||AB[4];}
function act(s){if(s>=350)return{i:'🚨',t:'Resolver hoy',c:'rc'};if(s>=220)return{i:'⚠️',t:'Atender hoy',c:'rw'};if(s>=200)return{i:'📋',t:'Mañana',c:'rm'};if(s>=100)return{i:'',t:'Esta semana',c:''};return{i:'',t:'—',c:''};}
function wk(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}
function fk(keys,pats){return keys.find(k=>pats.some(p=>new RegExp(p,'i').test(k)))||null;}

function mapRows(rows){
  if(!rows.length)return[];
  const keys=Object.keys(rows[0]);
  const kId=fk(keys,['^Id$','^ID$']);const kSt=fk(keys,['^Status$']);const kPr=fk(keys,['^Priority$']);
  const kOr=fk(keys,['Organization Name','Org','empresa']);const kSu=fk(keys,['Subject','Asunto']);
  const kSR=fk(keys,['S-Responsable']);const kCr=fk(keys,['Created At','Created_At']);
  const kAs=fk(keys,['Assignee Name','Assignee']);const kDR=fk(keys,['D-Responsable']);
  const kCa=fk(keys,['S-CAUSA','Causa']);const kMo=fk(keys,['S-MODULO','Modulo']);
  const kSI=fk(keys,['S-INTERNA']);const kRa=fk(keys,['Rango','rango','Días']);
  const kTi=fk(keys,['Tipo','tipo','Customer','Implementa']);const kMe=fk(keys,['^Mes$','^mes$']);
  const now=new Date();
  return rows.map(r=>{
    const id=parseInt(kId?r[kId]:'');if(!id||isNaN(id))return null;
    const cr=(kCr?r[kCr]||'':'').split(' ')[0];
    const days=cr?Math.max(0,Math.floor((now-new Date(cr))/86400000)):0;
    const b=brk(days);const pri=(kPr?r[kPr]||'':'').toLowerCase().trim();
    const sc=(PS[pri]||0)+b.s;
    let tiempo='';for(const v of Object.values(r)){if(/^\d{1,4}:\d{2}:\d{2}$/.test((v||'').trim())){tiempo=v.trim();break;}}
    return{id,status:(kSt?r[kSt]||'':'').toLowerCase().trim(),priority:pri,
      org:kOr?r[kOr]||'':'',subject:kSu?r[kSu]||'':'',
      sResp:kSR?r[kSR]||'':'',created:cr,assignee:kAs?r[kAs]||'':'',
      dResp:kDR?r[kDR]||'':'',causa:kCa?r[kCa]||'':'',modulo:kMo?r[kMo]||'':'',
      sinterna:kSI?r[kSI]||'':'',days,bracket:b.l,score:sc,action:act(sc),age:age(days),
      mes:cr?MN[new Date(cr).getMonth()+1]||'—':'—',tiempo,
      rango:kRa?r[kRa]||'':'',tipo:kTi?r[kTi]||'':'',mesAnt:kMe?r[kMe]||'':''};
  }).filter(Boolean);
}

function mkChart(id,type,labels,data,colors,horiz){
  if(CH[id])CH[id].destroy();const ctx=el(id);if(!ctx)return;
  CH[id]=new Chart(ctx,{type,
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,borderRadius:type==='bar'?4:0,hoverBackgroundColor:colors.map(c=>c+'cc')}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw} tickets`},backgroundColor:'#111827',titleColor:'#9ca3af',bodyColor:'#f9fafb',cornerRadius:8,padding:10}},
      scales:type==='doughnut'?{}:{x:{ticks:{color:'#9ca3af',font:{size:10,family:'Plus Jakarta Sans'}},grid:{color:'#f0f2f7',drawBorder:false}},y:{ticks:{color:'#9ca3af',font:{size:10,family:'Plus Jakarta Sans'}},grid:{color:'#f0f2f7'}}}}});
}

// ── Filters map ──────────────────────────────────────────────────────────────
const KDEF=[
  {key:'total',label:'Total tickets',      icon:'',color:'#2563eb',bg:'#eff4ff',fn:()=>T},
  {key:'open', label:'Abiertos',           icon:'',color:'#dc2626',bg:'#fef2f2',fn:()=>T.filter(t=>t.status==='open')},
  {key:'pend', label:'Pendientes',         icon:'',color:'#d97706',bg:'#fffbeb',fn:()=>T.filter(t=>t.status==='pending')},
  {key:'urgalto',label:'Urgente / Alto',   icon:'',color:'#ea580c',bg:'#fff7ed',fn:()=>T.filter(t=>t.priority==='urgent'||t.priority==='high')},
  {key:'crit', label:'Score crítico ≥350', icon:'',color:'#dc2626',bg:'#fef2f2',fn:()=>T.filter(t=>t.score>=350),sub:'Acción requerida hoy'},
  {key:'sla',  label:'Vencidos SLA +7d',   icon:'',color:'#d97706',bg:'#fffbeb',fn:()=>T.filter(t=>t.days>7)},
  {key:'sinA', label:'Sin responsable',    icon:'',color:'#7c3aed',bg:'#f5f3ff',fn:()=>T.filter(t=>!t.sResp)},
];

function kpiPanel(kd){
  const tickets=kd.fn();
  if(!tickets.length)return`<div class="kpi-panel"><div class="panel-head"><span class="panel-title">${kd.label}</span><button class="panel-close" onclick="AKPI=null;renderGeneral()">×</button></div><div class="empty">Sin tickets en esta categoría</div></div>`;
  const rows=tickets.sort((a,b)=>b.score-a.score).map(t=>`
    <tr onclick="om(${t.id})">

}

function renderGeneral(){

    return`<div class="kpi-card${isActive?' active':''}" onclick="AKPI=AKPI==='${k.key}'?null:'${k.key}';renderGeneral()">
      <div class="kpi-card-top">
        <span style="font-size:10px;font-weight:600;color:${k.color};opacity:${isActive?1:.5}">▼</span>
      </div>

  const ak=AKPI?KDEF.find(k=>k.key===AKPI):null;

      <div class="slbl">Indicadores clave de operación</div>

    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">Por prioridad</span></div>

      </div>

        <div class="chart-head"><span class="chart-title">Antigüedad de tickets</span></div>
        <div class="chart-body"><div class="cbox"><canvas id="ca" role="img" aria-label="Distribución de tickets por antigüedad"></canvas></div></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">Tickets por agente</span><span style="font-size:10px;color:var(--txt3);font-weight:500">${T.length} total</span></div>
        <div class="chart-body"><div style="position:relative;height:${Math.max(160,agS.length*36)}px"><canvas id="cag" role="img" aria-label="Tickets por agente"></canvas></div></div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-head"><span class="chart-title">Tickets por área (etiqueta)</span><span style="font-size:10px;color:var(--txt3);font-weight:500">${T.length} total</span></div>
      <div class="chart-body"><div style="position:relative;height:${Math.max(120,arS.length*40+40)}px"><canvas id="car2" role="img" aria-label="Tickets por área"></canvas></div></div>
    </div>
    <div class="chart-card">
      <div class="chart-head" style="background:#fef2f2;border-bottom:1px solid #fecaca">
        <span class="chart-title" style="color:#dc2626">Sin responsable asignado</span>
        <span style="font-size:11px;font-weight:700;font-family:var(--mono);background:#fee2e2;color:#dc2626;padding:2px 9px;border-radius:10px" id="sa-count">0</span>
      </div>
      <div id="sa-body"></div>
    </div>`;

  mkChart('cp','doughnut',['Urgente','Alto','Normal','Bajo'],
    ['urgent','high','normal','low'].map(k=>T.filter(t=>t.priority===k).length),
    ['#dc2626','#d97706','#2563eb','#e5e7eb']);
  mkChart('ca','bar',AB.map(b=>b.t),AB.map(b=>T.filter(t=>t.age.k===b.k).length),AB.map(b=>b.c));
  mkChart('cag','bar',agS.map(x=>x[0]),agS.map(x=>x[1]),agS.map(()=>'#3b82f6'),true);
  mkChart('car2','bar',arS.map(x=>x[0]),arS.map(x=>x[1]),arS.map(x=>arColors[x[0]]||'#6b7280'),true);

function rafilt(){
  const fr=el('far')?.value||'',ft=el('fat')?.value||'',fm=el('fam')?.value||'';
  const list=T.filter(t=>{if(fr&&t.rango!==fr)return false;if(ft&&t.tipo!==ft)return false;if(fm&&t.mesAnt!==fm)return false;return true;});
  const rows=list.map(t=>{
    const sc=t.score>=350?'#dc2626':t.score>=220?'#d97706':t.score>=200?'#2563eb':'#9ca3af';
    return`<tr onclick="om(${t.id})"><td style="font-family:var(--mono);font-weight:600;"><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td><td>${t.subject}</td><td style="color:var(--txt2)">${t.org}</td><td style="font-family:var(--mono);color:#16a34a">${t.tiempo||'—'}</td><td>${t.rango?bdg(t.rango,'#d97706','#fffbeb'):''}</td><td>${t.tipo?bdg(t.tipo,'#2563eb','#eff4ff'):''}</td><td style="color:var(--txt2)">${t.mesAnt||'—'}</td><td style="color:var(--txt2)">${t.sResp||'—'}</td><td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td></tr>`;
  }).join('');
  if(el('atbl'))el('atbl').innerHTML=`<table><thead><tr><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>⏱ Tiempo</th><th>Rango</th><th>Tipo</th><th>Mes</th><th>Agente</th><th>Score</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Sin resultados</td></tr>'}</tbody></table>`;
}

  const list=[...T].filter(t=>{if(fs&&t.status!==fs)return false;if(fp&&t.priority!==fp)return false;if(fa&&t.sResp!==fa)return false;if(fr&&t.assignee!==fr)return false;return true;}).sort((a,b)=>b.score-a.score);
  const rows=list.map(t=>{
    const sc=t.score>=350?'#dc2626':t.score>=220?'#d97706':t.score>=200?'#2563eb':'#9ca3af';
    return`<tr class="${t.action.c}" onclick="om(${t.id})">
      <td style="font-family:var(--mono);font-weight:600;"><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td>

      <td>${bdg(t.age.t,t.age.c,t.age.bg)}</td>
      <td style="font-family:var(--mono);color:#16a34a;font-size:11px">${t.tiempo||'—'}</td>
      <td style="color:var(--txt2)">${t.sResp||'—'}</td>
      <td style="color:var(--txt2)">${t.dResp||'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
    </tr>`;
  }).join('');
  if(el('ttbl'))el('ttbl').innerHTML=`<table><thead><tr><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>Estado</th><th>Prioridad</th><th>Antigüedad</th><th>⏱ Tiempo</th><th>Agente</th><th>Desarrollador</th><th>Score</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">Sin resultados</td></tr>'}</tbody></table>`;
}

function cm(){el('msk').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cm();});

function go(tab){
  TAB=tab;AKPI=null;
  document.querySelectorAll('.nav-tab').forEach((b,i)=>b.classList.toggle('on',['g','s','d','a','t'][i]===tab));
  ['g','s','d','a','t'].forEach(id=>el('v'+id).classList.remove('on'));
  el('v'+tab).classList.add('on');
  if(tab==='g')renderGeneral();
  else if(tab==='s')renderArea('s','vs');
  else if(tab==='d')renderArea('d','vd');
  else if(tab==='a')renderAnt();
  else if(tab==='t')renderTodos();
}

async function loadData(){
  const btn=el('ubtn');btn.disabled=true;btn.classList.add('spin');
  el('ldr').style.display='flex';
  ['g','s','d','a','t'].forEach(id=>el('v'+id).classList.remove('on'));
  AKPI=null;
  try{
    el('ls').textContent='Leyendo Ant_Tickets…';
    const res=await fetch(`${API}?sheet=Ant_Tickets&t=${Date.now()}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    T=mapRows(data.rows||[]);
    const now=new Date();
    el('cf').textContent=now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
    el('cs').textContent='SEM '+wk(now);
    el('ct').textContent=T.length+' tickets';
    el('cu').textContent=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    el('nb-g').textContent=T.length;
    el('nb-s').textContent=T.filter(t=>t.assignee==='Soporte 1').length;
    el('nb-d').textContent=T.filter(t=>t.assignee==='Desarrollo 1').length;
    el('nb-t').textContent=T.length;
    el('ldr').style.display='none';
    el('v'+TAB).classList.add('on');
    if(TAB==='g')renderGeneral();
    else if(TAB==='s')renderArea('s','vs');
    else if(TAB==='d')renderArea('d','vd');
    else if(TAB==='a')renderAnt();
    else if(TAB==='t')renderTodos();
  }catch(e){
    el('ldr').style.display='none';
    el('vg').classList.add('on');
    el('vg').innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rl);padding:20px">
      <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:6px">Error al cargar datos</div>
      <div style="font-size:12px;color:#6b7280;margin-bottom:14px">${e.message}</div>
      <button onclick="loadData()" style="padding:7px 16px;border-radius:var(--r);border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)">↺ Reintentar</button>
    </div>`;
  }finally{btn.disabled=false;btn.classList.remove('spin');}
}
loadData();
</script>
</body>
</html>
