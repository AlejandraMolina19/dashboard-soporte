<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dashboard Supervisor — Santi Soluciones v3</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f0f2f7;--sur:#fff;--sur2:#f7f8fc;--sur3:#eef0f6;
  --bdr:#e2e5ef;--bdr2:#d0d4e8;
  --txt:#111827;--txt2:#4b5568;--txt3:#9ca3af;
  --acc:#2563eb;--acc2:#eff4ff;--acc3:#dbeafe;
  --grn:#16a34a;--red:#dc2626;--org:#d97706;--pur:#7c3aed;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:48px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:30;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:28px;height:28px;border-radius:6px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.brand-name{font-size:13px;font-weight:700;color:var(--txt)}
.brand-sep{width:1px;height:18px;background:var(--bdr);margin:0 4px}
.brand-sub{font-size:11px;color:var(--txt3);font-weight:500}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2);font-family:var(--mono)}
.chip.live{color:var(--grn);background:#f0fdf4;border-color:#bbf7d0}
.ubtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.ubtn:hover{background:#1d4ed8}
.ubtn:disabled{opacity:.5;cursor:not-allowed}
.ubtn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.nav{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr)}
.ntab{flex:1;text-align:center;padding:0 10px;height:40px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.ntab:hover{color:var(--txt2)}
.ntab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--sur3);color:var(--txt3);font-family:var(--mono)}
.ntab.on .nb{background:var(--acc3);color:var(--acc)}
.nb.danger{background:#fef2f2 !important;color:#dc2626 !important}
.nb.warn{background:#fffbeb !important;color:#92400e !important}
.layout{display:flex;flex:1;min-height:0;align-items:stretch}
.sidebar{width:196px;flex-shrink:0;background:#16234f;display:flex;flex-direction:column;padding:16px 10px;gap:3px;position:sticky;top:48px;align-self:flex-start;height:calc(100vh - 48px);overflow-y:auto}
.sidebar-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:6px 12px 8px}
.stab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13px;font-weight:600;font-family:var(--font);color:rgba(255,255,255,.62);border:none;background:none;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.stab:hover{background:rgba(255,255,255,.08);color:#fff}
.stab.on{background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.stab .stab-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.stab .stab-lbl{flex:1}
.stab .nb{margin-left:auto}
.stab.on .nb{background:rgba(255,255,255,.25);color:#fff}
@media(max-width:760px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;position:static;height:auto;overflow-x:auto;overflow-y:visible;padding:8px 10px;gap:6px}
  .sidebar-label{display:none}
  .stab{width:auto;white-space:nowrap;padding:8px 12px}
}
.main{flex:1;padding:14px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.ring{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.card-head{padding:10px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title{font-size:12px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:6px}
.card-title.danger{color:#dc2626}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge.red{background:#fef2f2;color:#dc2626;border:0.5px solid #fecaca}
.badge.amber{background:#fffbeb;color:#92400e;border:0.5px solid #fde68a}
.badge.blue{background:#eff4ff;color:#1e40af;border:0.5px solid #bfdbfe}
.badge.green{background:#f0fdf4;color:#15803d;border:0.5px solid #bbf7d0}
.greeting{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--sh)}
.greeting-title{font-size:14px;font-weight:700;color:var(--txt)}
.greeting-sub{font-size:11px;color:var(--txt3);margin-top:3px}
.date-chip{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--sur2);color:var(--txt2);border:1px solid var(--bdr);white-space:nowrap}
.trow-grid{display:grid;grid-template-columns:24px 1fr 78px 64px 110px 46px;align-items:start;gap:8px;padding:9px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
.trow-grid:hover{background:var(--sur2)}
.trow-grid:last-of-type{border-bottom:none}
.trow-hdr{background:var(--sur2);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);padding:5px 16px;border-bottom:1px solid var(--bdr)}
.t-num{font-size:10px;color:var(--txt3);font-weight:600;padding-top:2px}
.t-id{font-size:11px;font-weight:700;color:var(--acc);text-decoration:none;font-family:var(--mono)}
.t-sub{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ag{font-size:11px;color:var(--txt2);padding-top:2px}
.t-ant{font-size:11px;color:var(--txt2);padding-top:2px}
.pr-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;font-family:var(--mono);display:inline-block}
.pr-tag.urgent{background:#FFF0F0;color:#FF5C5C}
.pr-tag.high{background:#FFF8EF;color:#FF9A3C}
.pr-tag.normal{background:#EFF6FF;color:#4B9BFF}
.pr-tag.low{background:#F0F7FF;color:#8BC4FF}
.why-pill{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;display:inline-block}
.why-pill.fire{background:#fef2f2;color:#dc2626;border:0.5px solid #fecaca}
.why-pill.clock{background:#fffbeb;color:#92400e;border:0.5px solid #fde68a}
.why-pill.ghost{background:#faf5ff;color:#7c3aed;border:0.5px solid #e9d5ff}
.sc{font-family:var(--mono);font-weight:700;font-size:12px;padding-top:2px}
.sc.crit{color:#EF4444}.sc.warn{color:#F59E0B}.sc.ok{color:#4B9BFF}
.expand-row{padding:8px 16px;font-size:11px;color:var(--acc);text-align:center;border-top:1px solid var(--bdr);background:var(--sur2);cursor:pointer}
.expand-row:hover{background:var(--sur3)}
.legend-row{padding:7px 16px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--txt3);border-top:1px solid var(--bdr);background:var(--sur2);flex-wrap:wrap}
.ag-hoy-hdr{display:grid;grid-template-columns:28px 1fr 54px 64px 54px 16px;gap:8px;padding:5px 16px;background:var(--sur2);border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
.ag-hoy-row{display:grid;grid-template-columns:28px 1fr 54px 64px 54px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bdr);gap:8px;cursor:pointer;transition:background .1s}
.ag-hoy-row:last-child{border-bottom:none}
.ag-hoy-row:hover{background:var(--sur2)}
.ag-hoy-row.rl{border-left:3px solid #dc2626}
.ag-hoy-row.al{border-left:3px solid #d97706}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.av.r{background:#fef2f2;color:#dc2626}
.av.a{background:#fffbeb;color:#92400e}
.av.g{background:#f0fdf4;color:#15803d}
.ag-name{font-size:12px;font-weight:600;color:var(--txt)}
.ag-area-lbl{font-size:10px;color:var(--txt3)}
.ag-metric{text-align:center}
.ag-val{font-size:14px;font-weight:700}
.ag-val.r{color:#dc2626}.ag-val.a{color:#d97706}.ag-val.g{color:var(--txt3)}
.ag-lbl{font-size:9px;color:var(--txt3);margin-top:1px}
.pred-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
.pred-card{border-radius:var(--rl);padding:14px;text-align:center;cursor:pointer;transition:transform .15s;border:1px solid}
.pred-card:hover{transform:translateY(-2px)}
.pred-num{font-size:28px;font-weight:700;font-family:var(--mono)}
.pred-lbl{font-size:11px;font-weight:600;margin-top:4px}
.pred-src{font-size:9px;opacity:.75;margin-top:3px}
.pred-hint{font-size:9px;color:var(--txt3);margin-top:5px}
/* Filtros */
.filter-bar{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bdr);background:var(--sur2);flex-wrap:wrap}
.filter-select{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--sur);color:var(--txt2);cursor:pointer;font-family:var(--font)}
.filter-btn-clear{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #fca5a5;background:#fef2f2;color:#dc2626;cursor:pointer;font-family:var(--font)}
.filter-btn-clear:hover{background:#dc2626;color:#fff}
/* Equipo */
.area-filter{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);background:var(--sur2);align-items:center}
.area-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--bdr);background:var(--sur);color:var(--txt2);cursor:pointer;transition:all .15s;font-family:var(--font)}
.area-btn:hover{border-color:var(--acc);color:var(--acc)}
.area-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:12px}
.eq-card{background:var(--sur2);border-radius:var(--rl);padding:14px;cursor:pointer;transition:all .15s;border:1px solid var(--bdr)}
.eq-card:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.eq-card.rl{border-left:4px solid #dc2626}
.eq-card.al{border-left:4px solid #d97706}
.eq-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.eq-m{background:var(--sur);border-radius:var(--r);padding:6px 4px;text-align:center}
.eq-mv{font-size:18px;font-weight:700;font-family:var(--mono)}
.eq-ml{font-size:9px;color:var(--txt3);margin-top:1px}
.al-dia-list{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.al-dia-chip{font-size:11px;padding:4px 12px;border-radius:20px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
/* Panorama KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:12px}
.kc{background:var(--sur2);border-radius:var(--rl);padding:14px 16px;cursor:pointer;transition:all .18s;border:1px solid var(--bdr)}
.kc:hover,.kc.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc3);transform:translateY(-1px)}
.kc.active{background:var(--acc2)}
.kc.emp3-kc{border:1.5px dashed #0891b2}
.kv{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.04em;font-family:var(--mono)}
.kl{font-size:11px;font-weight:600;color:var(--txt2);margin-top:3px}
.kb{height:3px;border-radius:2px;margin-top:10px;background:var(--sur3);overflow:hidden}
.kf{height:100%;border-radius:2px}
.kh{font-size:10px;color:var(--txt3);margin-top:3px}
/* Tendencia */
.trend-box{padding:12px 16px}
.trend-labels{display:flex;margin-top:4px}
.trend-lbl{flex:1;text-align:center;font-size:9px;color:var(--txt3)}
.trend-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.trend-li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txt2)}
.charts-row{display:grid;grid-template-columns:220px 1fr 1fr;gap:10px}
@media(max-width:860px){.charts-row{grid-template-columns:1fr 1fr}}
/* Gráfica barras agente */
.ag-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ag-bar-lbl{font-size:10px;color:var(--txt2);min-width:70px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-bar-track{flex:1;height:14px;background:var(--sur3);border-radius:3px;overflow:hidden}
.ag-bar-fill{height:100%;border-radius:3px}
.ag-bar-val{font-size:10px;font-weight:700;color:var(--txt2);min-width:24px;font-family:var(--mono)}
/* Tabla */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
thead th{padding:7px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap}
tbody td{padding:8px 12px;border-bottom:1px solid var(--bdr);font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)}
tbody tr:last-child td{border-bottom:none}
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
.empty{padding:28px;text-align:center;color:var(--txt3);font-size:13px}
.msk{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:48px;backdrop-filter:blur(3px)}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);padding:22px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.12);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mttl{font-size:15px;font-weight:700;line-height:1.4;flex:1;margin-right:10px}
.mx{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--txt3);font-size:18px;display:flex;align-items:center;justify-content:center}
.mx:hover{background:var(--sur3);color:var(--txt)}
.mdv{height:1px;background:var(--bdr);margin:12px 0}
.mr{display:flex;gap:8px;margin-bottom:8px;font-size:12px}
.ml{color:var(--txt3);min-width:140px;flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mv{color:var(--txt);font-weight:500}
.score-block{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.score-num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--txt2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.ch{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}
.ct{font-size:12px;font-weight:700;color:var(--txt)}
.cb{padding:12px}
  .nivel-critico{border-left:4px solid #dc2626 !important;background:#fff8f8}
  .nivel-atencion{border-left:4px solid #d97706 !important;background:#fffdf5}
  .nivel-vigilancia{border-left:4px solid #2563eb !important}
  .nivel-label{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
  .nivel-label.c{background:#fef2f2;color:#dc2626}
  .nivel-label.a{background:#fffbeb;color:#d97706}
  .nivel-label.v{background:#eff4ff;color:#2563eb}
  .rev-btn{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid var(--bdr);background:none;cursor:pointer;color:var(--txt3);font-family:var(--font);white-space:nowrap}
  .rev-btn:hover{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
  .cli-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
  .cli-row:last-child{border-bottom:none}
  .cli-row:hover{background:var(--sur2)}
  .cli-avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .cli-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .mini-kpi{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:12px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
  .mini-kpi:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
  .mini-kpi-val{font-size:26px;font-weight:700;line-height:1;font-family:var(--mono)}
  .mini-kpi-lbl{font-size:10px;font-weight:600;color:var(--txt3);margin-top:3px}
  .nivel-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
  .nivel-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .1s}
  .nivel-head:hover{background:var(--sur2)}
  .hoy-row{display:grid;grid-template-columns:22px 1fr 80px 64px 46px 70px;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
  .hoy-row:last-child{border-bottom:none}
  .hoy-row:hover{background:var(--sur2)}
  .hoy-rev{opacity:.4;text-decoration:line-through}
  .hoy-hdr{display:grid;grid-template-columns:22px 1fr 80px 64px 46px 70px;gap:8px;padding:5px 14px;background:var(--sur2);border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}

    const id=parseInt(kId?r[kId]:'');if(!id||isNaN(id))return null;
    const priority=(kPr?r[kPr]||'':'').toLowerCase().trim();

    const rangoStr=(kRango?r[kRango]||'':'').trim();
    const crRaw=(colK&&r[colK]?r[colK]:r[colE]||'').trim();
    const crDate=crRaw?new Date(crRaw):null;
    const created=crDate&&!isNaN(crDate)?crDate.toISOString().split('T')[0]:'';
    const days=created?Math.max(0,Math.floor((now-new Date(created))/86400000)):0;
    let brSc=0;for(const e of ST){if(days>=e.d)brSc=e.s;else break;}
    const score=(PS[priority]||0)+brSc;
    function act(s){if(s>=350)return{t:'Resolver hoy',c:'#dc2626'};if(s>=220)return{t:'Atender hoy',c:'#d97706'};if(s>=200)return{t:'Mañana',c:'#2563eb'};return{t:'Esta semana',c:'#6b7280'};}
    const areaN=(colN?r[colN]||'':'').trim();
    const isSinAsignar=/sin\s+asignar|sin\s+clasificar|ticket\s+sin|^nuevo$/i.test(areaN)||areaN==='';
    const ultimoSegRaw=(colE?r[colE]||'':'').trim();
    return{id,status,priority,subject:kSub?r[kSub]||'':'',org:colG?r[colG]||'':'',agente:colM?r[colM]||'':'',areaAsig:areaN,dResp:colU?r[colU]||'':'',dEstatusRep:colAK?r[colAK]||'':'',canal:colAL?r[colAL]||'':'',sResp:kSResp?r[kSResp]||'':'',assignee:kAssign?r[kAssign]||'':'',created,days,rangoStr,isSla:isSlaVencido(rangoStr),isSinAsignar,sinSeguimiento:isSinSeguimiento(ultimoSegRaw,now),createdFmt:fmtDateShort(crRaw),score,action:act(score),mesAnt:kMesAnt?r[kMesAnt]||'':'',ultimoSeg:ultimoSegRaw};
  }).filter(Boolean);
}

async function loadClientesSheet(){

  const savedCli=localStorage.getItem('clientes_pub_url')||'';
  if(savedCli&&(savedCli.includes('<!DOCTYPE')||savedCli.includes('<html'))){{localStorage.removeItem('clientes_pub_url');}}
  const URLS=[
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRjJqwXH1eznEg5ikR5ZFARuNvPYFMnmpBdzmVOZDtL4NX-6j3Mg6uChyzWrvoLD6GAcT-tvU1eqJK-/pub?gid=1715906212&single=true&output=csv',
    (localStorage.getItem('clientes_pub_url')||''),
  ].filter((u,i,a)=>u&&a.indexOf(u)===i&&!u.includes('<!DOCTYPE'));
  for(const url of URLS){
    try{

      if(!r.ok)continue;

  return false;
}

// Parser CSV simple — busca la fila de headers que contenga palabras clave
function parseCSVSimple(text){
  const lines=text.split('\n');
  function clean(v){return(v||'').replace(/^"|"$/g,'').trim();}
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  // Buscar fila de headers: debe contener 'empresa' o 'instancia'
  let hi=-1;
  for(let i=0;i<Math.min(10,lines.length);i++){
    if(!lines[i].trim())continue;
    const cols=csvLine(lines[i]).map(v=>norm(clean(v)));
    const hasEmp=cols.some(v=>v==='empresa'||v.includes('empresa para'));
    const hasInst=cols.some(v=>v.includes('instancia')||v.includes('instanc'));
    if(hasEmp||hasInst){hi=i;break;}
  }
  // Si no encontró por keywords, usar primera fila no vacía
  if(hi<0){
    for(let i=0;i<lines.length;i++){
      if(lines[i].trim()){hi=i;break;}
    }
  }
  if(hi<0)return[];
  const headers=csvLine(lines[hi]).map(v=>clean(v));
  console.log('parseCSVSimple headers (L'+hi+'):',headers.slice(0,10));
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const vals=csvLine(lines[i]);
    if(vals.every(v=>!clean(v)))continue;
    // Saltar filas que parezcan de subtítulo (solo 1-2 celdas con contenido)
    const nonEmpty=vals.filter(v=>clean(v)).length;
    if(nonEmpty<2)continue;
    const row={};
    headers.forEach((h,j)=>{if(h)row[h]=clean(vals[j]||'');});
    rows.push(row);
  }
  console.log('parseCSVSimple: '+rows.length+' filas, primera:',JSON.stringify(rows[0]||{}).substring(0,200));
  return rows;
}

function formatEncargado(raw){
  if(!raw||!String(raw).trim())return'—';
  let s=String(raw).trim();
  s=s.replace(/^[\-\*•\u2022]+\s*/,'');
  s=s.replace(/[_]+/g,' ');
  s=s.replace(/\s{2,}/g,' ');
  const small=new Set(['de','del','la','las','el','los','y','en','a','con']);
  return s.split(' ').map((w,i)=>{
    if(!w)return w;
    const lw=w.toLowerCase();
    if(i>0&&small.has(lw))return lw;
    return lw.replace(/^([^a-zà-ÿ]*)([a-zà-ÿ])/,(m,pre,ch)=>pre+ch.toUpperCase());
  }).join(' ');
}

const AVATAR_COLORS=['#2563eb','#7c3aed','#0891b2','#d97706','#dc2626','#16a34a','#db2777'];
function avatarColor(str){
  let h=0;for(let i=0;i<(str||'').length;i++)h=(h*31+str.charCodeAt(i))>>>0;
  return AVATAR_COLORS[h%AVATAR_COLORS.length];
}

function buildCliRows(rows){
  const{cEmp,cEnc,cTel}=window._cliHeaders||{};
  const getNotas=window._cliGetNotas||(()=>[]);
  return rows.map((r,i)=>{
    const emp=(r[cEmp]||'—').trim();
    const enc=formatEncargado(r[cEnc]);
    const tel=r[cTel]||'—';
    const notas=getNotas(emp);
    const hasNota=notas.length>0;
    const key=btoa(unescape(encodeURIComponent(emp||''))).replace(/=/g,'');
    const col=avatarColor(emp);
    const iniciales=emp.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
    return`<tr class="cli-table-row" onclick="toggleCliRow('${emp.replace(/'/g,"\\'").replace(/\\/g,'\\\\')}')" style="cursor:pointer;transition:background .15s">
      <td style="padding:8px 12px;border-bottom:0.5px solid var(--bdr);font-size:10px;color:var(--txt3);font-family:var(--mono)">${i+1}</td>
      <td style="padding:8px 12px;border-bottom:0.5px solid var(--bdr)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:${col}18;color:${col};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${iniciales}</div>
          <span style="font-weight:600;font-size:12px">${emp}</span>
        </div>
      </td>
      <td style="padding:8px 12px;border-bottom:0.5px solid var(--bdr);font-size:11px;color:var(--txt2)">${enc}</td>
      <td style="padding:8px 12px;border-bottom:0.5px solid var(--bdr);font-size:11px;color:var(--txt2)">${tel}</td>
      <td style="padding:8px 12px;border-bottom:0.5px solid var(--bdr);text-align:center">
        ${hasNota
          ?`<span style="font-size:10px;font-weight:700;background:#f0fdf4;color:#16a34a;padding:3px 10px;border-radius:20px">📝 ${notas.length}</span>`
          :`<span style="font-size:10px;color:var(--acc);font-weight:600;background:var(--acc2);padding:3px 10px;border-radius:20px">+ agregar</span>`}
      </td>
    </tr>
    <tr id="cli-row-${key}" style="display:none">
      <td colspan="5" style="padding:0;background:var(--sur2)">
        ${buildCliNotaPanel(emp)}
      </td>
    </tr>`;
  }).join('');
}

function aplicarFiltrosClientes(){
  const q=(el('cli-search')?.value||'').trim().toLowerCase();
  const notaFiltro=el('cli-filtro-notas')?.value||'';
  const fDesde=el('cli-fecha-desde')?.value||'';
  const fHasta=el('cli-fecha-hasta')?.value||'';
  const rows=window._cliFullRows||window._cliRows||[];
  const getNotas=window._cliGetNotas||(()=>[]);
  const{cEmp}=window._cliHeaders||{};
  let filtered=rows;
  if(q)filtered=filtered.filter(r=>Object.values(r).some(v=>(v||'').toLowerCase().includes(q)));
  if(notaFiltro==='con')filtered=filtered.filter(r=>getNotas((r[cEmp]||'').trim()).length>0);
  else if(notaFiltro==='sin')filtered=filtered.filter(r=>getNotas((r[cEmp]||'').trim()).length===0);
  if(fDesde||fHasta){
    const tDesde=fDesde?new Date(fDesde+'T00:00:00').getTime():-Infinity;
    const tHasta=fHasta?new Date(fHasta+'T23:59:59').getTime():Infinity;
    filtered=filtered.filter(r=>getNotas((r[cEmp]||'').trim()).some(n=>n.ts>=tDesde&&n.ts<=tHasta));
  }
  const tbody=el('cli-tbody');
  if(tbody)tbody.innerHTML=buildCliRows(filtered);
  const cnt=el('cli-count');
  const hayFiltro=q||notaFiltro||fDesde||fHasta;
  if(cnt)cnt.textContent=hayFiltro?filtered.length+' de '+rows.length+' registros':rows.length+' registros';
}

          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span style="font-size:9px;font-weight:700;color:${catColor};background:${catColor}18;padding:1px 7px;border-radius:8px">${cat}</span>
            <span style="font-size:9.5px;color:var(--txt3);font-family:var(--mono)">${fmtTs(n.ts)}</span>
          </div>
          <div style="font-size:12px;color:var(--txt);line-height:1.4">${n.txt}</div>
        </div>
        <button onclick="window._cliDelNota('${emp.replace(/'/g,"\\'")}',${n.ts});refreshCliRow('${emp.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;color:var(--txt3);font-size:15px;padding:0;line-height:1;flex-shrink:0" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='var(--txt3)'">×</button>

      <select id="cli-cat-${key}" style="border:1px solid var(--bdr);border-radius:var(--r);padding:8px 8px;font-size:11px;font-family:var(--font);outline:none;background:var(--sur);color:var(--txt2)">
        ${Object.keys(NOTA_CATS).map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
      <input id="cli-inp-${key}" type="text" placeholder="Escribe una nota de seguimiento y presiona Enter…" onkeydown="if(event.key==='Enter')addCliNotaRow('${emp.replace(/'/g,"\\'")}','${key}')" style="flex:1;border:1px solid var(--bdr);border-radius:var(--r);padding:8px 12px;font-size:12px;font-family:var(--font);outline:none;background:var(--sur)">

function toggleCliRow(emp){
  const key=btoa(unescape(encodeURIComponent(emp||''))).replace(/=/g,'');
  const tr=el('cli-row-'+key);
  if(!tr)return;
  const hidden=tr.style.display==='none';
  tr.style.display=hidden?'':'none';
  if(hidden){
    refreshCliRow(emp);
    const inp=el('cli-inp-'+key);
    if(inp)setTimeout(()=>inp.focus(),50);
  }
}

function refreshCliRow(emp){
  const key=btoa(unescape(encodeURIComponent(emp||''))).replace(/=/g,'');
  const tr=el('cli-row-'+key);if(!tr)return;
  const td=tr.querySelector('td');if(!td)return;
  td.innerHTML=buildCliNotaPanel(emp);
  // Actualizar badge en la fila principal
  const notas=window._cliGetNotas?window._cliGetNotas(emp):[];
  const prevTr=tr.previousElementSibling;
  if(prevTr){
    const notaCell=prevTr.querySelector('td:last-child');
    if(notaCell){
      notaCell.innerHTML=notas.length
        ?`<span style="font-size:10px;font-weight:600;background:#f0fdf4;color:#16a34a;padding:2px 8px;border-radius:10px">📝 ${notas.length}</span>`
        :`<span style="font-size:10px;color:var(--txt3)">+ agregar</span>`;
    }
  }
}

function addCliNotaRow(emp,key){
  const inp=el('cli-inp-'+key);
  const catSel=el('cli-cat-'+key);
  if(!inp||!inp.value.trim())return;
  if(window._cliSaveNota)window._cliSaveNota(emp,inp.value.trim(),catSel?catSel.value:'Otro');
  inp.value='';
  refreshCliRow(emp);
}

function exportarNotasExcel(){
  const rows=window._cliRows||[];
  const{cEmp,cEnc}=window._cliHeaders||{};
  if(!rows.length){showToast('Sin datos de clientes','#dc2626');return;}
  const csvRows=[['Empresa','Encargado','Fecha','Hora','Categoría','Nota']];
  rows.forEach(r=>{
    const emp=(r[cEmp]||'').trim();
    const enc=r[cEnc]||'—';
    const notas=window._cliGetNotas?window._cliGetNotas(emp):[];
    if(!notas.length)return;
    notas.forEach(n=>{
      const d=new Date(n.ts);
      const fecha=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
      const hora=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      csvRows.push([emp,enc,fecha,hora,n.cat||'Otro',n.txt.replace(/,/g,';')]);
    });
  });
  if(csvRows.length<2){showToast('Sin notas que exportar','#d97706');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csvRows.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download='notas_clientes.csv';a.click();
  showToast('✓ Notas exportadas','#16a34a');
}

function getTicketsQuemandose(subset){
  return (subset||T).filter(t=>{
    const r=(t.rangoStr||'').trim().toLowerCase();
    return r==='7 días'||r==='7 dias'||r==='6 días'||r==='6 dias'||t.sinSeguimiento||(t.isSinAsignar&&(t.priority==='urgent'||t.priority==='high'));
  }).sort((a,b)=>{const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);return db!==da?db-da:b.score-a.score;});
}
function getAgentesEnRiesgo(){
  const agMap={};
  T.filter(t=>getAreaAgente(t)!=='Desarrollo').forEach(t=>{
    const ag=(t.agente||'').trim();
    if(!ag||ag.toLowerCase()==='no'||ag==='')return;
    if(!agMap[ag])agMap[ag]={tickets:[],area:getAreaAgente(t)};
    agMap[ag].tickets.push(t);
  });
  return Object.entries(agMap).map(([ag,d])=>{
    const tks=d.tickets;
    const sinSeg=tks.filter(t=>t.sinSeguimiento).length;
    const mas7=tks.filter(t=>parseDias(t.rangoStr)>=7).length;
    const total=tks.length;
    if(!sinSeg&&!mas7&&total<5)return null;
    const nivel=(sinSeg>3||mas7>5)?'r':'a';
    return{ag,total,sinSeg,mas7,area:d.area,nivel,urghi:tks.filter(t=>t.priority==='urgent'||t.priority==='high').length,_tickets:tks};
  }).filter(Boolean).sort((a,b)=>a.nivel!==b.nivel?a.nivel==='r'?-1:1:b.sinSeg-a.sinSeg);
}
function getDesarrolladoresConRiesgo(){
  // Filtra SOLO tickets donde col N (areaAsig) sea exactamente 'Desarrollo'
  const devTickets=T.filter(t=>{
    const area=(t.areaAsig||'').trim().toLowerCase();
    return area==='desarrollo'||area.includes('desarrollo');
  });
  const devMap={};
  devTickets.forEach(t=>{
    const dev=(t.dResp||'').trim();
    const key=dev&&dev.toLowerCase()!=='no'&&dev!==''?dev:'Sin asignar';
    if(!devMap[key])devMap[key]={tickets:[]};
    devMap[key].tickets.push(t);
  });
  return Object.entries(devMap).map(([dev,d])=>{
    const tks=d.tickets;
    const sinSeg=tks.filter(t=>t.sinSeguimiento).length;
    const mas7=tks.filter(t=>parseDias(t.rangoStr)>=7).length;
    const total=tks.length;
    if(!sinSeg&&!mas7&&total<1)return null;
    const nivel=(sinSeg>3||mas7>5)?'r':'a';
    return{ag:dev,total,sinSeg,mas7,area:'Desarrollo',nivel,urghi:tks.filter(t=>t.priority==='urgent'||t.priority==='high').length,_tickets:tks};
  }).filter(Boolean).sort((a,b)=>b.total-a.total);
}
function getPredSLA(subset){
  const base=subset||T;
  const now=new Date();
  const ind1=base.filter(t=>{const r=(t.rangoStr||'').trim().toLowerCase();return r==='7 días'||r==='7 dias';});
  const ind2=base.filter(t=>{const r=(t.rangoStr||'').trim().toLowerCase();return r==='6 días'||r==='6 dias';});
  const ind3=base.filter(t=>{if(!t.ultimoSeg||!t.ultimoSeg.trim())return false;const d=new Date(t.ultimoSeg);if(isNaN(d))return false;return(now-d)/86400000>3;});
  const ind4=base.filter(t=>{if(!t.ultimoSeg||!t.ultimoSeg.trim())return false;const d=new Date(t.ultimoSeg);if(isNaN(d))return false;const diff=(now-d)/86400000;return diff>2&&diff<=3;});
  return{ind1,ind2,ind3,ind4,n1:ind1.length,n2:ind2.length,n3:ind3.length,n4:ind4.length};
}
function getTrendData(){
  const now=new Date();const weeks=[];
  for(let w=5;w>=0;w--){
    const wStart=new Date(now);wStart.setDate(now.getDate()-w*7-now.getDay());wStart.setHours(0,0,0,0);
    const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+7);
    weeks.push({label:'S-'+wk(wStart),open:T.filter(t=>{if(!t.created)return false;const d=new Date(t.created);return d>=wStart&&d<wEnd;}).length,sla:T.filter(t=>{if(!t.created)return false;const d=new Date(t.created);return d>=wStart&&d<wEnd&&t.isSla;}).length});
  }
  return weeks;
}
function getTopSolicitantes(){
  const map={};
  T.forEach(t=>{const sol=(t.sResp||t.assignee||'').trim();if(!sol||sol.toLowerCase()==='no')return;if(!map[sol])map[sol]={count:0,maxScore:0};map[sol].count++;if(t.score>map[sol].maxScore)map[sol].maxScore=t.score;});
  return Object.entries(map).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
}

function applyDFilter(filterId,tableId,openKey,showSeg,hideScore){
  const area=el(filterId+'-area')?.value||'';
  const rango=el(filterId+'-rango')?.value||'';
  const prior=el(filterId+'-prior')?.value||'';
  let list=sortByAge(window['_dt_'+openKey]||[]);
  if(area)list=list.filter(t=>getAreaAgente(t)===area);
  if(rango)list=list.filter(t=>t.rangoStr===rango);
  if(prior)list=list.filter(t=>t.priority===prior);
  window['_dtFiltered_'+openKey]=list;
  const tbody=el(tableId)?.querySelector('tbody');
  if(tbody)tbody.innerHTML=renderDetailRows(list,showSeg,hideScore);

}
function clearDFilter(filterId,tableId,openKey,showSeg,hideScore){

function getComparativaHoy(totalNow,riesgoNow){
  const todayStr=new Date().toISOString().split('T')[0];
  let hoy=null,ayer=null;
  try{hoy=JSON.parse(localStorage.getItem('snap_hoy')||'null');}catch{}
  try{ayer=JSON.parse(localStorage.getItem('snap_ayer')||'null');}catch{}
  if(!hoy||hoy.date!==todayStr){
    if(hoy)ayer=hoy;
    hoy={date:todayStr,total:totalNow,riesgo:riesgoNow};
    localStorage.setItem('snap_hoy',JSON.stringify(hoy));
    if(ayer)localStorage.setItem('snap_ayer',JSON.stringify(ayer));
  }
  if(!ayer)return null;
  return{deltaTotal:totalNow-ayer.total,deltaRiesgo:riesgoNow-ayer.riesgo,fechaAyer:ayer.date};
}

  if(n===0)return'<span style="color:var(--txt3)">sin cambio</span>';

  return`<span style="color:${c};font-weight:700">${s}${Math.abs(n)}</span>`;
}

// ── Slack integration ─────────────────────────────────────────────
const SLACK_WEBHOOK=localStorage.getItem('slack_webhook')||'';
// ── Sistema de canales Slack ─────────────────────────────────────
function getSlackCanales(){
  try{return JSON.parse(localStorage.getItem('slack_canales')||'[]');}catch{return[];}
}
function saveSlackCanales(canales){
  localStorage.setItem('slack_canales',JSON.stringify(canales));
}

function configSlack(){
  const canales=getSlackCanales();
  const lista=canales.length?canales.map((c,i)=>`${i+1}. ${c.nombre} (${c.webhook.substring(0,40)}...)`).join('\n'):'(sin canales configurados)';
  const opcion=prompt(
    'Configurar canales de Slack\n\n'+
    'Canales actuales:\n'+lista+'\n\n'+
    'Opciones:\n'+
    '  A — Agregar nuevo canal\n'+
    '  B — Eliminar canal (escribe el número)\n'+
    '  C — Cancelar\n\n'+
    'Escribe A, B+número (ej: B2) o C:'
  );
  if(!opcion||opcion.toUpperCase()==='C')return;
  if(opcion.toUpperCase()==='A'){
    const nombre=prompt('Nombre del canal (ej: Soporte, Desarrollo, General):');
    if(!nombre)return;
    const url=prompt('Webhook URL de Slack para "'+nombre+'":\n(Slack → api.slack.com/apps → Incoming Webhooks → Add New)');
    if(!url||!url.startsWith('https://hooks.slack.com')){showToast('URL inválida','#dc2626');return;}
    canales.push({nombre:nombre.trim(),webhook:url.trim()});
    saveSlackCanales(canales);
    // También guardar el primero como default
    if(canales.length===1)localStorage.setItem('slack_webhook',url.trim());
    showToast('✓ Canal "'+nombre+'" agregado','#16a34a');
  } else if(opcion.toUpperCase().startsWith('B')){
    const num=parseInt(opcion.substring(1))-1;
    if(num>=0&&num<canales.length){
      const eliminado=canales.splice(num,1)[0];
      saveSlackCanales(canales);
      showToast('Canal "'+eliminado.nombre+'" eliminado','#d97706');
    }
  }
}

function mostrarSelectorCanal(id,tipo){
  const canales=getSlackCanales();
  const wh=localStorage.getItem('slack_webhook');
  // Si no hay canales configurados, usar el webhook default o pedir
  if(!canales.length){
    if(wh){
      // Hay webhook default, enviar directo
      sendSlackPreset(id,tipo);
    } else {
      const ok=confirm('Slack no está configurado.\n\n¿Quieres agregar un canal ahora?');
      if(ok)configSlack();
    }
    return;
  }
  // Si hay exactamente 1 canal, enviar directo
  if(canales.length===1){
    sendSlackPresetACanalIndex(id,tipo,0);
    return;
  }
  // Múltiples canales: mostrar modal de selección
  showSlackModal(id,tipo,canales);
}

function sendSlackPresetACanalIndex(id,tipo,canalIdx){
  const canales=getSlackCanales();
  const canal=canales[canalIdx];
  const webhook=canal?canal.webhook:localStorage.getItem('slack_webhook');
  if(!webhook){showToast('Sin webhook configurado','#dc2626');return;}
  const t=window.T&&window.T.find(x=>x.id===id);if(!t)return;
  const base=`https://dual.zendesk.com/agent/tickets/${t.id}`;
  const emp=t.org||'—';const ag=t.agente||'Sin asignar';const rango=t.rangoStr||'—';
  let texto='';
  if(tipo==='seguimiento'){
    texto=`Hola, este ticket <${base}|#${t.id}> (${emp}) lleva *${rango}* sin resolverse y está asignado a *${ag}*. Necesitamos actualización de seguimiento. ¿Hay algún avance o bloqueo? 🙏`;
  } else if(tipo==='marcar'){
    texto=`Hola, favor de marcar o actualizar el estado del ticket <${base}|#${t.id}> (${emp} · ${ag}). Antigüedad: *${rango}*. Si ya fue resuelto, por favor ciérralo en Zendesk. ✅`;
  } else if(tipo==='documentar'){
    texto=`Hola, el ticket <${base}|#${t.id}> (${emp}) requiere documentación para solución definitiva. Agente: *${ag}* · Antigüedad: *${rango}*. Por favor agrega los pasos de solución en Zendesk. 📄`;
  }
  const destino=canal?` → #${canal.nombre}`:'';
  const msg={text:texto,username:'Dashboard Soporte',icon_emoji:':ticket:'};
  fetch(webhook,{method:'POST',body:JSON.stringify(msg),mode:'no-cors'})
    .then(()=>showToast(`✓ Enviado a Slack${destino}`,'#16a34a'))
    .catch(()=>showToast(`✓ Enviado${destino} (verifica Slack)`,'#16a34a'));
}

function enviarMasivoACanal(list,webhook,nombreCanal){
  if(!webhook){showToast('Sin webhook configurado','#dc2626');return;}
  const max=25;
  const lineas=list.slice(0,max).map(t=>{
    const base=`https://dual.zendesk.com/agent/tickets/${t.id}`;
    return`• <${base}|#${t.id}> — ${t.subject||'—'} (${t.org||'—'} · ${t.rangoStr||'—'})`;
  }).join('\n');
  const extra=list.length>max?`\n… y ${list.length-max} más`:'';
  const texto=`📋 *Seguimiento masivo — ${list.length} ticket${list.length===1?'':'s'}*\n${lineas}${extra}`;
  const msg={text:texto,username:'Dashboard Soporte',icon_emoji:':clipboard:'};
  fetch(webhook,{method:'POST',body:JSON.stringify(msg),mode:'no-cors'})
    .then(()=>showToast(`✓ Enviados ${list.length} tickets a Slack${nombreCanal?' → #'+nombreCanal:''}`,'#16a34a'))

function renderTendenciaBD(){

  const maxA=Math.max.apply(null,sem.map(function(s){return s.abiertos;}),1)||1;
  const H=80,W=580;
  const ptA=sem.map(function(s,i){return (10+i*(W/(sem.length||1)))+','+(H-(s.abiertos/maxA*(H-10)));}).join(' ');
  const ptR=sem.map(function(s,i){return (10+i*(W/(sem.length||1)))+','+(H-(s.resueltos/maxA*(H-10)));}).join(' ');
  const labels=sem.map(function(s){return '<span class="trend-lbl">'+s.label+'</span>';}).join('');
  const reincHTML=BD_ANALISIS.reincidentes.slice(0,5).map(function(e,i){

  }).join('');
  return '<div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:12px">'+
    '<div><div style="font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Tickets por semana — últimas '+sem.length+'</div>'+
    '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block">'+
    '<polyline points="'+ptA+'" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>'+
    '<polyline points="'+ptR+'" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4,2"/>'+
    sem.map(function(s,i){return '<circle cx="'+(10+i*(W/(sem.length||1)))+'" cy="'+(H-(s.abiertos/maxA*(H-10)))+'" r="3" fill="#2563eb"/>';}).join('')+
    '</svg><div class="trend-labels">'+labels+'</div>'+
    '<div class="trend-legend"><div class="trend-li"><div style="width:14px;height:2px;background:#2563eb;border-radius:1px"></div>Abiertos</div><div class="trend-li"><div style="width:14px;height:2px;background:#16a34a;border-radius:1px"></div>Resueltos</div></div></div>'+

}

function renderFocosRojos(agRiesgo,devRiesgo){
  const todos=[...agRiesgo,...devRiesgo];
  const ranking=todos.map(a=>{
    const criticos=(a._tickets||[]).filter(t=>t.score>=350).length;
    return{ag:a.ag,area:a.area,criticos,sinSeg:a.sinSeg,mas7:a.mas7,total:a.total};
  }).filter(r=>r.criticos>0).sort((a,b)=>b.criticos-a.criticos);
  if(!ranking.length)return`<div class="card"><div class="card-head"><div class="card-title">🔥 Top 3 focos rojos</div></div><div class="empty" style="color:#16a34a;padding:20px">✓ Nadie tiene tickets críticos (score ≥350) ahora mismo</div></div>`;
  const top3=ranking.slice(0,3);
  const max=top3[0].criticos;
  const filas=top3.map((r,i)=>{
    const pct=Math.round(r.criticos/max*100);
    return`<div style="display:flex;align-items:center;gap:10px;padding:8px 16px${i<top3.length-1?';border-bottom:1px solid var(--bdr)':''}">
      <span style="font-size:11px;font-weight:700;color:var(--txt3);width:16px">${i+1}</span>
      <span style="font-size:12px;font-weight:600;width:140px;flex-shrink:0">${r.ag}</span>

function parseSemanaId(id){

const REP_SEMANA_MIN='A2026_S27'; // datos depurados a partir de aquí (año 2026, semana 27)

// ── Conciliación Recibidos vs. Resueltos ──
// Clasifica cada ticket CREADO en el periodo según dónde terminó, y separa los resueltos que vienen de antes del periodo.
function conciliarRecibidosResueltos(semanasIds,creados){
  const yws=new Set();semanasIds.forEach(id=>{const p=parseSemanaId(id);if(p)yws.add(p.year*100+p.week);});
  const ywMin=Math.min(...yws),ywMax=Math.max(...yws);
  const b={dentro:[],despues:[],antes:[],sinSemana:[],abiertos:[],otro:[]};
  creados.forEach(r=>{
    const est=cv(r,'J').trim().toLowerCase();
    if(esCerradoJ(r)){
      const yw=semanaCierreYW(r);
      if(yw==null)b.sinSemana.push(r);
      else if(yws.has(yw))b.dentro.push(r);
      else if(yw>ywMax)b.despues.push(r);
      else b.antes.push(r); // cierre antes de su propia semana de creación / del rango: dato a revisar
    }else if(['open','pending','hold','new','on-hold'].includes(est))b.abiertos.push(r);
    else b.otro.push(r);

  const resueltos=resueltosPorCierre(semanasIds);
  const kH=colKey('H');
  const idsCreados=new Set(creados);
  const deAntes=resueltos.filter(r=>!idsCreados.has(r));

// ── HORARIO OPERATIVO ──
// L-V 9:00–20:00 (11 h) · Sáb 10:00–15:00 (5 h) · Dom no se trabaja · sin días festivos.
// El reloj solo corre dentro de este horario. 1 día operativo = jornada completa de 11 h.
const HORARIO_OP={0:null,1:[9,20],2:[9,20],3:[9,20],4:[9,20],5:[9,20],6:[10,15]}; // 0 = domingo
const HORAS_DIA_OP=11;
function horasOperativas(f1,f2){
  const d1=new Date(f1),d2=new Date(f2);
  if(isNaN(d1)||isNaN(d2)||d2<d1)return null;
  let ms=0;
  const dia=new Date(d1.getFullYear(),d1.getMonth(),d1.getDate());
  while(dia<=d2){
    const h=HORARIO_OP[dia.getDay()];
    if(h){
      const ini=new Date(dia.getFullYear(),dia.getMonth(),dia.getDate(),h[0]);
      const fin=new Date(dia.getFullYear(),dia.getMonth(),dia.getDate(),h[1]);
      const a=Math.max(ini,d1),b=Math.min(fin,d2);
      if(b>a)ms+=b-a;
    }
    dia.setDate(dia.getDate()+1);
  }
  return ms/3600000;
}
function diasOperativos(f1,f2){const h=horasOperativas(f1,f2);return h==null?null:h/HORAS_DIA_OP;}

// ── SLA FIJO ──
// Semáforo por ticket y por promedio: verde ≤ vMax · amarillo > vMax y < aMax · rojo ≥ aMax
// Ambos en DÍAS OPERATIVOS (jornada de 11 h). Para cambiar una meta, edita solo esta línea.
const SLA_FIJO={soporte:{vMax:1,aMax:4},desarrollo:{vMax:3,aMax:6}};
function tiemposSLA(rows,unidad){
  return rows.map(r=>horasOperativas(cv(r,'L'),cv(r,'M'))).filter(v=>v!=null&&v>=0).map(h=>unidad==='horas'?h:h/HORAS_DIA_OP);
}
function slaLimites(tipo){return{...SLA_FIJO[tipo]};}
// Distribución de tiempos de solución (en días) para decidir metas con datos reales
function distribucionTiempos(dias){
  const RANGOS=[['≤ 1 día',0,1],['1 a 2 días',1,2],['2 a 3 días',2,3],['3 a 5 días',3,5],['5 a 7 días',5,7],['7 a 14 días',7,14],['más de 14 días',14,Infinity]];
  const n=dias.length,ord=[...dias].sort((x,y)=>x-y);
  const pct=q=>n?Math.round(ord[Math.min(n-1,Math.ceil(q*n)-1)]*10)/10:null; // percentil por rango más cercano
  let acum=0;
  const filas=RANGOS.map(([label,min,max])=>{
    const c=dias.filter(d=>(min===0?d>=0:d>min)&&d<=max).length;acum+=c;
    return{label,c,pct:n?Math.round(c/n*1000)/10:0,acum:n?Math.round(acum/n*1000)/10:0};
  });
  return{n,filas,p50:pct(.5),p80:pct(.8),p90:pct(.9),prom:n?Math.round(dias.reduce((x,y)=>x+y,0)/n*10)/10:null};
}

function esDudaIA(row){return esCausaCliente(row)&&/^dudas?_/.test(valorSCliente(row));}
function calcularDudasIA(rows){

  const dudas=causaCliente.filter(esDudaIA);

  return{
    colOk,total:rows.length,causaCliente:causaCliente.length,dudas:dudas.length,
    pct:rows.length?Math.round(dudas.length/rows.length*1000)/10:0,
    pctDeCliente:causaCliente.length?Math.round(dudas.length/causaCliente.length*1000)/10:0,
    dudasConDesarrollo:dudas.filter(esDesarrollo).length,
    topDudas:top(dudas,valorSCliente,3),
    topNoDudas:top(noDudas,valorSCliente,3)
  };
}

function calcularRango(rows){
  const total=rows.length;
  const resueltas=rows.filter(esResuelto);
  const abiertas=rows.filter(r=>!esResuelto(r));

  // Desglose por estatus real (columna J): pending, solved, closed, open
  const ESTATUS_ORDEN=['open','pending','solved','closed'];
  const estatusMap={};
  rows.forEach(r=>{
    const raw=cv(r,'J').trim().toLowerCase();
    const key=ESTATUS_ORDEN.includes(raw)?raw:(raw||'sin estatus');
    estatusMap[key]=(estatusMap[key]||0)+1;
  });
  const estatusBreakdown=[...ESTATUS_ORDEN.filter(k=>estatusMap[k]),...Object.keys(estatusMap).filter(k=>!ESTATUS_ORDEN.includes(k))]
    .map(k=>({estatus:k,total:estatusMap[k]}));
  const solved=estatusMap['solved']||0;
  const resTimes=resueltas.filter(esUniversoReportes).map(r=>diasOperativos(cv(r,'L'),cv(r,'M'))).filter(v=>v!=null&&v>=0); // días operativos · sin guardias/apoyo no escalados
  const tiempoProm=resTimes.length?resTimes.reduce((a,b)=>a+b,0)/resTimes.length:null;
  const desarrollo=rows.filter(esDesarrollo).length;

  // ── Soporte: solo tickets de por asignar / Alejandra / Ivette / Karina (col. O) ──
  // Soporte = tickets de Alejandra/Karina/Ivette que NO pasaron a Desarrollo (el universo ya viene filtrado)
  const soporteTotal=rows.filter(r=>!esDesarrollo(r)&&esAgenteSoporte(r)).length;
  const otrosTotal=rows.filter(r=>!esUniversoReportes(r)).length; // guardias / agente_de_apoyo sin escalar
  const pctSoporte=total?Math.round(soporteTotal/total*100):0;

  // ── SLA de resolución con semáforo (meta) ──
  // Límites FIJOS (ver SLA_FIJO): verde ≤ vMax · amarillo > vMax y < aMax · rojo ≥ aMax
  const resSoporte=resueltas.filter(r=>!esDesarrollo(r)&&esAgenteSoporte(r)); // solo Alejandra, Karina, Ivette y por asignar
  const resDesarrollo=resueltas.filter(r=>esDesarrollo(r));
  function calcularSLA(list,unidad,vMax,aMax,rangosDef){
    const tiempos=tiemposSLA(list,unidad); // horario operativo
    const buckets={verde:0,amarillo:0,rojo:0};
    tiempos.forEach(t=>{if(t<=vMax)buckets.verde++;else if(t<aMax)buckets.amarillo++;else buckets.rojo++;});
    const promedio=tiempos.length?tiempos.reduce((a,b)=>a+b,0)/tiempos.length:null;
    const color=promedio==null?null:promedio<=vMax?'verde':promedio<aMax?'amarillo':'rojo';
    const rangos=rangosDef.map(rd=>({label:rd.label,total:tiempos.filter(t=>t>=rd.min&&t<rd.max).length}));
    return{unidad,vMax,aMax,total:tiempos.length,buckets,promedio,color,rangos};
  }
  const rangosDe=(l,u)=>[
    {label:`0–${l.vMax}${u}`,min:0,max:l.vMax+1e-9},{label:`${l.vMax}–${l.aMax}${u}`,min:l.vMax+1e-9,max:l.aMax},
    {label:`${l.aMax}–${Math.round(l.aMax*20)/10}${u}`,min:l.aMax,max:l.aMax*2},{label:`${Math.round(l.aMax*20)/10}${u}+`,min:l.aMax*2,max:Infinity}];
  const limSop=slaLimites('soporte'),limDev=slaLimites('desarrollo');
  const slaSoporte=calcularSLA(resSoporte,'días',limSop.vMax,limSop.aMax,rangosDe(limSop,'d'));
  const slaDesarrollo=calcularSLA(resDesarrollo,'días',limDev.vMax,limDev.aMax,rangosDe(limDev,'d'));

  // Antigüedad de las que siguen abiertas
  const hoy=new Date();
  const buckets={'0-3 días':0,'4-7 días':0,'8-15 días':0,'15+ días':0};
  abiertas.forEach(r=>{
    const d=diffDias(cv(r,'L'),hoy);
    if(d==null)return;
    if(d<=3)buckets['0-3 días']++;
    else if(d<=7)buckets['4-7 días']++;
    else if(d<=15)buckets['8-15 días']++;
    else buckets['15+ días']++;
  });

  // Empresas
  const empMap={};
  rows.forEach(r=>{const o=cv(r,'K').trim()||'Sin clasificar';if(!empMap[o])empMap[o]={total:0,categorias:{},llamadas:0,tickets:0,sinCanal:0,abiertos:0};const e=empMap[o];e.total++;const cat=cv(r,'T').trim()||'Sin categoría';e.categorias[cat]=(e.categorias[cat]||0)+1;const c=canalDe(r);if(c==='Llamada')e.llamadas++;else if(c==='Ticket')e.tickets++;else e.sinCanal++;if(!esCerradoJ(r))e.abiertos++;});
  const empresas=Object.entries(empMap).map(([org,d])=>{
    const topCat=Object.entries(d.categorias).sort((a,b)=>b[1]-a[1])[0];
    return{org,total:d.total,llamadas:d.llamadas,tickets:d.tickets,sinCanal:d.sinCanal,abiertos:d.abiertos,topCategoria:topCat?topCat[0]:'—'};
  }).sort((a,b)=>b.total-a.total);
  const reincidentes=empresas.filter(e=>e.total>=3);

  // Categoría (T) / Módulo (U) / Causa del reporte (V) / Función (AF)
  function topDe(letter,n){
    const m={};
    rows.forEach(r=>{const v=cv(r,letter).trim();if(v)m[v]=(m[v]||0)+1;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||10);
  }
  const topCategorias=topDe('T',10);
  const topModulos=topDe('U',10);
  const topCausas=topDe('V',10);
  const topFunciones=topDe('AF',10);

  // Canal de atención (AL): ticket vs llamada
  const canalMap={};
  rows.forEach(r=>{
    const raw=cv(r,'AL').trim().toLowerCase();
    const key=raw.includes('llamada')?'Llamada':raw.includes('ticket')?'Ticket':(raw||'Sin dato');
    canalMap[key]=(canalMap[key]||0)+1;
  });
  const canalBreakdown=Object.entries(canalMap).map(([canal,total])=>({canal,total})).sort((a,b)=>b.total-a.total);

  // Responsables
  function porResponsable(letter,base){
    const m={};
    (base||rows).forEach(r=>{const a=cv(r,letter).trim();if(!a)return;if(!m[a])m[a]={total:0,resueltos:0,categorias:{}};m[a].total++;if(esCerradoJ(r))m[a].resueltos++;const cat=cv(r,'T').trim()||'Sin categoría';m[a].categorias[cat]=(m[a].categorias[cat]||0)+1;});
    return Object.entries(m).map(([a,d])=>{const topCat=Object.entries(d.categorias).sort((x,y)=>y[1]-x[1])[0];return{nombre:a,total:d.total,resueltos:d.resueltos,topCategoria:topCat?topCat[0]:'—'};}).sort((a,b)=>b.total-a.total);
  }
  const porSoporte=porResponsable('O',rows.filter(esAgenteSoporte)); // solo Alejandra, Karina, Ivette y por asignar
  const porDesarrollo=porResponsable('P');

  // ── Productividad de Desarrollo (col. P) — solo tickets con S=SI, + bucket 'sin desarrollador asignado' ──
  const desRowsSemana=rows.filter(esDesarrollo);
  const devMap={};
  let devSinAsignarTotal=0,devSinAsignarResueltos=0;
  desRowsSemana.forEach(r=>{
    const resp=cv(r,'P').trim();
    const resuelto=esCerradoJ(r);
    if(!resp){devSinAsignarTotal++;if(resuelto)devSinAsignarResueltos++;return;}
    if(!devMap[resp])devMap[resp]={total:0,resueltos:0};
    devMap[resp].total++;
    if(resuelto)devMap[resp].resueltos++;
  });
  const productividadDev=Object.entries(devMap).map(([nombre,d])=>({nombre,total:d.total,resueltos:d.resueltos})).sort((a,b)=>b.total-a.total);
  if(devSinAsignarTotal>0)productividadDev.push({nombre:'⚠️ Sin desarrollador asignado',total:devSinAsignarTotal,resueltos:devSinAsignarResueltos});

  // ── Patrones de la semana: hora del día, día de la semana, serie diaria ──
  const DIA_NOMBRE=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const horaMap={};
  const diaSemMap={};
  rows.forEach(r=>{
    const d=new Date(cv(r,'L'));
    if(isNaN(d))return;
    const h=d.getHours();
    horaMap[h]=(horaMap[h]||0)+1;
    const dn=DIA_NOMBRE[d.getDay()];
    diaSemMap[dn]=(diaSemMap[dn]||0)+1;
  });
  const porHora=Object.entries(horaMap).map(([h,n])=>({hora:+h,total:n})).sort((a,b)=>a.hora-b.hora);
  const porDiaSemana=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(dn=>({dia:dn,total:diaSemMap[dn]||0}));

  // Serie diaria: creados vs resueltos, y soporte vs desarrollo, por fecha calendario
  const diaFechaMap={};
  function fechaCorta(str){const d=new Date(str);if(isNaN(d))return null;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  rows.forEach(r=>{
    const fc=fechaCorta(cv(r,'L'));
    if(!fc)return;
    if(!diaFechaMap[fc])diaFechaMap[fc]={creados:0,resueltos:0,soporte:0,desarrollo:0,otros:0};
    diaFechaMap[fc].creados++;
    if(esDesarrollo(r))diaFechaMap[fc].desarrollo++;else if(esAgenteSoporte(r))diaFechaMap[fc].soporte++;else diaFechaMap[fc].otros++;
  });
  rows.forEach(r=>{
    if(!esResuelto(r))return;
    const fr=fechaCorta(cv(r,'M'));
    if(!fr)return;
    if(!diaFechaMap[fr])diaFechaMap[fr]={creados:0,resueltos:0,soporte:0,desarrollo:0,otros:0};
    diaFechaMap[fr].resueltos++;
  });
  const porDia=Object.entries(diaFechaMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([fecha,d])=>({fecha,...d}));

  // One-touch: creado y resuelto en la misma fecha+hora — SOLO sobre resueltos estrictos (J=solved)
  const resueltasSolved=rows.filter(esSolvedJ).filter(esUniversoReportes); // sin guardias/apoyo no escalados
  let oneTouchCount=0;
  resueltasSolved.forEach(r=>{
    const dL=new Date(cv(r,'L')),dM=new Date(cv(r,'M'));
    if(isNaN(dL)||isNaN(dM))return;
    if(dL.getFullYear()===dM.getFullYear()&&dL.getMonth()===dM.getMonth()&&dL.getDate()===dM.getDate()&&dL.getHours()===dM.getHours())oneTouchCount++;
  });
  const oneTouch={count:oneTouchCount,base:resueltasSolved.length,pct:resueltasSolved.length?Math.round(oneTouchCount/resueltasSolved.length*100*10)/10:0};

  return{total,otrosTotal,resueltas:resueltas.length,abiertas:abiertas.length,tiempoProm,desarrollo,pctDesarrollo:total?Math.round(desarrollo/total*100):0,soporteTotal,pctSoporte,buckets,empresas,reincidentes,topCategorias,topModulos,topCausas,topFunciones,canalBreakdown,porSoporte,porDesarrollo,productividadDev,estatusBreakdown,solved,slaSoporte,slaDesarrollo,porHora,porDiaSemana,porDia,oneTouch,dudasIA:calcularDudasIA(rows)};
}

function resumenInteligente(stats,rangoLabel){
  if(!stats.total)return`No hay tickets registrados en el rango ${rangoLabel}.`;
  const frases=[];
  stats.empresas.slice(0,4).forEach(e=>{
    let f=`<strong>${e.org}</strong> reportó ${e.total} ticket${e.total===1?'':'s'}`;
    if(e.topCategoria&&e.topCategoria!=='Sin categoría')f+=`, principalmente sobre ${e.topCategoria.toLowerCase()}`;
    if(e.llamadas>0)f+=`, con ${e.llamadas} llamada${e.llamadas===1?'':'s'} registrada${e.llamadas===1?'':'s'}`;
    if(e.total>=3)f+=' — cliente reincidente';
    frases.push(f+'.');
  });
  if(stats.tiempoProm!=null)frases.push(`El tiempo promedio de resolución en el rango fue de ${stats.tiempoProm.toFixed(1)} días operativos.`);
  if(stats.topCategorias.length)frases.push(`La categoría con más incidencia fue <strong>${stats.topCategorias[0][0]}</strong> (${stats.topCategorias[0][1]} tickets).`);
  return frases.join(' ');
}

function analizarBD(rows,hdrs){
  if(!rows||!rows.length)return null;
  const allHdrs=hdrs||Object.keys(rows[0]||{});
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  const findH=pats=>allHdrs.find(h=>pats.some(p=>norm(h).includes(p)))||'';
  const cId=findH(['id','folio']);
  const cFecha=findH(['fecha','created','inicio','creado']);
  const cEmp=findH(['empresa','company','org']);
  const cAgente=findH(['agente','agent']);
  const cPrioridad=findH(['prioridad','priority']);
  const cEstado=findH(['estado','status']);
  const extraCols=allHdrs.slice(8,38); // columnas I-AL

  // Tendencia por semana
  const semMap={};
  rows.forEach(r=>{
    const d=new Date(r[cFecha]||'');
    if(isNaN(d))return;
    const sem=d.getFullYear()+'-W'+String(wk(d)).padStart(2,'0');
    if(!semMap[sem])semMap[sem]={label:sem,abiertos:0,resueltos:0,empresas:new Set()};
    semMap[sem].abiertos++;
    const est=(r[cEstado]||'').toLowerCase();
    if(['solved','resuelto','closed','cerrado'].includes(est))semMap[sem].resueltos++;
    if(r[cEmp])semMap[sem].empresas.add(r[cEmp]);
  });
  const semanas=Object.entries(semMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12).map(([k,v])=>({...v,empresas:v.empresas.size}));

  // Reincidencias por empresa
  const empMap={};
  rows.forEach(r=>{const e=(r[cEmp]||'').trim();if(e)empMap[e]=(empMap[e]||0)+1;});
  const reincidentes=Object.entries(empMap).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Por agente
  const agMap={};
  rows.forEach(r=>{const a=(r[cAgente]||'').trim();if(a&&a.toLowerCase()!=='no')agMap[a]=(agMap[a]||0)+1;});
  const porAgente=Object.entries(agMap).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return{semanas,reincidentes,porAgente,total:rows.length,extraCols,cEmp,cFecha,cAgente,cPrioridad,cEstado};
}

  'd - sin responsable':'#fed7aa',

function estatusColor(raw){
  const k=(raw||'').trim().toLowerCase();
  if(!k)return'#d1d5db';
  if(ESTATUS_COLORS[k])return ESTATUS_COLORS[k];
  let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;
  if(/^s\s*-/.test(k))return PURPLE_SHADES[h%PURPLE_SHADES.length];
  if(/^d\s*-/.test(k))return ORANGE_SHADES[h%ORANGE_SHADES.length];
  return ESTATUS_PALETTE_FALLBACK[h%ESTATUS_PALETTE_FALLBACK.length];
}

function buildAntiguedadChart(subset){
  const rVals=[...new Set(subset.map(t=>t.rangoStr).filter(Boolean))].sort((a,b)=>parseDias(a)-parseDias(b));
  const SIN_ESTATUS='Sin estatus';
  const grupoDe=t=>(t.dEstatusRep||'').trim()||SIN_ESTATUS;
  const gruposPresentes=[...new Set(subset.map(grupoDe))].sort((a,b)=>{
    if(a===SIN_ESTATUS)return 1;if(b===SIN_ESTATUS)return-1;
    return a.localeCompare(b);
  });
  const datasets=gruposPresentes.map(g=>({
    label:g,
    data:rVals.map(r=>subset.filter(t=>t.rangoStr===r&&grupoDe(t)===g).length),
    backgroundColor:g===SIN_ESTATUS?'#d1d5db':estatusColor(g),

      plugins:{
        legend:{display:true,position:'bottom',align:'start',labels:{boxWidth:8,font:{size:8.5},color:'#6b7280',padding:7}},
        tooltip:{backgroundColor:'#111827',bodyColor:'#f9fafb',cornerRadius:6,padding:8}

        x:{stacked:true,ticks:{color:'#9ca3af',font:{size:10}},grid:{display:false}},
        y:{stacked:true,ticks:{color:'#9ca3af',font:{size:10},precision:0},grid:{color:'#f0f2f780'}}

const BD_URL_BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vSuBfaRcodg7K0SCkugsC2zJJzv_JK4HHCwB4fvuDjjQLuO5sFBc6-YqGa0iBGGEkjKvVCihcoJpCjm/pub';
const BD_GID_TICKETS='1776545593';
let BD_LOADED=false;

// ── BD de Llamadas (pestaña "LLamadas BD" del mismo Sheets publicado) ──
// col. E = ID_semana (mismo formato que col. H en Tickets BD) · col. H = agente · col. J = estatus de la llamada
const BD_GID_LLAMADAS='1760821607';
const LLAMADAS_AGENTES=['alejandra','ivette','karina'];
const LLAMADAS_STATUS_OK=['completeagent','completecaller'];
let LL_DATA=[];let LL_HEADERS=[];let LL_LOADED=false;
function llColKey(letter){return LL_HEADERS[colIdxFromLetter(letter)]||'';}
function llv(row,letter){const k=llColKey(letter);return k?(row[k]||''):'';}
let LL_LAST_ERROR='';
// Lector propio para LLamadas BD: parseCSV es el de Tickets BD (exige columnas "ID" numérica y "Estado"),
// por eso con esta hoja siempre devolvía 0 filas. Aquí: encabezado = fila con "ID_semana" (o la primera no vacía),
// claves únicas por columna (las vacías o repetidas se nombran por su letra) y se conservan filas con col. E llena.
function parseCSVLlamadas(text){
  const lines=text.split(/\r?\n/);
  const clean=v=>(v||'').replace(/^"|"$/g,'').trim();
  const norm=v=>clean(v).toLowerCase().replace(/[^a-z]/g,'');
  let hi=-1;
  for(let i=0;i<Math.min(15,lines.length);i++){if(csvLine(lines[i]).some(v=>norm(v)==='idsemana')){hi=i;break;}}
  if(hi<0)hi=lines.findIndex(l=>l.trim());
  if(hi<0)return{rows:[],headers:[]};
  const letra=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  const vistos=new Set();
  const headers=csvLine(lines[hi]).map((v,j)=>{let h=clean(v)||('col_'+letra(j));if(vistos.has(h))h=h+'_'+letra(j);vistos.add(h);return h;});
  const iE=colIdxFromLetter('E');
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    const vals=csvLine(lines[i]);
    if(!clean(vals[iE]))continue;
    const row={};headers.forEach((h,j)=>{row[h]=clean(vals[j]);});
    rows.push(row);
  }
  return{rows,headers};
}
async function ensureLlamadas(){
  if(LL_DATA.length)return true;
  const delay=ms=>new Promise(res=>setTimeout(res,ms));
  const base=BD_URL_BASE+'?gid='+BD_GID_LLAMADAS+'&single=true&output=csv';
  const urls=[
    base,
    'https://docs.google.com/spreadsheets/d/'+BD_SHEET_ID+'/pub?gid='+BD_GID_LLAMADAS+'&single=true&output=csv',
    base+'&t='+Date.now() // cache-busting: por si el CSV se publicó hace muy poco y aún no propaga
  ];
  let lastErr='';
  for(let i=0;i<urls.length;i++){
    try{
      if(i>0)await delay(700);
      const r=await fetch(urls[i],{cache:'no-store'});
      if(!r.ok){lastErr='HTTP '+r.status;continue;}
      const txt=await r.text();
      if(!txt||txt.length<50){lastErr='respuesta vacía o muy corta';continue;}
      const{rows,headers}=parseCSVLlamadas(txt);
      if(!rows.length){lastErr='CSV sin filas (encabezados: '+(headers.slice(0,5).join(', ')||'ninguno')+')';continue;}
      LL_DATA=rows;LL_HEADERS=headers;LL_LOADED=true;LL_LAST_ERROR='';
      return true;
    }catch(e){lastErr=e.message||'error de red';continue;}
  }
  LL_LAST_ERROR=lastErr;
  return false;
}
function hmsToSec(v){
  const s=String(v||'').trim();if(!s)return null;
  const p=s.split(':').map(Number);
  if(p.some(isNaN))return null;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];
  return isNaN(+s)?null:+s;
}
function secToHms(s){
  if(s==null||isNaN(s))return'—';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.round(s%60);
  return(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
// Cuenta llamadas COMPLETADAS (COMPLETEAGENT/COMPLETECALLER, col. J) de Alejandra/Ivette/Karina (col. H),
// para el conjunto de ID_semana (col. E) que le pases — mismo idsSet que usas para filtrar Tickets BD.
function calcularLlamadasRango(idsSet){
  if(!LL_DATA.length)return null;
  const kE=llColKey('E');if(!kE)return null;
  const filas=LL_DATA.filter(r=>idsSet.has(r[kE]));
  const porAgente={};
  filas.forEach(r=>{
    const agRaw=llv(r,'H').trim().toLowerCase();
    if(!LLAMADAS_AGENTES.includes(agRaw))return; // descarta "Agente/102" y similares — solo nombres exactos
    const st=llv(r,'J').trim().toLowerCase().replace(/[^a-z]/g,'');
    if(!LLAMADAS_STATUS_OK.includes(st))return;
    if(!porAgente[agRaw])porAgente[agRaw]={nombre:agRaw.charAt(0).toUpperCase()+agRaw.slice(1),total:0,espera:[],habla:[]};
    porAgente[agRaw].total++;
    const esp=hmsToSec(llv(r,'K'));if(esp!=null)porAgente[agRaw].espera.push(esp);
    const hab=hmsToSec(llv(r,'L'));if(hab!=null)porAgente[agRaw].habla.push(hab);
  });
  const porAgenteArr=Object.values(porAgente).map(a=>({
    nombre:a.nombre,total:a.total,
    esperaProm:a.espera.length?Math.round(a.espera.reduce((x,y)=>x+y,0)/a.espera.length):null,
    hablaProm:a.habla.length?Math.round(a.habla.reduce((x,y)=>x+y,0)/a.habla.length):null
  })).sort((x,y)=>y.total-x.total);
  return{totalFilasSemana:filas.length,totalValidas:porAgenteArr.reduce((a,b)=>a+b.total,0),porAgente:porAgenteArr};
}

  const savedUrl=localStorage.getItem('bd_pub_url')||'';
  const gid=localStorage.getItem('bd_gid')||BD_GID_TICKETS;
  const urls=[
    'https://docs.google.com/spreadsheets/d/'+BD_SHEET_ID+'/pub?gid='+gid+'&single=true&output=csv',
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuBfaRcodg7K0SCkugsC2zJJzv_JK4HHCwB4fvuDjjQLuO5sFBc6-YqGa0iBGGEkjKvVCihcoJpCjm/pub?gid=1776545593&single=true&output=csv',
    savedUrl,
    BD_URL_BASE+'?gid='+gid+'&single=true&output=csv',
  ].filter((u,i,a)=>u&&a.indexOf(u)===i);
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)continue;
      const txt=await r.text();
      if(!txt||txt.length<50)continue;
      const{rows,headers}=parseCSV(txt);
      if(!rows.length)continue;
      BD_DATA=rows;BD_HEADERS=headers;BD_ANALISIS=analizarBD(rows,headers);BD_LOADED=true;REP_INI=null;REP_FIN=null;
      return true;
    }catch(e){continue;}
  }
  return false;
}

  const ds=context.dataset;

function topList(arr,color){

// Detecta huecos de baja demanda (hora del día / día de la semana) para sugerir cuándo agendar tareas de fondo
function detectarHorasValle(stA){
  if(!stA.porHora||!stA.porHora.length||stA.total<8)return null;
  const horasNegocio=stA.porHora.filter(h=>h.hora>=8&&h.hora<=19);
  if(horasNegocio.length<3)return null;
  const avgHora=horasNegocio.reduce((a,b)=>a+b.total,0)/horasNegocio.length;
  const valleHora=horasNegocio.reduce((min,h)=>h.total<min.total?h:min,horasNegocio[0]);
  if(!avgHora||valleHora.total>=avgHora*0.7)return null; // no hay un valle claro
  const pctBajoHora=Math.round((1-valleHora.total/avgHora)*100);
  let detalle=`Alrededor de las ${valleHora.hora}:00h entran ~${pctBajoHora}% menos tickets que el promedio del horario laboral (${valleHora.total} vs. ~${avgHora.toFixed(1)}). Buen momento para tareas de fondo, mantenimiento o capacitación del equipo.`;
  if(stA.porDiaSemana&&stA.porDiaSemana.length){
    const diasConDatos=stA.porDiaSemana.filter(d=>d.total>0);
    if(diasConDatos.length>=3){
      const avgDia=diasConDatos.reduce((a,b)=>a+b.total,0)/diasConDatos.length;
      const valleDia=diasConDatos.reduce((min,d)=>d.total<min.total?d:min,diasConDatos[0]);
      if(valleDia.total<avgDia*0.8)detalle+=` ${valleDia.dia} suele ser, en promedio, el día con menos tickets.`;
    }
  }
  return{icon:'🧭',color:'#7c3aed',bg:'#f5f3ff',categoria:'patrones',titulo:`Hora valle detectada: ~${valleHora.hora}:00h`,detalle};
}

// Indicador "Oportunidad IA": tickets con causa = cliente y S-CLIENTE = duda_/dudas_
function generarAlertaDudasIA(stA,stP){
  const d=stA&&stA.dudasIA;if(!d||!d.total)return null;
  const base={icon:'🤖',color:'#0891b2',bg:'#ecfeff',categoria:'ia'};
  if(!d.colOk)return{...base,icon:'⚠️',titulo:'No se encontró la columna S-CLIENTE',detalle:'El indicador de dudas resolubles por IA necesita la columna S-CLIENTE en Tickets BD. Revisa que el encabezado no haya cambiado.'};
  const fmt=a=>a.map(x=>`${x.valor} (${x.total})`).join(', ');
  let detalle=`${d.dudas} de ${d.total} tickets son dudas de cliente → ${d.dudas} ÷ ${d.total} = <b>${d.pct}%</b> del periodo. `
    +`Equivalen al ${d.pctDeCliente}% de los ${d.causaCliente} tickets con causa "cliente" (${d.dudas} ÷ ${d.causaCliente}).`;
  if(d.topDudas.length)detalle+=`<br>Más frecuentes: ${fmt(d.topDudas)}.`;
  if(d.dudasConDesarrollo)detalle+=`<br>⚠ ${d.dudasConDesarrollo} de estas dudas sí tocaron Desarrollo (col. S = SI); conviene revisarlas antes de darlas por resolubles con IA.`;
  if(d.topNoDudas.length)detalle+=`<br>Fuera del indicador (causa "cliente" que no son dudas): ${fmt(d.topNoDudas)}.`;
  const p=stP&&stP.dudasIA;
  if(p&&p.colOk&&p.total)detalle+=`<br>Periodo anterior: ${p.dudas} de ${p.total} (${p.pct}%).`;
  return{...base,titulo:`${d.pct}% de los tickets podrían resolverse con IA`,detalle};
}

function generarAlertasSemana(stA,stP,evolucion,semanaSelId){
  const alertas=[];
  if(stA.slaSoporte&&stA.slaSoporte.color==='rojo'){
    alertas.push({icon:'🔴',color:'#dc2626',bg:'#fef2f2',categoria:'sla',titulo:'SLA de Soporte fuera de meta',detalle:`Promedio de ${stA.slaSoporte.promedio.toFixed(1)} días operativos para resolver; el límite rojo es ≥${stA.slaSoporte.aMax}d (meta verde ≤${stA.slaSoporte.vMax}d). ${stA.slaSoporte.buckets.rojo} ticket${stA.slaSoporte.buckets.rojo===1?'':'s'} llegó a ${stA.slaSoporte.aMax} días operativos o más.`});
  }
  if(stA.slaDesarrollo&&stA.slaDesarrollo.color==='rojo'){
    alertas.push({icon:'🔴',color:'#dc2626',bg:'#fef2f2',categoria:'sla',titulo:'SLA de Desarrollo fuera de meta',detalle:`Promedio de ${stA.slaDesarrollo.promedio.toFixed(1)}d para resolver; el límite rojo es ≥${stA.slaDesarrollo.aMax}d (meta verde ≤${stA.slaDesarrollo.vMax}d). ${stA.slaDesarrollo.buckets.rojo} ticket${stA.slaDesarrollo.buckets.rojo===1?'':'s'} llegó a ${stA.slaDesarrollo.aMax} días operativos o más.`});
  }
  const resC=stA.resueltosCierre!=null?stA.resueltosCierre:stA.solved;
  const pctRes=stA.total?Math.round(resC/stA.total*100):0;
  if(stA.total>0&&pctRes<50){
    alertas.push({icon:'🔴',color:'#dc2626',bg:'#fef2f2',categoria:'sla',titulo:'Se cierra menos de lo que entra',detalle:`Se cerraron ${resC} tickets contra ${stA.total} recibidos → ${resC} ÷ ${stA.total} = ${pctRes}%. El rezago está creciendo.`});
  }
  if(evolucion&&evolucion.length>=3){
    const idx=evolucion.findIndex(e=>e.id===semanaSelId);
    if(idx>=2){
      const ultimas=evolucion.slice(idx-2,idx+1);
      const subiendo=ultimas[0].total<ultimas[1].total&&ultimas[1].total<ultimas[2].total;
      const bajando=ultimas[0].total>ultimas[1].total&&ultimas[1].total>ultimas[2].total;
      if(subiendo){
        alertas.push({icon:'📈',color:'#d97706',bg:'#fffbeb',categoria:'tendencia',titulo:'Tendencia al alza — 3 semanas seguidas',detalle:`Tickets recibidos: ${ultimas.map(u=>u.total).join(' → ')}. Vale la pena revisar si es estacional o un problema recurrente.`});
      } else if(bajando){
        alertas.push({icon:'📉',color:'#16a34a',bg:'#f0fdf4',categoria:'tendencia',titulo:'Tendencia a la baja — 3 semanas seguidas',detalle:`Tickets recibidos: ${ultimas.map(u=>u.total).join(' → ')}. Buena señal si viene de mejoras, revisar si es por baja actividad del cliente.`});
      }
    }
  }
  if(stP&&stP.total>0&&stA.total>stP.total*1.3){
    const pct=Math.round((stA.total-stP.total)/stP.total*100);
    alertas.push({icon:'🟠',color:'#d97706',bg:'#fffbeb',categoria:'tendencia',titulo:'Aumento fuerte de tickets recibidos',detalle:`+${pct}% vs. el periodo anterior (${stP.total} → ${stA.total}).`});
  }
  if(stA.reincidentes.length>0){
    const top=stA.reincidentes[0];
    alertas.push({icon:'🟠',color:'#d97706',bg:'#fffbeb',categoria:'clientes',titulo:`${stA.reincidentes.length} empresa${stA.reincidentes.length===1?'':'s'} reincidente${stA.reincidentes.length===1?'':'s'} esta semana`,detalle:`${top.org} lidera con ${top.total} tickets.`});
  }
  if(stA.topCategorias.length&&stA.total>0){
    const[cat,cnt]=stA.topCategorias[0];
    const pct=Math.round(cnt/stA.total*100);
    if(pct>=40){
      alertas.push({icon:'🟡',color:'#ca8a04',bg:'#fefce8',categoria:'clientes',titulo:`"${cat}" concentra el ${pct}% de los tickets`,detalle:`${cnt} de ${stA.total} tickets de este periodo son de esa categoría.`});
    }
  }
  const agentesCarga=stA.porSoporte.filter(p=>!/por[\s_]+asignar/i.test(p.nombre));
  if(agentesCarga.length){
    const top=agentesCarga[0];
    const promedio=agentesCarga.reduce((a,b)=>a+b.total,0)/agentesCarga.length;
    if(top.total>=promedio*1.8&&top.total>=3){
      alertas.push({icon:'🟠',color:'#d97706',bg:'#fffbeb',categoria:'productividad',titulo:`${top.nombre} con carga alta`,detalle:`${top.total} tickets esta semana, muy por encima del promedio del equipo (${promedio.toFixed(1)}).`});
    }
  }
  const alertaValle=detectarHorasValle(stA);
  if(alertaValle)alertas.push(alertaValle);
  if(!alertas.length){
    alertas.push({icon:'✅',color:'#16a34a',bg:'#f0fdf4',categoria:'ok',titulo:'Sin focos rojos esta semana',detalle:'Los indicadores están dentro de rangos normales.'});
  }
  const alertaIA=generarAlertaDudasIA(stA,stP);
  if(alertaIA)alertas.push(alertaIA);
  return alertas;
}

function enriquecerAlerta(a){
  const t=a.titulo||'';
  let sev=a.icon==='🔴'?'critica':(['🟠','🟡','📈','⚠️'].includes(a.icon)?'vigilar':'info');
  let accion='',tab='';
  if(t.startsWith('SLA de Soporte')){accion='Revisa los tickets en rojo y, en el Scrum, cuáles están detenidos esperando respuesta del cliente.';tab='soporte';}
  else if(t.startsWith('SLA de Desarrollo')){accion='Prioriza con Desarrollo los tickets que ya pasaron el límite y confirma que cada uno tenga responsable asignado.';tab='desarrollo';}
  else if(t.startsWith('Se cierra menos')){accion='Aparta un bloque para cerrar rezago (aprovecha la hora valle) y revisa los pending que esperan al cliente.';}
  else if(a.categoria==='tendencia'){accion=sev==='info'?'Confirma si la baja viene de mejoras (p. ej. Help Module) o de menor actividad de los clientes.':'Revisa qué módulo o empresa explica el cambio.';tab='clientes';}
  else if(/reincidente/.test(t)){accion='Revisa la causa raíz con la empresa que más reporta; puede ser candidata a capacitación personalizada.';tab='clientes';}
  else if(/concentra/.test(t)){accion='Si son dudas repetidas, conviértelas en artículos del Help Module.';tab='clientes';}
  else if(/carga alta/.test(t)){accion='Revisa el reparto de tickets en el Scrum del lunes o jueves.';tab='desempeno';}
  else if(a.categoria==='ia'){accion=a.icon==='⚠️'?'Revisa el encabezado de la columna S-CLIENTE en Tickets BD.':'Usa las dudas más frecuentes como primeros artículos del Help Module y como base para entrenar a la IA.';tab='soporte';}
  else if(a.categoria==='patrones'){tab='clientes';}
  return{...a,sev,accion,tab};
}
