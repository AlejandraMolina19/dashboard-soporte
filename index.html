<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Supervisor — Santi Soluciones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f2f7;--sur:#fff;--sur2:#f7f8fc;--sur3:#eef0f6;
  --bdr:#e2e5ef;--bdr2:#d0d4e8;
  --txt:#111827;--txt2:#4b5568;--txt3:#9ca3af;
  --acc:#2563eb;--acc2:#eff4ff;--acc3:#dbeafe;
  --grn:#16a34a;--red:#dc2626;--red2:#fef2f2;--red3:#fee2e2;
  --org:#d97706;--org2:#fffbeb;--pur:#7c3aed;--pur2:#f5f3ff;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:30;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;font-family:var(--mono);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.brand-name{font-size:14px;font-weight:700;color:var(--txt)}
.brand-sep{width:1px;height:18px;background:var(--bdr);margin:0 4px}
.brand-sub{font-size:12px;color:var(--txt3);font-weight:500}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2);font-family:var(--mono)}
.chip.live{color:var(--grn);background:#f0fdf4;border-color:#bbf7d0}
.ubtn{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.ubtn:hover{background:#1d4ed8}
.ubtn:disabled{opacity:.5;cursor:not-allowed}
.ubtn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.nav{display:flex;padding:0 24px;background:var(--sur);border-bottom:1px solid var(--bdr);overflow-x:auto}
.ntab{padding:0 18px;height:44px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ntab:hover{color:var(--txt2)}
.ntab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--sur3);color:var(--txt3);font-family:var(--mono)}
.ntab.on .nb{background:var(--acc3);color:var(--acc)}
.main{flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.slbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kc{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--sh)}
.kc:hover{border-color:var(--bdr2);box-shadow:var(--sh2);transform:translateY(-1px)}
.kc.active{box-shadow:0 0 0 3px var(--acc3),var(--sh2)}
.kc-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.kc-arrow{font-size:10px;font-weight:700;color:var(--txt3);opacity:0;transition:opacity .15s}
.kc:hover .kc-arrow,.kc.active .kc-arrow{opacity:1}
.kc-val{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.04em;margin-bottom:4px;font-family:var(--mono)}
.kc-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.kc-sub{font-size:10px;color:var(--txt3);margin-top:2px}
.kc-bar{height:3px;border-radius:2px;margin-top:12px;background:var(--sur3);overflow:hidden}
.kc-fill{height:100%;border-radius:2px;transition:width 1s ease}
.kc-hint{font-size:10px;color:var(--txt3);margin-top:4px}
.charts-row{display:grid;grid-template-columns:240px 1fr 1fr;gap:12px}
@media(max-width:920px){.charts-row{grid-template-columns:1fr 1fr}}
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.ch{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.ct{font-size:12px;font-weight:700;color:var(--txt)}
.cb{padding:14px}
/* Legend */
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--txt2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* Detail section */
.detail-card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.detail-head{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--bdr);transition:background .2s}
.detail-title{font-size:13px;font-weight:700;color:var(--txt)}
.detail-meta{display:flex;align-items:center;gap:8px}
.detail-count{font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:10px}
.detail-clear{background:none;border:1px solid var(--bdr);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--txt3);font-family:var(--font)}
.detail-clear:hover{background:var(--sur2);color:var(--txt)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
thead th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)}
tbody tr:last-child td{border-bottom:none}
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:var(--mono)}
.akrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ak{border-radius:var(--rl);padding:14px;text-align:center;border:1px solid}
.an{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
.al{font-size:10px;font-weight:700;margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
.sg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.si{font-size:11px;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid}
.sel{background:var(--sur);border:1px solid var(--bdr);color:var(--txt);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:500;font-family:var(--font);cursor:pointer}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.ring{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.msk{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:48px;backdrop-filter:blur(3px)}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);padding:22px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.12);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mttl{font-size:15px;font-weight:700;line-height:1.4;flex:1;margin-right:10px}
.mx{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--txt3);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mx:hover{background:var(--sur3);color:var(--txt)}
.mdv{height:1px;background:var(--bdr);margin:12px 0}
.mr{display:flex;gap:8px;margin-bottom:8px;font-size:12px}
.ml{color:var(--txt3);min-width:145px;flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.mv{color:var(--txt);font-weight:500}
.score-block{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.score-num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.tbox{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.empty{padding:32px;text-align:center;color:var(--txt3);font-size:13px;font-weight:500}
/* Gradient chart bar cursor */
canvas.clickable{cursor:pointer}
</style>
</head>
<body>

<div class="tb">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="brand">
      <div class="brand-icon">SS</div>
      <span class="brand-name">Santi Soluciones</span>
      <div class="brand-sep"></div>
      <span class="brand-sub">Dashboard Supervisor</span>
    </div>
    <div class="chips">
      <span class="chip live">● En línea</span>
      <span class="chip" id="cf">–</span>
      <span class="chip" id="cs">–</span>
      <span class="chip" id="ct">–</span>
      <span class="chip" id="cu" style="color:var(--txt3)">Sin actualizar</span>
    </div>
  </div>
  <button class="ubtn" id="ubtn" onclick="loadData()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Actualizar datos
  </button>
</div>

<div class="nav">
  <button class="ntab on" onclick="go('ind')">Indicadores <span class="nb" id="nb-ind">–</span></button>
  <button class="ntab" onclick="go('sop')">Soporte <span class="nb" id="nb-sop">–</span></button>
  <button class="ntab" onclick="go('dev')">Desarrollo <span class="nb" id="nb-dev">–</span></button>
  <button class="ntab" onclick="go('ant')">Antigüedad</button>
  <button class="ntab" onclick="go('tod')">Todos los tickets <span class="nb" id="nb-tod">–</span></button>
</div>

<div class="main">
  <div class="ldr" id="ldr"><div class="ring"></div><div style="font-size:12px;color:var(--txt3);font-weight:500" id="ls">Conectando con Google Sheets…</div></div>
  <div class="view" id="v-ind"></div>
  <div class="view" id="v-sop"></div>
  <div class="view" id="v-dev"></div>
  <div class="view" id="v-ant"></div>
  <div class="view" id="v-tod"></div>
</div>

<div class="msk" id="msk" onclick="if(event.target===this)cm()"><div class="mbox" id="mb"></div></div>

<script>
const API='https://docs.google.com/spreadsheets/d/e/2PACX-1vS0f2wmDr_QSUDaZKujOMQl3jZ4Vdo0cSz-k2_CT7usxjjXezyo1HSzPqxQRnNP-aL7VowJ5q2BmjA6/pub?gid=1757881997&single=true&output=csv';
const MN=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

// ── Paleta de colores vibrante ────────────────────────────────────────────────
const PCOLORS={
  urgent:'#FF5C5C', high:'#FF9A3C', normal:'#4B9BFF', low:'#8BC4FF'
};
const PC={
  urgent:{t:'Urgente',c:'#FF5C5C',bg:'#FFF0F0'},
  high:{t:'Alto',c:'#FF9A3C',bg:'#FFF8EF'},
  normal:{t:'Normal',c:'#4B9BFF',bg:'#EFF6FF'},
  low:{t:'Bajo',c:'#8BC4FF',bg:'#F0F7FF'},
  '':{t:'—',c:'#9ca3af',bg:'#f9fafb'}
};
const SC={
  open:{t:'Abierto',c:'#dc2626',bg:'#fef2f2'},
  pending:{t:'Pendiente',c:'#d97706',bg:'#fffbeb'},
  solved:{t:'Resuelto',c:'#16a34a',bg:'#f0fdf4'},
  '':{t:'—',c:'#9ca3af',bg:'#f9fafb'}
};
const SLA_BANDS=[
  {max:7,k:'n',t:'≤7d',c:'#22C55E'},
  {max:30,k:'r',t:'8-30d',c:'#3B82F6'},
  {max:90,k:'s',t:'31-90d',c:'#F59E0B'},
  {max:365,k:'c',t:'91-365d',c:'#EF4444'},
  {max:99999,k:'p',t:'+365d',c:'#6B7280'}
];

let T=[], CH={}, TAB='ind', AKPI=null, HDR=[];

const el=id=>document.getElementById(id);
const bdg=(t,c,bg)=>`<span class="b" style="background:${bg};color:${c}">${t}</span>`;
function wk(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}

function parseDias(str){
  if(!str)return-1;
  const s=str.trim().toLowerCase();
  if(s==='corriente')return 0;
  const m=s.match(/(\d+)/);
  return m?parseInt(m[1]):-1;
}
function isSlaVencido(str){return parseDias(str)>=7;}
function getBand(str){
  const d=parseDias(str);
  if(d<0)return SLA_BANDS[0];
  return SLA_BANDS.find(b=>d<=b.max)||SLA_BANDS[4];
}
function getRangoColor(str){
  const d=parseDias(str);
  if(d<=0)return'#22C55E';if(d<=7)return'#22C55E';
  if(d<=30)return'#3B82F6';if(d<=90)return'#F59E0B';
  if(d<=365)return'#EF4444';return'#6B7280';
}

// ── mapRows con acceso posicional ────────────────────────────────────────────
// Columnas por posición (0-indexed A=0, B=1...):
// E=4 → Último seguimiento/Actualización
// G=6 → Empresa/Organización
// K=10 → Creado
// M=12 → Agente (traducción)
// N=13 → Área asignada / sin clasificar
// U=20 → Desarrollador
function mapRows(rows, headers){
  if(!rows.length)return[];
  HDR=headers||Object.keys(rows[0]);

  // Nombres de columna por posición
  const colE  =HDR[4]  ||''; // Último seguimiento
  const colG  =HDR[6]  ||''; // Empresa
  const colK  =HDR[10] ||''; // Creado
  const colM  =HDR[12] ||''; // Agente
  const colN  =HDR[13] ||''; // Área asignada
  const colU  =HDR[20] ||''; // Desarrollador

  // Detección por valor para campos base
  const keys=HDR;
  function fkv(pats){return keys.find(k=>pats.some(p=>{try{return new RegExp(p,'i').test(k);}catch{return false;}}));}

  const kId   =fkv(['^Id$','^ID$','\\bID\\b']);
  const kSt   =fkv(['^Estado$','^Status$']);
  const kPr   =fkv(['^Prioridad$','^Priority$']);
  const kSub  =fkv(['^Asunto$','^Subject$']);
  const kAssign=fkv(['Agente asignado','Assignee Name','Assignee']);
  const kSResp =fkv(['Responsable Soporte','S-Responsable','s-responsable']);
  const kRango =fkv(['Antigüedad.*ETIQUETA','Antiguedad.*ETIQUETA','antigüedad.*etiq']);
  const kTiempo=fkv(['Horas de atraso','tiempo transcurrido','horas.*atraso']);
  const kMesAnt=fkv(['Antigüedad.*Mes','Mes$','^Mes$']);
  const kDResp =colU?null:fkv(['D-Responsable','d-responsable','Desarrollador']);

  const now=new Date();
  const ST=[{d:0,s:0},{d:1,s:1},{d:2,s:2},{d:3,s:3},{d:4,s:5},{d:5,s:7},{d:6,s:9},{d:7,s:12},{d:15,s:20},{d:30,s:30},{d:45,s:40},{d:60,s:50},{d:90,s:60},{d:120,s:68},{d:180,s:75},{d:240,s:80},{d:360,s:88},{d:720,s:99}];
  const PS={urgent:400,high:300,normal:200,low:100,'':0};

  return rows.map(r=>{
    const id=parseInt(kId?r[kId]:'');if(!id||isNaN(id))return null;
    const priority=(kPr?r[kPr]||'':'').toLowerCase().trim();
    const status=(kSt?r[kSt]||'':'').toLowerCase().trim();
    const rangoStr=(kRango?r[kRango]||'':'').trim();
    const band=getBand(rangoStr);

    // Fecha creación desde col K
    const crRaw=(colK&&r[colK]?r[colK]:'').trim();
    const crDate=crRaw?new Date(crRaw):null;
    const created=crDate&&!isNaN(crDate)?crDate.toISOString().split('T')[0]:'';
    const days=created?Math.max(0,Math.floor((now-new Date(created))/86400000)):0;

    let brSc=0;for(const e of ST){if(days>=e.d)brSc=e.s;else break;}
    const score=(PS[priority]||0)+brSc;
    function act(s){if(s>=350)return{t:'Resolver hoy',c:'#dc2626'};if(s>=220)return{t:'Atender hoy',c:'#d97706'};if(s>=200)return{t:'Mañana',c:'#2563eb'};if(s>=100)return{t:'Esta semana',c:'#6b7280'};return{t:'—',c:'#9ca3af'};}

    // Tiempo transcurrido — buscar valor HH:MM:SS
    let tiempo='';
    if(kTiempo&&r[kTiempo]&&/\d+:\d{2}:\d{2}/.test(r[kTiempo])){tiempo=r[kTiempo].trim();}
    else{for(const v of Object.values(r)){if(/^\d{1,5}:\d{2}:\d{2}$/.test((v||'').trim())){tiempo=v.trim();break;}}}

    // Área asignada (col N) — detectar sin asignar
    const areaN=(colN?r[colN]||'':'').trim();
    const isSinAsignar=/sin\s+asignar|sin\s+clasificar/i.test(areaN);

    // Empresa desde col G
    const org=colG?r[colG]||'':'';

    // Último seguimiento desde col E
    const ultimoSeg=(colE?r[colE]||'':'').trim();
    // Formatear fecha si es date string
    let ultimoSegFmt=ultimoSeg;
    if(ultimoSeg){
      const d=new Date(ultimoSeg);
      if(!isNaN(d))ultimoSegFmt=d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }

    return{
      id, status, priority,
      subject:kSub?r[kSub]||'':'',
      org,
      agente:colM?r[colM]||'':'',
      areaAsig:areaN,
      dResp:colU?r[colU]||'':(kDResp?r[kDResp]||'':''),
      sResp:kSResp?r[kSResp]||'':'',
      assignee:kAssign?r[kAssign]||'':'',
      created, days, band, rangoStr,
      isSla:isSlaVencido(rangoStr),
      isSinAsignar,
      score, action:act(score),
      mes:created?MN[new Date(created).getMonth()+1]||'—':'—',
      mesAnt:kMesAnt?r[kMesAnt]||'':'',
      tiempo, ultimoSeg:ultimoSegFmt,
    };
  }).filter(Boolean);
}

// ── Chart helpers ────────────────────────────────────────────────────────────
function mkChart(id,type,labels,data,colors,horiz,onClickFn){
  if(CH[id])CH[id].destroy();
  const ctx=el(id);if(!ctx)return;

  // Crear gradientes para barras
  let bgColors=colors;
  if(type==='bar'){
    try{
      const c2d=ctx.getContext('2d');
      bgColors=colors.map((col,i)=>{
        const isH=horiz;
        const g=isH
          ?c2d.createLinearGradient(0,0,ctx.width||300,0)
          :c2d.createLinearGradient(0,0,0,ctx.height||200);
        g.addColorStop(0,col);
        g.addColorStop(1,col+'99');
        return g;
      });
    }catch(e){bgColors=colors;}
  }

  const opts={
    responsive:true,maintainAspectRatio:false,
    indexAxis:horiz?'y':'x',
    plugins:{
      legend:{display:false},
      tooltip:{
        callbacks:{label:c=>`${c.raw} tickets`},
        backgroundColor:'#111827',titleColor:'#9ca3af',
        bodyColor:'#f9fafb',cornerRadius:6,padding:8
      }
    },
    scales:type==='doughnut'?{}:{
      x:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780',drawBorder:false}},
      y:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780'}}
    }
  };

  if(onClickFn){
    opts.onClick=(e,elements)=>{
      if(elements.length>0){
        const idx=elements[0].index;
        onClickFn(labels[idx]);
      }
    };
    ctx.style.cursor='pointer';
    ctx.classList.add('clickable');
  }

  CH[id]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:bgColors,borderWidth:0,borderRadius:type==='bar'?4:0,hoverBackgroundColor:colors.map(c=>c+'CC')}]},options:opts});
}

// ── KPI Definitions ──────────────────────────────────────────────────────────

  {key:'high',  label:'Alta prioridad',   color:'#FF9A3C',borderColor:'#FF9A3C',fn:()=>T.filter(t=>t.priority==='high')},
  {key:'sla',   label:'Vencidos SLA +7d', color:'#F59E0B',borderColor:'#F59E0B',fn:()=>T.filter(t=>t.isSla)},
  {key:'sinA',  label:'Sin responsable',  color:'#7c3aed',borderColor:'#7c3aed',fn:()=>T.filter(t=>t.isSinAsignar)},

// ── Render Indicadores ────────────────────────────────────────────────────────
function renderInd(){
  const kpis=KDEF.map(k=>{
    const list=k.fn();
    const pct=T.length?Math.round(list.length/T.length*100):0;
    const isA=AKPI===k.key;
    return`<div class="kc${isA?' active':''}" style="${isA?`border-color:${k.color};box-shadow:0 0 0 3px ${k.color}20,var(--sh2)`:''}" onclick="setKPI('${k.key}')">
      <div class="kc-top"><span class="kc-arrow" style="color:${k.color}">▼</span></div>
      <div class="kc-val" style="color:${k.color}">${list.length}</div>
      <div class="kc-lbl">${k.label}</div>
      <div class="kc-bar"><div class="kc-fill" style="width:${pct}%;background:linear-gradient(90deg,${k.color},${k.color}88)"></div></div>
      <div class="kc-hint">Ver detalle · ${pct}%</div>
    </div>`;
  }).join('');

  // Org data
  const orgMap={};T.forEach(t=>{const o=(t.org||'Sin clasificar').trim()||'Sin clasificar';orgMap[o]=(orgMap[o]||0)+1;});
  const orgS=Object.entries(orgMap).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const orgH=Math.max(180,orgS.length*32);

  // Rango data (col R raw values sorted)
  const rVals=[...new Set(T.map(t=>t.rangoStr).filter(Boolean))];
  rVals.sort((a,b)=>parseDias(a)-parseDias(b));
  const rCounts=rVals.map(r=>T.filter(t=>t.rangoStr===r).length);
  const rColors=rVals.map(r=>getRangoColor(r));

  el('v-ind').innerHTML=`
    <div>
      <div class="slbl">Indicadores clave de operación</div>
      <div class="kpi-grid">${kpis}</div>
    </div>
    <div class="charts-row">
      <div class="ccard">
        <div class="ch"><span class="ct">Por prioridad</span></div>
        <div class="cb">
          <div style="position:relative;height:170px"><canvas id="cp"></canvas></div>
          <div class="chart-legend" id="pri-legend"></div>
        </div>
      </div>
      <div class="ccard">
        <div class="ch"><span class="ct">Antigüedad de tickets</span><span style="font-size:10px;color:var(--txt3)">Col. R · clic para filtrar</span></div>
        <div class="cb"><div style="position:relative;height:200px"><canvas id="ca"></canvas></div></div>
      </div>
      <div class="ccard">
        <div class="ch"><span class="ct">Tickets por empresa</span><span style="font-size:10px;color:var(--txt3)">${T.length} total · clic para filtrar</span></div>
        <div class="cb"><div style="position:relative;height:${orgH}px"><canvas id="cag"></canvas></div></div>
      </div>
    </div>
    <div class="detail-card" id="detail-card">
      <div class="detail-head" id="detail-head" style="background:#fef2f2;border-bottom:1px solid #fecaca">
        <span class="detail-title" id="detail-title">Sin responsable asignado</span>
        <div class="detail-meta">
          <span class="detail-count" id="detail-count" style="background:#fee2e2;color:#dc2626">0</span>
          <button class="detail-clear" id="detail-clear" onclick="clearFilter()" style="display:none">✕ Limpiar filtro</button>
        </div>
      </div>
      <div class="tw" id="detail-body"></div>
    </div>`;

  // Gráfica prioridad con leyenda
  const priData=['urgent','high','normal','low'].map(k=>T.filter(t=>t.priority===k).length);
  const priColors=[PCOLORS.urgent,PCOLORS.high,PCOLORS.normal,PCOLORS.low];
  CH['cp']&&CH['cp'].destroy();
  const cpCtx=el('cp');
  if(cpCtx){
    CH['cp']=new Chart(cpCtx,{type:'doughnut',
      data:{labels:['Urgente','Alto','Normal','Bajo'],datasets:[{data:priData,backgroundColor:priColors,borderWidth:2,borderColor:'#ffffff',hoverBorderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw} tickets`},backgroundColor:'#111827',titleColor:'#9ca3af',bodyColor:'#f9fafb',cornerRadius:6,padding:8}}}});
  }
  // Leyenda manual
  const legEl=el('pri-legend');
  if(legEl){
    const priLabels=['Urgente','Alto','Normal','Bajo'];
    legEl.innerHTML=priLabels.map((l,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${priColors[i]}"></div>${l}: ${priData[i]}</div>`).join('');
  }

  mkChart('ca','bar',rVals,rCounts,rColors,false,(label)=>{
    filterByChart('rango',label);
  });
  mkChart('cag','bar',orgS.map(x=>x[0]),orgS.map(x=>x[1]),orgS.map(()=>'#4B9BFF'),true,(label)=>{
    filterByChart('org',label);
  });

  renderDetail(AKPI, null, null);
}

// ── Chart filter & detail ────────────────────────────────────────────────────
let CHART_FILTER={type:null,value:null};

function filterByChart(type,value){
  CHART_FILTER={type,value};
  AKPI=null;
  document.querySelectorAll('.kc').forEach(c=>c.classList.remove('active'));
  renderDetail(null, type, value);
}

function setKPI(key){
  AKPI=AKPI===key?null:key;
  CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.kc').forEach((c,i)=>c.classList.toggle('active',AKPI===KDEF[i]?.key));
  document.querySelectorAll('.kc').forEach((c,i)=>{
    const k=KDEF[i];if(!k)return;
    c.style.borderColor=AKPI===k.key?k.color:'';
    c.style.boxShadow=AKPI===k.key?`0 0 0 3px ${k.color}20,var(--sh2)`:'';
  });
  renderDetail(AKPI, null, null);
}

function clearFilter(){
  AKPI=null;CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.kc').forEach(c=>{c.classList.remove('active');c.style.borderColor='';c.style.boxShadow='';});
  renderDetail(null, null, null);
}

function renderDetail(kpiKey, chartType, chartValue){
  const titleEl=el('detail-title');
  const countEl=el('detail-count');
  const bodyEl=el('detail-body');
  const headEl=el('detail-head');
  const clearEl=el('detail-clear');
  if(!titleEl||!bodyEl)return;

  let tickets=[];
  let title='Sin responsable asignado';
  let headStyle='background:#fef2f2;border-bottom:1px solid #fecaca';
  let countStyle='background:#fee2e2;color:#dc2626';
  let showClear=false;

  if(chartType&&chartValue){
    showClear=true;
    title=chartValue;
    if(chartType==='rango'){
      tickets=T.filter(t=>t.rangoStr===chartValue);
      const rc=getRangoColor(chartValue);
      headStyle=`background:${rc}15;border-bottom:1px solid ${rc}40`;
      countStyle=`background:${rc}25;color:${rc}`;
    } else if(chartType==='org'){
      tickets=T.filter(t=>t.org===chartValue);
      headStyle='background:#eff4ff;border-bottom:1px solid #bfdbfe';
      countStyle='background:#bfdbfe;color:#1e40af';
    }
  } else if(kpiKey){
    showClear=true;
    const kd=KDEF.find(k=>k.key===kpiKey);
    if(kd){
      tickets=kd.fn();title=kd.label;
      headStyle=`background:${kd.color}12;border-bottom:1px solid ${kd.color}30`;
      countStyle=`background:${kd.color}25;color:${kd.color}`;
    }
  } else {
    tickets=T.filter(t=>t.isSinAsignar);
  }

  titleEl.textContent=title;
  countEl.textContent=tickets.length;
  countEl.style.cssText=countStyle+';font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:10px';
  headEl.style.cssText=headStyle;
  if(clearEl)clearEl.style.display=showClear?'':'none';

  if(!tickets.length){
    bodyEl.innerHTML='<div class="empty" style="color:#16a34a">✓ Sin tickets en esta categoría</div>';
    return;
  }
  const sorted=[...tickets].sort((a,b)=>b.score-a.score);
  const rows=sorted.map(t=>{
    const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';
    const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
    return`<tr onclick="om(${t.id})">
      <td><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">#${t.id}</a></td>
      <td style="max-width:240px">${t.subject||'—'}</td>
      <td style="color:var(--txt2)">${t.org||'—'}</td>
      <td>${bdg(st.t,st.c,st.bg)}</td>
      <td>${bdg(pr.t,pr.c,pr.bg)}</td>
      <td>${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</td>
      <td style="color:var(--txt2)">${t.agente||t.sResp||'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
    </tr>`;
  }).join('');
  bodyEl.innerHTML=`<table><thead><tr><th>Ticket</th><th>Asunto</th><th>Empresa</th><th>Estado</th><th>Prioridad</th><th>Antigüedad</th><th>Agente</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>`;
}

  const fr=el('far')?.value||'',ft=el('fat')?.value||'',fm=el('fam')?.value||'';

    if(fr&&t.rangoStr!==fr)return false;

    if(fm&&t.mesAnt!==fm)return false;
    return true;

  const rows=list.map(t=>{
    const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';

    <div class="score-block" style="border-color:${sc}25">
      <div class="score-num" style="color:${sc}">${t.score}</div>
      <div><div style="font-size:10px;font-weight:700;color:${sc};text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Score</div>
      <div style="font-size:13px;font-weight:600;color:var(--txt2)">${t.action.t}</div></div>
    </div>
    ${t.tiempo?`<div class="tbox"><div><div style="font-family:var(--mono);font-size:18px;font-weight:600;color:#16a34a">${t.tiempo}</div><div style="font-size:11px;color:var(--txt3);margin-top:2px">Tiempo en espera</div></div></div>`:''}
    <div class="mdv"></div>
    <div class="mr"><span class="ml">ID Ticket</span><span class="mv"><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:600;color:#2563eb;text-decoration:none">#${t.id} ↗</a></span></div>
    <div class="mr"><span class="ml">Empresa</span><span class="mv">${t.org||'—'}</span></div>
    <div class="mr"><span class="ml">Creado</span><span class="mv" style="font-family:var(--mono)">${t.created||'—'}</span></div>
    <div class="mr"><span class="ml">Último seguimiento</span><span class="mv">${t.ultimoSeg||'—'}</span></div>
    <div class="mr"><span class="ml">Área asignada</span><span class="mv">${t.areaAsig||t.assignee||'—'}</span></div>
    <div class="mr"><span class="ml">Agente</span><span class="mv">${t.agente||t.sResp||'—'}</span></div>
    <div class="mr"><span class="ml">Desarrollador</span><span class="mv">${t.dResp||'—'}</span></div>`;
  el('msk').classList.add('on');
}
function cm(){el('msk').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cm();});

// ── Tabs ──────────────────────────────────────────────────────────────────────
function go(tab){
  TAB=tab;AKPI=null;CHART_FILTER={type:null,value:null};
  document.querySelectorAll('.ntab').forEach((b,i)=>b.classList.toggle('on',['ind','sop','dev','ant','tod'][i]===tab));
  ['ind','sop','dev','ant','tod'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
  const v=el('v-'+tab);if(v)v.classList.add('on');
  if(tab==='ind')renderInd();
  else if(tab==='sop')renderArea('sop','v-sop');
  else if(tab==='dev')renderArea('dev','v-dev');
  else if(tab==='ant')renderAnt();
  else if(tab==='tod')renderTod();
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function fetchCSV(csvUrl){
  const url = csvUrl.includes('?') ? csvUrl + '&cachebust=' + Date.now() : csvUrl + '?cachebust=' + Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text){
  const lines = text.split('\n').filter(l => l.trim());
  // Find header row - has 'Id' and 'Status' or 'Estado'
  let hi = 0;
  for(let i = 0; i < Math.min(6, lines.length); i++){
    const r = csvLine(lines[i]).map(v => v.toLowerCase().trim());
    if(r.some(v => v === 'id') && r.some(v => ['status','estado','prioridad','priority'].includes(v))){
      hi = i; break;
    }
  }
  const headers = csvLine(lines[hi]).map(h => h.trim());
  const rows = [];
  for(let i = hi + 1; i < lines.length; i++){
    const vals = csvLine(lines[i]);
    if(!vals[0] || !vals[0].trim()) continue;
    const row = {};
    headers.forEach((h, j) => row[h] = (vals[j] || '').trim());
    if(/^\d{5,7}$/.test(row['Id'] || row['id'] || '')) rows.push(row);
  }
  return { rows, headers };
}

function csvLine(line){
  const r = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(ch === '"'){ if(q && line[i+1] === '"'){cur+='"';i++;}else q=!q; }
    else if(ch === ',' && !q){ r.push(cur); cur = ''; }
    else cur += ch;
  }
  r.push(cur);
  return r;
}


async function loadData(){
  const btn=el('ubtn');btn.disabled=true;btn.classList.add('spin');
  el('ldr').style.display='flex';
  ['ind','sop','dev','ant','tod'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
  AKPI=null;CHART_FILTER={type:null,value:null};
  try{
    el('ls').textContent='Leyendo Ant_Tickets…';
    const {rows, headers: hdrs} = await fetchCSV(API);
    T=mapRows(rows, hdrs);
    const now=new Date();
    el('cf').textContent=now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
    el('cs').textContent='SEM '+wk(now);
    el('ct').textContent=T.length+' tickets';
    el('cu').textContent=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    el('nb-ind').textContent=T.length;
    el('nb-sop').textContent=T.filter(t=>t.assignee==='Soporte 1').length;
    el('nb-dev').textContent=T.filter(t=>t.assignee==='Desarrollo 1').length;
    el('nb-tod').textContent=T.length;
    el('ldr').style.display='none';
    const v=el('v-'+TAB);if(v)v.classList.add('on');
    if(TAB==='ind')renderInd();
    else if(TAB==='sop')renderArea('sop','v-sop');
    else if(TAB==='dev')renderArea('dev','v-dev');
    else if(TAB==='ant')renderAnt();
    else if(TAB==='tod')renderTod();
  }catch(e){
    el('ldr').style.display='none';
    const v=el('v-ind');if(v){v.classList.add('on');v.innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rl);padding:20px"><div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:6px">Error al cargar datos</div><div style="font-size:12px;color:#6b7280;margin-bottom:14px">${e.message}</div><button onclick="loadData()" style="padding:7px 16px;border-radius:var(--r);border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)">↺ Reintentar</button></div>`;}
    TAB='ind';document.querySelectorAll('.ntab').forEach((b,i)=>b.classList.toggle('on',i===0));
  }finally{btn.disabled=false;btn.classList.remove('spin');}
}
loadData();
</script>
