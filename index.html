<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dashboard Supervisor — Santi Soluciones v3</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f2f7;--sur:#fff;--sur2:#f7f8fc;--sur3:#eef0f6;
  --bdr:#e2e5ef;--bdr2:#d0d4e8;
  --txt:#111827;--txt2:#4b5568;--txt3:#9ca3af;
  --acc:#2563eb;--acc2:#eff4ff;--acc3:#dbeafe;
  --grn:#16a34a;--red:#dc2626;--org:#d97706;--pur:#7c3aed;
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:48px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:30;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:28px;height:28px;border-radius:6px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.brand-name{font-size:13px;font-weight:700;color:var(--txt)}
.brand-sep{width:1px;height:18px;background:var(--bdr);margin:0 4px}
.brand-sub{font-size:11px;color:var(--txt3);font-weight:500}
.chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2);font-family:var(--mono)}
.chip.live{color:var(--grn);background:#f0fdf4;border-color:#bbf7d0}
.ubtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.ubtn:hover{background:#1d4ed8}
.ubtn:disabled{opacity:.5;cursor:not-allowed}
.ubtn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.nav{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr)}
.ntab{flex:1;text-align:center;padding:0 10px;height:40px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.ntab:hover{color:var(--txt2)}
.ntab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--sur3);color:var(--txt3);font-family:var(--mono)}
.ntab.on .nb{background:var(--acc3);color:var(--acc)}
.nb.danger{background:#fef2f2 !important;color:#dc2626 !important}
.nb.warn{background:#fffbeb !important;color:#92400e !important}
.main{flex:1;padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl)}
.ring{width:34px;height:34px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.card-head{padding:10px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title{font-size:12px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:6px}
.card-title.danger{color:#dc2626}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge.red{background:#fef2f2;color:#dc2626;border:0.5px solid #fecaca}
.badge.amber{background:#fffbeb;color:#92400e;border:0.5px solid #fde68a}
.badge.blue{background:#eff4ff;color:#1e40af;border:0.5px solid #bfdbfe}
.badge.green{background:#f0fdf4;color:#15803d;border:0.5px solid #bbf7d0}
.greeting{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--sh)}
.greeting-title{font-size:14px;font-weight:700;color:var(--txt)}
.greeting-sub{font-size:11px;color:var(--txt3);margin-top:3px}
.date-chip{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--sur2);color:var(--txt2);border:1px solid var(--bdr);white-space:nowrap}
.trow-grid{display:grid;grid-template-columns:24px 1fr 78px 64px 110px 46px;align-items:start;gap:8px;padding:9px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
.trow-grid:hover{background:var(--sur2)}
.trow-grid:last-of-type{border-bottom:none}
.trow-hdr{background:var(--sur2);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);padding:5px 16px;border-bottom:1px solid var(--bdr)}
.t-num{font-size:10px;color:var(--txt3);font-weight:600;padding-top:2px}
.t-id{font-size:11px;font-weight:700;color:var(--acc);text-decoration:none;font-family:var(--mono)}
.t-sub{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ag{font-size:11px;color:var(--txt2);padding-top:2px}
.t-ant{font-size:11px;color:var(--txt2);padding-top:2px}
.pr-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;font-family:var(--mono);display:inline-block}
.pr-tag.urgent{background:#FFF0F0;color:#FF5C5C}
.pr-tag.high{background:#FFF8EF;color:#FF9A3C}
.pr-tag.normal{background:#EFF6FF;color:#4B9BFF}
.pr-tag.low{background:#F0F7FF;color:#8BC4FF}
.why-pill{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;display:inline-block}
.why-pill.fire{background:#fef2f2;color:#dc2626;border:0.5px solid #fecaca}
.why-pill.clock{background:#fffbeb;color:#92400e;border:0.5px solid #fde68a}
.why-pill.ghost{background:#faf5ff;color:#7c3aed;border:0.5px solid #e9d5ff}
.sc{font-family:var(--mono);font-weight:700;font-size:12px;padding-top:2px}
.sc.crit{color:#EF4444}.sc.warn{color:#F59E0B}.sc.ok{color:#4B9BFF}
.expand-row{padding:8px 16px;font-size:11px;color:var(--acc);text-align:center;border-top:1px solid var(--bdr);background:var(--sur2);cursor:pointer}
.expand-row:hover{background:var(--sur3)}
.legend-row{padding:7px 16px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--txt3);border-top:1px solid var(--bdr);background:var(--sur2);flex-wrap:wrap}
.ag-hoy-hdr{display:grid;grid-template-columns:28px 1fr 54px 64px 54px 16px;gap:8px;padding:5px 16px;background:var(--sur2);border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
.ag-hoy-row{display:grid;grid-template-columns:28px 1fr 54px 64px 54px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bdr);gap:8px;cursor:pointer;transition:background .1s}
.ag-hoy-row:last-child{border-bottom:none}
.ag-hoy-row:hover{background:var(--sur2)}
.ag-hoy-row.rl{border-left:3px solid #dc2626}
.ag-hoy-row.al{border-left:3px solid #d97706}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.av.r{background:#fef2f2;color:#dc2626}
.av.a{background:#fffbeb;color:#92400e}
.av.g{background:#f0fdf4;color:#15803d}
.ag-name{font-size:12px;font-weight:600;color:var(--txt)}
.ag-area-lbl{font-size:10px;color:var(--txt3)}
.ag-metric{text-align:center}
.ag-val{font-size:14px;font-weight:700}
.ag-val.r{color:#dc2626}.ag-val.a{color:#d97706}.ag-val.g{color:var(--txt3)}
.ag-lbl{font-size:9px;color:var(--txt3);margin-top:1px}
.pred-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}
.pred-card{border-radius:var(--rl);padding:14px;text-align:center;cursor:pointer;transition:transform .15s;border:1px solid}
.pred-card:hover{transform:translateY(-2px)}
.pred-num{font-size:28px;font-weight:700;font-family:var(--mono)}
.pred-lbl{font-size:11px;font-weight:600;margin-top:4px}
.pred-src{font-size:9px;opacity:.75;margin-top:3px}
.pred-hint{font-size:9px;color:var(--txt3);margin-top:5px}
/* Filtros */
.filter-bar{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bdr);background:var(--sur2);flex-wrap:wrap}
.filter-select{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--sur);color:var(--txt2);cursor:pointer;font-family:var(--font)}
.filter-btn-clear{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #fca5a5;background:#fef2f2;color:#dc2626;cursor:pointer;font-family:var(--font)}
.filter-btn-clear:hover{background:#dc2626;color:#fff}
/* Equipo */
.area-filter{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);background:var(--sur2);align-items:center}
.area-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--bdr);background:var(--sur);color:var(--txt2);cursor:pointer;transition:all .15s;font-family:var(--font)}
.area-btn:hover{border-color:var(--acc);color:var(--acc)}
.area-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:12px}
.eq-card{background:var(--sur2);border-radius:var(--rl);padding:14px;cursor:pointer;transition:all .15s;border:1px solid var(--bdr)}
.eq-card:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.eq-card.rl{border-left:4px solid #dc2626}
.eq-card.al{border-left:4px solid #d97706}
.eq-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.eq-m{background:var(--sur);border-radius:var(--r);padding:6px 4px;text-align:center}
.eq-mv{font-size:18px;font-weight:700;font-family:var(--mono)}
.eq-ml{font-size:9px;color:var(--txt3);margin-top:1px}
.al-dia-list{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.al-dia-chip{font-size:11px;padding:4px 12px;border-radius:20px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
/* Panorama KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:12px}
.kc{background:var(--sur2);border-radius:var(--rl);padding:14px 16px;cursor:pointer;transition:all .18s;border:1px solid var(--bdr)}
.kc:hover,.kc.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc3);transform:translateY(-1px)}
.kc.active{background:var(--acc2)}
.kc.emp3-kc{border:1.5px dashed #0891b2}
.kv{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.04em;font-family:var(--mono)}
.kl{font-size:11px;font-weight:600;color:var(--txt2);margin-top:3px}
.kb{height:3px;border-radius:2px;margin-top:10px;background:var(--sur3);overflow:hidden}
.kf{height:100%;border-radius:2px}
.kh{font-size:10px;color:var(--txt3);margin-top:3px}
/* Tendencia */
.trend-box{padding:12px 16px}
.trend-labels{display:flex;margin-top:4px}
.trend-lbl{flex:1;text-align:center;font-size:9px;color:var(--txt3)}
.trend-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.trend-li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txt2)}
.charts-row{display:grid;grid-template-columns:220px 1fr 1fr;gap:10px}
@media(max-width:860px){.charts-row{grid-template-columns:1fr 1fr}}
/* Gráfica barras agente */
.ag-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ag-bar-lbl{font-size:10px;color:var(--txt2);min-width:70px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-bar-track{flex:1;height:14px;background:var(--sur3);border-radius:3px;overflow:hidden}
.ag-bar-fill{height:100%;border-radius:3px}
.ag-bar-val{font-size:10px;font-weight:700;color:var(--txt2);min-width:24px;font-family:var(--mono)}
/* Tabla */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
thead th{padding:7px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap}
tbody td{padding:8px 12px;border-bottom:1px solid var(--bdr);font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)}
tbody tr:last-child td{border-bottom:none}
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
.empty{padding:28px;text-align:center;color:var(--txt3);font-size:13px}
.msk{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:48px;backdrop-filter:blur(3px)}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);padding:22px;max-width:520px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.12);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mttl{font-size:15px;font-weight:700;line-height:1.4;flex:1;margin-right:10px}
.mx{background:none;border:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--txt3);font-size:18px;display:flex;align-items:center;justify-content:center}
.mx:hover{background:var(--sur3);color:var(--txt)}
.mdv{height:1px;background:var(--bdr);margin:12px 0}
.mr{display:flex;gap:8px;margin-bottom:8px;font-size:12px}
.ml{color:var(--txt3);min-width:140px;flex-shrink:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mv{color:var(--txt);font-weight:500}
.score-block{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.score-num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--txt2)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.ccard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.ch{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}
.ct{font-size:12px;font-weight:700;color:var(--txt)}
.cb{padding:12px}
  .nivel-critico{border-left:4px solid #dc2626 !important;background:#fff8f8}
  .nivel-atencion{border-left:4px solid #d97706 !important;background:#fffdf5}
  .nivel-vigilancia{border-left:4px solid #2563eb !important}
  .nivel-label{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
  .nivel-label.c{background:#fef2f2;color:#dc2626}
  .nivel-label.a{background:#fffbeb;color:#d97706}
  .nivel-label.v{background:#eff4ff;color:#2563eb}
  .rev-btn{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid var(--bdr);background:none;cursor:pointer;color:var(--txt3);font-family:var(--font);white-space:nowrap}
  .rev-btn:hover{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
  .cli-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
  .cli-row:last-child{border-bottom:none}
  .cli-row:hover{background:var(--sur2)}
  .cli-avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .cli-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .mini-kpi{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:12px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
  .mini-kpi:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
  .mini-kpi-val{font-size:26px;font-weight:700;line-height:1;font-family:var(--mono)}
  .mini-kpi-lbl{font-size:10px;font-weight:600;color:var(--txt3);margin-top:3px}
  .nivel-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
  .nivel-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .1s}
  .nivel-head:hover{background:var(--sur2)}
  .hoy-row{display:grid;grid-template-columns:22px 1fr 80px 64px 46px 70px;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s}
  .hoy-row:last-child{border-bottom:none}
  .hoy-row:hover{background:var(--sur2)}
  .hoy-rev{opacity:.4;text-decoration:line-through}
  .hoy-hdr{display:grid;grid-template-columns:22px 1fr 80px 64px 46px 70px;gap:8px;padding:5px 14px;background:var(--sur2);border-bottom:1px solid var(--bdr);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
  .slack-btn{font-size:13px;background:none;border:1px solid var(--bdr);border-radius:4px;cursor:pointer;padding:1px 5px;transition:all .15s}
  .slack-btn:hover{background:#4A154B;border-color:#4A154B}
  .ag-chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--rl);border:1px solid var(--bdr);background:var(--sur);cursor:pointer;transition:all .15s;min-width:160px}
  .ag-chip:hover{border-color:var(--bdr2);transform:translateY(-1px);box-shadow:var(--sh)}
  .ag-chip-r{border-left:3px solid #dc2626}
  .ag-chip-a{border-left:3px solid #d97706}
  .cli-table-row:hover td{background:var(--sur2)}
  .cli-table-row td{padding:8px 12px;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--txt)}
</style>
</head>
<body>
<div class="tb">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="brand">
      <div class="brand-icon">SS</div>
      <span class="brand-name">Santi Soluciones</span>
      <div class="brand-sep"></div>
      <span class="brand-sub">Dashboard Supervisor</span>
    </div>
    <div class="chips">
      <span class="chip live">● En línea</span>
      <span class="chip" id="cf">–</span>
      <span class="chip" id="cs">–</span>
      <span class="chip" id="ct">–</span>
      <span class="chip" id="cu" style="color:var(--txt3)">Sin actualizar</span>
    </div>
  </div>
  <button class="ubtn" id="ubtn" onclick="loadData()">

const SC={open:{t:'Abierto',c:'#dc2626',bg:'#fef2f2'},pending:{t:'Pendiente',c:'#d97706',bg:'#fffbeb'},solved:{t:'Resuelto',c:'#16a34a',bg:'#f0fdf4'},'':{t:'—',c:'#9ca3af',bg:'#f9fafb'}};

function wk(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}
function parseDias(str){if(!str)return-1;const s=str.trim().toLowerCase();if(s==='corriente')return 0;const m=s.match(/(\d+)/);return m?parseInt(m[1]):-1;}
function isSlaVencido(str){return parseDias(str)>=7;}
function getRangoColor(str){const d=parseDias(str);if(d<0)return'#9ca3af';if(d<=0)return'#22C55E';if(d<=7)return'#22C55E';if(d<=30)return'#3B82F6';if(d<=90)return'#F59E0B';if(d<=365)return'#EF4444';return'#6B7280';}
function isSinSeguimiento(fechaStr,now){if(!fechaStr||fechaStr.trim()==='')return false;const d=new Date(fechaStr);if(isNaN(d))return false;return(now-d)/86400000>3;}

// ── ÁREA ESTRICTA POR AGENTE ─────────────────────────────────────
const AREA_AGENTES={Customer:['hector','héctor','andrea'],Soporte:['alejandra','ivette','karina'],Implementación:['oscar','leonardo']};
function getAreaAgente(t){
  const ag=(t.agente||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const[area,lista]of Object.entries(AREA_AGENTES)){
    if(lista.some(n=>ag===n||ag.startsWith(n)))return area;
  }
  if(t.dResp&&t.dResp.trim()!==''&&t.dResp.trim().toLowerCase()!=='no')return'Desarrollo';
  return t.areaAsig||'—';
}

function mapRows(rows,headers){
  if(!rows.length)return[];
  HDR=headers||Object.keys(rows[0]);
  function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
  function findColIdx(patterns){return HDR.findIndex(h=>patterns.some(p=>norm(h).includes(norm(p))));}
  function findCol(patterns){const i=findColIdx(patterns);return i>=0?HDR[i]:'';}
  const colMIdx=findColIdx(['traduccion final de agente','traducción final de agente','final de agente']);
  const colMFallback=findColIdx(['traduccion de agente','traducción de agente']);
  const colM=colMIdx>=0?HDR[colMIdx]:(colMFallback>=0?HDR[colMFallback]:(HDR[12]||''));
  const colNIdx=findColIdx(['etiqueta']);
  const colN=colNIdx>=0?HDR[colNIdx]:(HDR[13]||'');
  const colE=findCol(['actualizacion','actualizaci'])||HDR[4]||'';
  const colG=findCol(['traduccion organizacion','traduccion org'])||HDR[6]||'';
  const colK=findCol(['fecha inicio'])||HDR[10]||'';
  const colU=HDR[20]||'';
  function fkv(pats){return HDR.find(k=>pats.some(p=>{try{return new RegExp(p,'i').test(k);}catch{return false;}}));}
  const kId=fkv(['^ID$','^Id$','^id$']);
  const kSt=fkv(['^Estado$','^Status$']);
  const kPr=fkv(['^Prioridad$','^Priority$']);
  const kSub=fkv(['^Asunto$','^Subject$']);
  const kAssign=fkv(['Agente asignado','Assignee']);
  const kSResp=fkv(['Responsable Soporte']);
  const kRango=fkv(['Antigüedad.*ETIQUETA','Antiguedad.*ETIQUETA','antigüedad.*etiq']);
  const kMesAnt=fkv(['Antigüedad.*Mes','Mes$','^Mes$']);
  const now=new Date();
  const ST=[{d:0,s:0},{d:1,s:1},{d:2,s:2},{d:3,s:3},{d:4,s:5},{d:5,s:7},{d:6,s:9},{d:7,s:12},{d:15,s:20},{d:30,s:30},{d:45,s:40},{d:60,s:50},{d:90,s:60},{d:120,s:68},{d:180,s:75},{d:240,s:80},{d:360,s:88},{d:720,s:99}];
  const PS={urgent:400,high:300,normal:200,low:100,'':0};
  return rows.map(r=>{
    const id=parseInt(kId?r[kId]:'');if(!id||isNaN(id))return null;
    const priority=(kPr?r[kPr]||'':'').toLowerCase().trim();
    const status=(kSt?r[kSt]||'':'').toLowerCase().trim();
    const rangoStr=(kRango?r[kRango]||'':'').trim();
    const crRaw=(colK&&r[colK]?r[colK]:r[colE]||'').trim();
    const crDate=crRaw?new Date(crRaw):null;
    const created=crDate&&!isNaN(crDate)?crDate.toISOString().split('T')[0]:'';
    const days=created?Math.max(0,Math.floor((now-new Date(created))/86400000)):0;
    let brSc=0;for(const e of ST){if(days>=e.d)brSc=e.s;else break;}
    const score=(PS[priority]||0)+brSc;
    function act(s){if(s>=350)return{t:'Resolver hoy',c:'#dc2626'};if(s>=220)return{t:'Atender hoy',c:'#d97706'};if(s>=200)return{t:'Mañana',c:'#2563eb'};return{t:'Esta semana',c:'#6b7280'};}
    const areaN=(colN?r[colN]||'':'').trim();
    const isSinAsignar=/sin\s+asignar|sin\s+clasificar|ticket\s+sin|^nuevo$/i.test(areaN)||areaN==='';
    const ultimoSegRaw=(colE?r[colE]||'':'').trim();
    return{id,status,priority,subject:kSub?r[kSub]||'':'',org:colG?r[colG]||'':'',agente:colM?r[colM]||'':'',areaAsig:areaN,dResp:colU?r[colU]||'':'',sResp:kSResp?r[kSResp]||'':'',assignee:kAssign?r[kAssign]||'':'',created,days,rangoStr,isSla:isSlaVencido(rangoStr),isSinAsignar,sinSeguimiento:isSinSeguimiento(ultimoSegRaw,now),createdFmt:fmtDateShort(crRaw),score,action:act(score),mesAnt:kMesAnt?r[kMesAnt]||'':'',ultimoSeg:ultimoSegRaw};
  }).filter(Boolean);
}

const STORE={
  getNotas(id){try{return JSON.parse(localStorage.getItem('notas_'+id)||'[]');}catch{return[];}},

  delNota(id,ts){const notas=STORE.getNotas(id).filter(n=>n.ts!==ts);localStorage.setItem('notas_'+id,JSON.stringify(notas));},

  getNotaCliente(org){try{return JSON.parse(localStorage.getItem('cli_'+btoa(unescape(encodeURIComponent(org||'')))||'{}'));}catch{return{};}},
  setNotaCliente(org,data){localStorage.setItem('cli_'+btoa(unescape(encodeURIComponent(org||''))),JSON.stringify(data));},
};

function fmtTs(ts){
  const d=new Date(ts);
  const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

const CLIENTES_GID = localStorage.getItem('clientes_gid') || '';
let CLIENTES_DATA = []; // Se carga una vez con loadClientesSheet()

async function loadClientesSheet(){
  const gid=CLIENTES_GID||localStorage.getItem('clientes_gid')||'';
  if(!gid){return false;}
  try{
    const baseUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vS0f2wmDr_QSUDaZKujOMQl3jZ4Vdo0cSz-k2_CT7usxjjXezyo1HSzPqxQRnNP-aL7VowJ5q2BmjA6/pub';
    const url=baseUrl+'?gid='+gid+'&single=true&output=csv';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)return false;
    const txt=await r.text();
    const{rows,headers}=parseCSV(txt);
    CLIENTES_DATA=rows;
    return true;
  }catch(e){console.error('loadClientesSheet:',e);return false;}
}

function renderClientesConDatos(){
  const v=el('v-clientes');if(!v)return;
  // Mapear columnas del Excel: Servidor, INSTANCIAS, empresa, encargado, Correo, Telefono...
  const rows=CLIENTES_DATA;
  const hdrs=Object.keys(rows[0]||{});

  // Detectar columnas clave
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const findH=pats=>hdrs.find(h=>pats.some(p=>norm(h).includes(p)))||'';
  const cEmp=findH(['empresa','company']);
  const cEnc=findH(['encargado','responsable','contacto']);
  const cCor=findH(['correo','email','mail']);
  const cTel=findH(['telefono','tel','phone']);
  const cSrv=findH(['servidor','server']);
  const cInst=findH(['instancia','instance','url']);

  const tableRows=rows.map((r,i)=>{
    const emp=r[cEmp]||'—';
    const enc=r[cEnc]||'—';
    const cor=r[cCor]||'—';
    const tel=r[cTel]||'—';
    const srv=r[cSrv]||'—';
    const inst=r[cInst]||'';
    // Tickets de Zendesk vinculados
    const tks=T.filter(t=>{
      const o=(t.org||'').toLowerCase();
      const e=emp.toLowerCase();
      return o.includes(e.substring(0,6))||e.includes(o.substring(0,6));
    });
    const maxSc=tks.length?Math.max(...tks.map(t=>t.score)):0;
    const sc=maxSc>=350?'#dc2626':maxSc>=220?'#d97706':'#16a34a';
    const nota=STORE.getNotaCliente(emp)||{};
    return`<tr class="cli-table-row" onclick="showClienteDetailPlus('${emp.replace(/'/g,"\\'").replace(/\\/g,'\\\\')}')" style="cursor:pointer">

      <td style="font-size:11px">${tel}</td>
      <td style="text-align:center">
        ${inst?`<a href="${inst.startsWith('http')?inst:'https://'+inst}" target="_blank" onclick="event.stopPropagation()" style="font-size:10px;background:var(--acc2);color:var(--acc);padding:2px 7px;border-radius:4px;font-weight:600;text-decoration:none">🔗 Acceder</a>`:'—'}

      </td>
    </tr>`;

function filtrarClientes(q){

  if(tbody)tbody.innerHTML=renderCliTableRows(filtered);
}

function renderCliTableRows(rows){

    const sc=maxSc>=350?'#dc2626':maxSc>=220?'#d97706':'#16a34a';

}

function showClienteDetailPlus(org){
  const wrap=el('cli-detail-wrap-plus');if(!wrap)return;
  if(wrap.dataset.open===org){wrap.dataset.open='';wrap.innerHTML='';return;}
  // Reusar showClienteDetail (ya existe)
  wrap.dataset.open=org;
  const oldWrap=el('cli-detail-wrap');
  const savedOpen=oldWrap?oldWrap.dataset.open:'';
  // Crear un div temporal para el detalle
  wrap.innerHTML='<div id="cli-detail-tmp"></div>';
  const tmp=el('cli-detail-tmp');
  // Llamar showClienteDetail que escribe en cli-detail-wrap
  if(oldWrap)oldWrap.style.display='none';
  showClienteDetail(org);
  // Mover el contenido al wrap-plus
  if(oldWrap&&oldWrap.innerHTML){
    wrap.innerHTML=oldWrap.innerHTML;
    oldWrap.innerHTML='';
    if(savedOpen)oldWrap.dataset.open=savedOpen;
  }
  setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

function addCliNota(org,key,currentOrg){
  const inp=el('cli-nota-inp-'+key);if(!inp||!inp.value.trim())return;
  const data=STORE.getNotaCliente(org)||{situacion:'',notas:[]};
  if(!data.notas)data.notas=[];
  data.notas.unshift({ts:Date.now(),txt:inp.value.trim()});

function deleteCliNota(org,ts){
  const data=STORE.getNotaCliente(org)||{situacion:'',notas:[]};
  data.notas=(data.notas||[]).filter(n=>n.ts!==ts);
  STORE.setNotaCliente(org,data);
  showClienteDetail(org);
}

// ── ANÁLISIS ─────────────────────────────────────────────────────
function getTicketsQuemandose(){
  return T.filter(t=>{
    const r=(t.rangoStr||'').trim().toLowerCase();
    return r==='7 días'||r==='7 dias'||r==='6 días'||r==='6 dias'||t.sinSeguimiento||(t.isSinAsignar&&(t.priority==='urgent'||t.priority==='high'));
  }).sort((a,b)=>{const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);return db!==da?db-da:b.score-a.score;});
}
function getAgentesEnRiesgo(){
  const agMap={};
  T.forEach(t=>{
    const ag=(t.agente||'').trim();
    if(!ag||ag.toLowerCase()==='no'||ag==='')return;
    if(!agMap[ag])agMap[ag]={tickets:[],area:getAreaAgente(t)};
    agMap[ag].tickets.push(t);
  });
  return Object.entries(agMap).map(([ag,d])=>{
    const tks=d.tickets;
    const sinSeg=tks.filter(t=>t.sinSeguimiento).length;
    const mas7=tks.filter(t=>parseDias(t.rangoStr)>=7).length;
    const total=tks.length;
    if(!sinSeg&&!mas7&&total<5)return null;
    const nivel=(sinSeg>3||mas7>5)?'r':'a';
    return{ag,total,sinSeg,mas7,area:d.area,nivel,urghi:tks.filter(t=>t.priority==='urgent'||t.priority==='high').length,_tickets:tks};
  }).filter(Boolean).sort((a,b)=>a.nivel!==b.nivel?a.nivel==='r'?-1:1:b.sinSeg-a.sinSeg);
}
function getDesarrolladoresConRiesgo(){
  // Filtra SOLO tickets donde col N (areaAsig) sea exactamente 'Desarrollo'
  const devTickets=T.filter(t=>{
    const area=(t.areaAsig||'').trim().toLowerCase();
    return area==='desarrollo'||area.includes('desarrollo');
  });
  const devMap={};
  devTickets.forEach(t=>{
    const dev=(t.dResp||'').trim();
    const key=dev&&dev.toLowerCase()!=='no'&&dev!==''?dev:'Sin asignar';
    if(!devMap[key])devMap[key]={tickets:[]};
    devMap[key].tickets.push(t);
  });
  return Object.entries(devMap).map(([dev,d])=>{
    const tks=d.tickets;
    const sinSeg=tks.filter(t=>t.sinSeguimiento).length;
    const mas7=tks.filter(t=>parseDias(t.rangoStr)>=7).length;
    const total=tks.length;
    if(!sinSeg&&!mas7&&total<1)return null;
    const nivel=(sinSeg>3||mas7>5)?'r':'a';
    return{ag:dev,total,sinSeg,mas7,area:'Desarrollo',nivel,urghi:tks.filter(t=>t.priority==='urgent'||t.priority==='high').length,_tickets:tks};
  }).filter(Boolean).sort((a,b)=>b.total-a.total);
}
function getPredSLA(){
  const now=new Date();
  const ind1=T.filter(t=>{const r=(t.rangoStr||'').trim().toLowerCase();return r==='7 días'||r==='7 dias';});
  const ind2=T.filter(t=>{const r=(t.rangoStr||'').trim().toLowerCase();return r==='6 días'||r==='6 dias';});
  const ind3=T.filter(t=>{if(!t.ultimoSeg||!t.ultimoSeg.trim())return false;const d=new Date(t.ultimoSeg);if(isNaN(d))return false;return(now-d)/86400000>3;});
  const ind4=T.filter(t=>{if(!t.ultimoSeg||!t.ultimoSeg.trim())return false;const d=new Date(t.ultimoSeg);if(isNaN(d))return false;const diff=(now-d)/86400000;return diff>2&&diff<=3;});
  return{ind1,ind2,ind3,ind4,n1:ind1.length,n2:ind2.length,n3:ind3.length,n4:ind4.length};
}
function getTrendData(){
  const now=new Date();const weeks=[];
  for(let w=5;w>=0;w--){
    const wStart=new Date(now);wStart.setDate(now.getDate()-w*7-now.getDay());wStart.setHours(0,0,0,0);
    const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+7);
    weeks.push({label:'S-'+wk(wStart),open:T.filter(t=>{if(!t.created)return false;const d=new Date(t.created);return d>=wStart&&d<wEnd;}).length,sla:T.filter(t=>{if(!t.created)return false;const d=new Date(t.created);return d>=wStart&&d<wEnd&&t.isSla;}).length});
  }
  return weeks;
}
function getTopSolicitantes(){
  const map={};
  T.forEach(t=>{const sol=(t.sResp||t.assignee||'').trim();if(!sol||sol.toLowerCase()==='no')return;if(!map[sol])map[sol]={count:0,maxScore:0};map[sol].count++;if(t.score>map[sol].maxScore)map[sol].maxScore=t.score;});
  return Object.entries(map).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
}

function sortByAge(list){return[...list].sort((a,b)=>{const da=parseDias(a.rangoStr),db=parseDias(b.rangoStr);return db!==da?db-da:b.score-a.score;});}

function buildDetailBlock(tickets,title,color,closeId,openKey,showSeg){

  const sorted=sortByAge(tickets);
  const areas=[...new Set(sorted.map(t=>getAreaAgente(t)).filter(a=>a&&a!=='—'))].sort();
  const rangos=[...new Set(sorted.map(t=>t.rangoStr).filter(Boolean))].sort((a,b)=>parseDias(b)-parseDias(a));
  const filterId='filt-'+openKey;
  const tableId='tbl-'+openKey;
  return`<div style="background:${color}10;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bdr)">
    <span style="font-size:12px;font-weight:700;color:${color}">${title}</span>
    <div style="display:flex;gap:6px;align-items:center">
      <span id="${filterId}-cnt" style="font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:10px;background:${color}25;color:${color}">${tickets.length}</span>
      <button onclick="downloadCSV(window['_dt_${openKey}']||[],'detalle')" style="font-size:10px;background:none;border:1px solid var(--bdr);border-radius:4px;padding:2px 8px;cursor:pointer;color:var(--txt2);font-family:var(--font)">⬇ CSV</button>
      <button onclick="cerrarDetalle('${closeId}')" style="font-size:11px;background:none;border:1px solid var(--bdr);border-radius:4px;padding:2px 8px;cursor:pointer;color:var(--txt3);font-family:var(--font)">✕ Cerrar</button>
    </div>
  </div>
  <div class="filter-bar">
    <select class="filter-select" id="${filterId}-area" onchange="applyDFilter('${filterId}','${tableId}','${openKey}',${showSeg?'true':'false'})">
      <option value="">Todas las áreas</option>${areas.map(a=>`<option value="${a}">${a}</option>`).join('')}
    </select>
    <select class="filter-select" id="${filterId}-rango" onchange="applyDFilter('${filterId}','${tableId}','${openKey}',${showSeg?'true':'false'})">
      <option value="">Toda antigüedad</option>${rangos.map(r=>`<option value="${r}">${r}</option>`).join('')}
    </select>
    <select class="filter-select" id="${filterId}-prior" onchange="applyDFilter('${filterId}','${tableId}','${openKey}',${showSeg?'true':'false'})">
      <option value="">Toda prioridad</option>
      <option value="urgent">Urgente</option><option value="high">Alto</option><option value="normal">Normal</option><option value="low">Bajo</option>
    </select>
    <button class="filter-btn-clear" onclick="clearDFilter('${filterId}','${tableId}','${openKey}',${showSeg?'true':'false'})">✕ Limpiar</button>
    <span id="${filterId}-total" style="font-size:10px;color:var(--txt3);margin-left:auto">${tickets.length} tickets</span>
  </div>
  <div class="tw"><table id="${tableId}"><thead><tr>${['#','Ticket','Asunto','Empresa','Área','Estado','Prioridad','Antigüedad','Agente','Desarrollador','Score'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${renderDetailRows(sorted,showSeg)}</tbody></table></div>
  ${getDiagnosis(sorted)}`;
}

function renderDetailRows(list,showSeg){
  if(!list.length)return'<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--txt3)">Sin resultados</td></tr>';
  return list.map((t,i)=>{
    const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':t.score>=200?'#4B9BFF':'#9ca3af';
    const st=SC[t.status]||SC[''];const pr=PC[t.priority]||PC[''];
    const sf=showSeg&&t.sinSeguimiento?'<span style="background:#fef2f2;color:#e11d48;font-size:9px;padding:1px 4px;border-radius:3px;margin-left:3px">+3d</span>':'';
    const area=getAreaAgente(t);
    return`<tr onclick="om(${t.id})">
      <td>${i+1}</td>
      <td><a href="https://dual.zendesk.com/agent/tickets/${t.id}" target="_blank" style="font-family:var(--mono);font-weight:700;color:#2563eb;text-decoration:none;font-size:11px" onclick="event.stopPropagation()">#${t.id}</a></td>
      <td style="max-width:180px">${t.subject||'—'}</td>
      <td>${t.org||'—'}</td>
      <td><span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--sur3);color:var(--txt2)">${area}</span></td>
      <td>${bdg(st.t,st.c,st.bg)}</td>
      <td>${bdg(pr.t,pr.c,pr.bg)}</td>
      <td>${t.rangoStr?bdg(t.rangoStr,getRangoColor(t.rangoStr),getRangoColor(t.rangoStr)+'18'):''}</td>
      <td>${t.agente||'—'}${sf}</td>
      <td style="font-size:10px;color:var(--txt2)">${t.dResp&&t.dResp.toLowerCase()!=='no'&&t.dResp.trim()!==''?t.dResp:'—'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${sc}">${t.score}</td>
    </tr>`;
  }).join('');
}

function applyDFilter(filterId,tableId,openKey,showSeg){
  const area=el(filterId+'-area')?.value||'';
  const rango=el(filterId+'-rango')?.value||'';
  const prior=el(filterId+'-prior')?.value||'';
  let list=sortByAge(window['_dt_'+openKey]||[]);
  if(area)list=list.filter(t=>getAreaAgente(t)===area);
  if(rango)list=list.filter(t=>t.rangoStr===rango);
  if(prior)list=list.filter(t=>t.priority===prior);
  const tbody=el(tableId)?.querySelector('tbody');
  if(tbody)tbody.innerHTML=renderDetailRows(list,showSeg);
  const cnt=el(filterId+'-cnt');if(cnt)cnt.textContent=list.length;
  const tot=el(filterId+'-total');if(tot)tot.textContent=list.length+' tickets';
}
function clearDFilter(filterId,tableId,openKey,showSeg){
  ['area','rango','prior'].forEach(f=>{const e=el(filterId+'-'+f);if(e)e.value='';});
  applyDFilter(filterId,tableId,openKey,showSeg);
}
function cerrarDetalle(closeId){const e=el(closeId);if(e){e.style.display='none';e.dataset.open='';}}

// ── RENDER HOY ───────────────────────────────────────────────────
function renderHoy(){
  const lista=getTicketsQuemandose();
  const agRiesgo=getAgentesEnRiesgo();
  const pred=getPredSLA();
  window._predTickets={ind1:pred.ind1,ind2:pred.ind2,ind3:pred.ind3,ind4:pred.ind4};
  window._hoyLista=lista;
  const now=new Date();
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fechaHoy=dias[now.getDay()]+' '+now.getDate()+' '+meses[now.getMonth()];

  // Clasificar niveles
  const criticos=sortByAge(lista.filter(t=>(t.priority==='urgent'||t.priority==='high')&&parseDias(t.rangoStr||'')>=7));
  const atencion=sortByAge(lista.filter(t=>!criticos.includes(t)&&(t.score>=300||parseDias(t.rangoStr||'')>=6)));
  const vigilancia=sortByAge(lista.filter(t=>!criticos.includes(t)&&!atencion.includes(t)));

  // Mini KPIs
  const revisadosHoy=lista.filter(t=>STORE.isRevisado(t.id)).length;
  const pendientes=lista.length-revisadosHoy;
  const conNotas=lista.filter(t=>STORE.getNotas(t.id).length>0).length;

  function motivoPills(t){
    const r=(t.rangoStr||'').trim().toLowerCase();const p=[];
    if(r==='7 días'||r==='7 dias')p.push('<span class="why-pill fire">7d · vence hoy</span>');
    else if(r==='6 días'||r==='6 dias')p.push('<span class="why-pill clock">6d · mañana</span>');
    if(t.sinSeguimiento)p.push('<span class="why-pill ghost">sin seguim.</span>');
    if(t.isSinAsignar)p.push('<span class="why-pill fire">sin resp.</span>');
    return p.join('');
  }

  function buildRows(list){
    return list.map((t,i)=>{
      const sc=t.score>=350?'#EF4444':t.score>=220?'#F59E0B':'#4B9BFF';
      const pr=PC[t.priority]||PC[''];
      const rev=STORE.isRevisado(t.id);
      const tieneNotas=STORE.getNotas(t.id).length>0;
      return`<div class="hoy-row${rev?' hoy-rev':''}" data-tid="${t.id}" onclick="om(${t.id})">
        <span class="t-num">${i+1}</span>
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">

// ── Slack integration ─────────────────────────────────────────────
const SLACK_WEBHOOK=localStorage.getItem('slack_webhook')||'';
function configSlack(){
  const current=localStorage.getItem('slack_webhook')||'';
  const url=prompt('Webhook URL de Slack:\n\nCómo obtenerlo:\n1. Ve a api.slack.com/apps\n2. Crea una app → Incoming Webhooks → Activar\n3. Add New Webhook → copia la URL\n\nURL actual: '+(current?current.substring(0,40)+'...':'no configurado')+'\n\nPega la nueva URL (o deja vacío para mantener):');
  if(url===null)return;
  if(url.startsWith('https://hooks.slack.com')){
    localStorage.setItem('slack_webhook',url.trim());
    showToast('✓ Slack configurado correctamente','#16a34a');
  } else if(url===''){
    showToast('Slack sin cambios','#6b7280');
  } else {
    showToast('URL inválida — debe empezar con https://hooks.slack.com','#dc2626');
  }
}

function sendSlackPreset(id,tipo){
  const t=T.find(x=>x.id===id);if(!t)return;
  const wh=localStorage.getItem('slack_webhook');
  if(!wh){
    const ok=confirm('Slack no está configurado.\n\n¿Quieres configurarlo ahora?');
    if(ok)configSlack();
    return;
  }
  const base=`https://dual.zendesk.com/agent/tickets/${t.id}`;
  const emp=t.org||'—';const ag=t.agente||'Sin asignar';
  const rango=t.rangoStr||'—';
  let texto='';
  if(tipo==='seguimiento'){
    texto=`Hola, este ticket <${base}|#${t.id}> (${emp}) lleva *${rango}* sin resolverse y está asignado a *${ag}*. Necesitamos actualización de seguimiento. ¿Hay algún avance o bloqueo? 🙏`;
  } else if(tipo==='marcar'){
    texto=`Hola, favor de marcar o actualizar el estado del ticket <${base}|#${t.id}> (${emp} · ${ag}). Antigüedad: *${rango}*. Si ya fue resuelto, por favor ciérralo en Zendesk. ✅`;
  } else if(tipo==='documentar'){
    texto=`Hola, el ticket <${base}|#${t.id}> (${emp}) requiere documentación para solución definitiva. Agente asignado: *${ag}* · Antigüedad: *${rango}*. Por favor agrega los pasos de solución en Zendesk. 📄`;
  }
  const msg={text:texto,username:'Dashboard Soporte',icon_emoji:':ticket:'};
  fetch(wh,{method:'POST',body:JSON.stringify(msg),mode:'no-cors'})
    .then(()=>showToast('✓ Mensaje enviado a Slack','#16a34a'))
    .catch(()=>showToast('✓ Enviado (verifica Slack)','#16a34a'));
}

function sendSlackTicket(id){
  const t=T.find(x=>x.id===id);if(!t)return;
  const wh=localStorage.getItem('slack_webhook');
  if(!wh){
    const url=prompt('Pega aquí el Webhook URL de Slack (se guarda solo una vez):');
    if(!url||!url.startsWith('https://'))return;
    localStorage.setItem('slack_webhook',url);
  }
  const webhook=localStorage.getItem('slack_webhook');
  const sc=t.score>=350?'danger':t.score>=220?'warning':'good';
  const msg={text:`🔔 *Ticket que requiere atención* — <https://dual.zendesk.com/agent/tickets/${t.id}|#${t.id}>`,attachments:[{color:sc,fields:[{title:'Asunto',value:t.subject||'—',short:false},{title:'Empresa',value:t.org||'—',short:true},{title:'Agente',value:t.agente||'Sin asignar',short:true},{title:'Antigüedad',value:t.rangoStr||'—',short:true},{title:'Score',value:String(t.score),short:true}],footer:'Dashboard Soporte · Santi Soluciones',ts:Math.floor(Date.now()/1000)}]};
  fetch(webhook,{method:'POST',body:JSON.stringify(msg)})
    .then(r=>{if(r.ok||r.type==='opaque')showToast('✓ Mensaje enviado a Slack','#16a34a');else showToast('✗ Error al enviar','#dc2626');})
    .catch(()=>showToast('✓ Enviado (revisa Slack)','#16a34a'));
}

function showToast(msg,color){
  let t=el('toast-msg');
  if(!t){t=document.createElement('div');t.id='toast-msg';t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.background=color;t.style.opacity='1';
  clearTimeout(t._to);t._to=setTimeout(()=>{t.style.opacity='0';},2500);
}

function buildAgBarChart(tickets,allTotals){
  if(!tickets||!tickets.length)return'';
  const grupos=[{lbl:'Corriente',fn:t=>parseDias(t.rangoStr)===0,c:'#22C55E'},{lbl:'1-7 días',fn:t=>{const d=parseDias(t.rangoStr);return d>0&&d<=7;},c:'#3B82F6'},{lbl:'8-30d',fn:t=>{const d=parseDias(t.rangoStr);return d>7&&d<=30;},c:'#F59E0B'},{lbl:'31-90d',fn:t=>{const d=parseDias(t.rangoStr);return d>30&&d<=90;},c:'#EF4444'},{lbl:'>90d',fn:t=>parseDias(t.rangoStr)>90,c:'#6B7280'}];
  const max=Math.max(tickets.length,1);
  return grupos.map(g=>{
    const cnt=tickets.filter(g.fn).length;
    if(!cnt)return'';
    const pct=Math.round(cnt/max*100);
    return`<div class="ag-bar-row"><span class="ag-bar-lbl">${g.lbl}</span><div class="ag-bar-track"><div class="ag-bar-fill" style="width:${pct}%;background:${g.c}"></div></div><span class="ag-bar-val">${cnt}</span></div>`;
  }).join('');
}

function buildPanoCharts(subset){
  const rVals=[...new Set(subset.map(t=>t.rangoStr).filter(Boolean))].sort((a,b)=>parseDias(a)-parseDias(b));
  const priData=['urgent','high','normal','low'].map(k=>subset.filter(t=>t.priority===k).length);
  const priColors=[PCOLORS.urgent,PCOLORS.high,PCOLORS.normal,PCOLORS.low];
  const orgMap={};subset.forEach(t=>{const o=(t.org||'Sin clasificar').trim()||'Sin clasificar';orgMap[o]=(orgMap[o]||0)+1;});
  const orgS=Object.entries(orgMap).sort((a,b)=>b[1]-a[1]).slice(0,12);

  if(CH['cp'])CH['cp'].destroy();
  const cpCtx=el('cp');
  if(cpCtx){CH['cp']=new Chart(cpCtx,{type:'doughnut',data:{labels:['Urgente','Alto','Normal','Bajo'],datasets:[{data:priData,backgroundColor:priColors,borderWidth:2,borderColor:'#ffffff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+ctx.raw;}},backgroundColor:'#111827',bodyColor:'#f9fafb',cornerRadius:6,padding:8}}}})}
  const legEl=el('pri-legend');if(legEl)legEl.innerHTML=['Urgente','Alto','Normal','Bajo'].map((l,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${priColors[i]}"></div>${l}: ${priData[i]}</div>`).join('');
  mkChart('ca','bar',rVals,rVals.map(r=>subset.filter(t=>t.rangoStr===r).length),rVals.map(r=>getRangoColor(r)),false,(label)=>{showPanoDetail('rango_'+label,label);});
  mkChart('cag','bar',orgS.map(x=>x[0]),orgS.map(x=>x[1]),orgS.map(()=>'#4B9BFF'),true,null);
}

function showPanoDetail(key,label){
  // Marcar KPI activo
  document.querySelectorAll('.kc').forEach(k=>k.classList.remove('active'));
  const kc=el('kc-'+key.replace('rango_',''));if(kc)kc.classList.add('active');
  const kpis=window._panoKpis||[];
  const kDef=kpis.find(k=>k.key===key);
  const color=kDef?kDef.color:'#2563eb';
  const title=label||(kDef?kDef.label:key);
  const kpiFns={
    total:()=>T,urgent:()=>T.filter(t=>t.priority==='urgent'),high:()=>T.filter(t=>t.priority==='high'),
    sla:()=>T.filter(t=>t.isSla),sinSeg:()=>T.filter(t=>t.sinSeguimiento),
    sinA:()=>T.filter(t=>t.isSinAsignar),
    emp3:()=>{const oc={};T.forEach(t=>{if(t.org)oc[t.org]=(oc[t.org]||0)+1;});return T.filter(t=>t.org&&(oc[t.org]||0)>=3);}
  };
  const fn=key.startsWith('rango_')?()=>T.filter(t=>t.rangoStr===key.replace('rango_','')):kpiFns[key];
  const tickets=fn?fn():[];
  // Actualizar gráficas dinámicamente
  const titleEl=el('pano-chart-title');if(titleEl)titleEl.textContent='Por prioridad — '+title;
  buildPanoCharts(tickets.length?tickets:T);
  // Detalle al final
  const wrap=el('pano-detail-wrap');
  if(!wrap)return;
  if(wrap.dataset.open===key){wrap.style.display='none';wrap.dataset.open='';document.querySelectorAll('.kc').forEach(k=>k.classList.remove('active'));buildPanoCharts(T);if(titleEl)titleEl.textContent='Por prioridad';return;}
  wrap.dataset.open=key;wrap.style.display='block';
  wrap.innerHTML=`<div class="card">${buildDetailBlock(tickets,title,color,'pano-detail-wrap',key,false)}</div>`;
  setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

// ── CHART HELPER ─────────────────────────────────────────────────
function mkChart(id,type,labels,data,colors,horiz,onClickFn){
  if(CH[id])CH[id].destroy();const ctx=el(id);if(!ctx)return;
  const opts={responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.raw+' tickets';}},backgroundColor:'#111827',bodyColor:'#f9fafb',cornerRadius:6,padding:8}},scales:{x:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780'}},y:{ticks:{color:'#9ca3af',font:{size:10}},grid:{color:'#f0f2f780'}}}};
  if(onClickFn){opts.onClick=(e,els)=>{if(els.length>0)onClickFn(labels[els[0].index]);};ctx.style.cursor='pointer';}
  CH[id]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,borderRadius:4}]},options:opts});
}

// ── DIAGNÓSTICO ──────────────────────────────────────────────────
function getDiagnosis(tickets){
  if(!tickets||!tickets.length)return'';
  const urg=tickets.filter(t=>t.priority==='urgent').length,hi=tickets.filter(t=>t.priority==='high').length,sla=tickets.filter(t=>t.isSla).length,sinSeg=tickets.filter(t=>t.sinSeguimiento).length,criticos=tickets.filter(t=>t.score>=350).length;
  const items=[];
  if(criticos>0)items.push(`<span style="color:#EF4444;font-weight:600">🚨 ${criticos} crítico${criticos>1?'s':''}</span> con score ≥350.`);
  if(urg>0)items.push(`<span style="color:#FF5C5C;font-weight:600">⚡ ${urg} urgente${urg>1?'s':''}</span> (${Math.round((urg+hi)/tickets.length*100)}% urg/alto).`);
  if(sla>0)items.push(`<span style="color:#F59E0B;font-weight:600">🕐 ${sla}</span> con SLA vencido (+7d).`);
  if(sinSeg>0)items.push(`<span style="color:#e11d48;font-weight:600">📭 ${sinSeg}</span> sin seguimiento >3d.`);
  if(!items.length)return'';
  return`<div style="background:var(--sur2);border-top:1px solid var(--bdr);padding:12px 16px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px">Diagnóstico</div><ul style="list-style:none;display:flex;flex-direction:column;gap:4px">${items.map(i=>`<li style="font-size:12px;color:var(--txt2)">• ${i}</li>`).join('')}</ul></div>`;
}

function go(tab){
  TAB=tab;

  ['hoy','equipo','clientes','panorama'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});

}

// ── UTILIDADES ───────────────────────────────────────────────────
async function fetchCSV(url){
  // Intentar primero sin cachebust, luego con si falla
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(!txt||txt.trim().length<10)throw new Error('Respuesta vacía');
    return parseCSV(txt);
  }catch(e1){
    // Segundo intento con cachebust
    const u2=url+(url.includes('?')?'&':'?')+'t='+Date.now();
    const r2=await fetch(u2);
    if(!r2.ok)throw new Error('HTTP '+r2.status+' ('+e1.message+')');
    return parseCSV(await r2.text());
  }
}
function fmtDate(str){if(!str||str==='—')return'—';const d=new Date(str);if(isNaN(d))return str;const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDateShort(str){if(!str)return'—';const d=new Date(str);if(isNaN(d))return str;const m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return String(d.getDate()).padStart(2,'0')+' '+m[d.getMonth()]+' '+d.getFullYear();}
function downloadCSV(tickets,filename){if(!tickets||!tickets.length)return;const cols=['id','subject','org','status','priority','rangoStr','agente','dResp','areaAsig','score','created','ultimoSeg'];const heads=['Ticket','Asunto','Empresa','Estado','Prioridad','Antigüedad','Agente','Desarrollador','Área','Score','Creado','Último seguimiento'];const rows=[heads.join(','),...tickets.map(t=>cols.map(k=>{const v=String(t[k]||'').replace(/,/g,';').replace(/\n/g,' ');return v.includes('"')?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));a.download=(filename||'export')+'.csv';a.click();}
function parseCSV(text){const lines=text.split('\n');function clean(v){return(v||'').replace(/^"|"$/g,'').trim();}let hi=-1;for(let i=0;i<Math.min(15,lines.length);i++){const r=csvLine(lines[i]).map(v=>clean(v).toLowerCase());const hasId=r.some(v=>v==='id'||v==='n.'||v==='n');const hasStatus=r.some(v=>['estado','status'].includes(v));const hasExtra=r.some(v=>v.includes('traducci')||v.includes('etiqueta')||v==='prioridad');if(hasId&&hasStatus&&hasExtra){hi=i;break;}if(hi<0&&hasId&&hasStatus){hi=i;}}if(hi<0)return{rows:[],headers:[]};const headers=csvLine(lines[hi]).map(v=>clean(v));const idIdx=headers.findIndex(h=>h.toLowerCase()==='id');if(idIdx<0)return{rows:[],headers:[]};const rows=[];for(let i=hi+1;i<lines.length;i++){const line=lines[i];if(!line.trim())continue;const vals=csvLine(line);const idVal=clean(vals[idIdx]||'');if(!/^\d{5,7}$/.test(idVal))continue;const row={};headers.forEach((h,j)=>{if(h)row[h]=clean(vals[j]);});rows.push(row);}return{rows,headers};}
function csvLine(line){const r=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){r.push(cur);cur='';}else cur+=ch;}r.push(cur);return r;}
function safeSet(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}

async function loadData(){
  const btn=el('ubtn');btn.disabled=true;btn.classList.add('spin');
  el('ldr').style.display='flex';
  ['hoy','equipo','panorama'].forEach(id=>{const v=el('v-'+id);if(v)v.classList.remove('on');});
  // Timeout de seguridad: si tarda más de 12s mostrar error
  const _timeout=setTimeout(()=>{
    el('ldr').style.display='none';
    const v=el('v-hoy');if(v){v.classList.add('on');v.style.display='flex';v.innerHTML='<div style="padding:20px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;width:100%"><div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:6px">Tiempo de espera agotado</div><div style="font-size:12px;color:#6b7280;margin-bottom:14px">No se pudo conectar con Google Sheets. Verifica tu conexión y reintenta.</div><button onclick="loadData()" style="padding:7px 16px;border-radius:8px;border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">↺ Reintentar</button></div>';}
    btn.disabled=false;btn.classList.remove('spin');
  },12000);
  try{
    el('ls').textContent='Conectando con Google Sheets…';
    const{rows,headers:hdrs}=await fetchCSV(API);
    el('ls').textContent='Procesando '+rows.length+' registros…';
    T=mapRows(rows,hdrs);
    el('ls').textContent='Calculando indicadores…';
    const now=new Date();
    safeSet('cf',now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase());
    safeSet('cs','SEM '+wk(now));
    safeSet('ct',T.length+' tickets');
    safeSet('cu',now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
    const _q=getTicketsQuemandose();const _ar=getAgentesEnRiesgo();
    const _orgCount=new Set(T.map(t=>t.org).filter(Boolean)).size;
    safeSet('nb-hoy',_q.length);safeSet('nb-equipo',_ar.length);safeSet('nb-clientes',_orgCount);
    el('ls').textContent='Cargando vista…';
    el('ldr').style.display='none';
    TAB='panorama';
    document.querySelectorAll('.ntab').forEach((b,i)=>b.classList.toggle('on',i===0));
    const v=el('v-panorama');if(v)v.classList.add('on');
    setTimeout(()=>{
      try{renderPanorama();}catch(re){
        const v=el('v-hoy');if(v){v.classList.add('on');v.style.display='flex';v.innerHTML='<div style="padding:20px;color:#dc2626;font-weight:600">Error al renderizar: '+re.message+'<br><small style=\'font-family:monospace;font-weight:400\'>'+re.stack+'</small></div>';}
        console.error('renderHoy error:',re);
      }
    },10);
  }catch(e){
    el('ldr').style.display='none';
    const v=el('v-hoy');
    if(v){
      v.classList.add('on');
      v.style.display='flex';
      v.innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rl);padding:20px;width:100%">
        <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:6px">Error al cargar datos</div>
        <div style="font-size:12px;color:#6b7280;margin-bottom:8px">${e.message}</div>
        <div style="font-size:11px;color:#9ca3af;margin-bottom:14px;font-family:monospace">${e.stack||''}</div>
        <button onclick="loadData()" style="padding:7px 16px;border-radius:var(--r);border:1px solid #fca5a5;background:#fff;color:#dc2626;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)">↺ Reintentar</button>
      </div>`;
    }
    console.error('Dashboard error:',e);
  }finally{
    clearTimeout(_timeout);
    btn.disabled=false;btn.classList.remove('spin');
  }
}
loadData();
