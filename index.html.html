<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Supervisor — Santi Soluciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1c2330;--bdr:#2d333b;
  --txt:#e6edf3;--txt2:#8b949e;--txt3:#6e7681;
  --blue:#388bfd;--blue2:#1f3455;
  --green:#3fb950;--orange:#d29922;--orange2:#3a2a0a;
  --red:#f85149;--red2:#3d1a1a;--purple:#a371f7;
  --acc:#58a6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px}
body{display:flex;flex-direction:column}

/* topbar */
.tb{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;background:var(--sur);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:20;gap:8px;flex-wrap:wrap}
.logo{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt2)}
.rbtn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);border:1px solid var(--blue);background:var(--blue2);color:var(--blue);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.rbtn:hover{background:var(--blue);color:#fff}
.rbtn:disabled{opacity:.4;cursor:not-allowed}
.rbtn.spin svg{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* tabs */
.tabs{display:flex;padding:0 20px;background:var(--sur);border-bottom:1px solid var(--bdr);gap:2px;overflow-x:auto}
.tab{padding:10px 15px;font-size:13px;font-weight:500;color:var(--txt2);border:none;background:none;cursor:pointer;font-family:var(--font);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

/* layout */
.main{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}

/* card */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden}
.ch{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.ct{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt2)}
.cb{padding:13px}

/* kpi */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px}
.kpi{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px}
.kl{font-size:11px;color:var(--txt2);margin-bottom:4px;font-weight:500}
.kv{font-size:25px;font-weight:300;font-family:var(--mono)}
.ks{font-size:10px;color:var(--txt3);margin-top:2px}

/* charts row */
.crow{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
@media(max-width:820px){.crow{grid-template-columns:1fr 1fr}}
.cbox{position:relative;height:170px}

/* area kpis */
.akrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.ak{border-radius:var(--r);padding:10px;text-align:center;border:1px solid}
.an{font-size:23px;font-weight:300;font-family:var(--mono)}
.al{font-size:10px;margin-top:2px;font-weight:500}

/* score guide */
.sg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.si{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:660px}
thead th{padding:6px 8px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);background:var(--sur2);border-bottom:1px solid var(--bdr);white-space:nowrap}
tbody td{padding:6px 8px;border-bottom:1px solid var(--bdr);font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--sur2)!important}
tr.rc td{background:rgba(248,81,73,.07)}
tr.rw td{background:rgba(210,153,34,.06)}
tr.rm td{background:rgba(56,139,253,.04)}

/* badge */
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;font-family:var(--mono)}

/* loader */
.ldr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px}
.ring{width:32px;height:32px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}

/* select */
.sel{background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);padding:3px 7px;border-radius:var(--r);font-size:11px;font-family:var(--font)}

/* modal */
.msk{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:36px}
.msk.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px;max-width:490px;width:92%;max-height:82vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.mt{font-size:14px;font-weight:500;line-height:1.4;flex:1;margin-right:9px}
.mx{background:none;border:none;cursor:pointer;font-size:21px;color:var(--txt2);line-height:1;font-family:var(--font)}
.md{height:1px;background:var(--bdr);margin:9px 0}
.mr{display:flex;gap:7px;margin-bottom:6px;font-size:12px}
.ml{color:var(--txt3);min-width:135px;flex-shrink:0;font-size:11px}
.mv{color:var(--txt)}
.tbox{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 13px;margin-bottom:11px;display:flex;align-items:center;gap:12px}
</style>
</head>
<body>

<div class="tb">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="logo"><div class="dot"></div>Dashboard Supervisor — Santi Soluciones</div>
    <div class="chips">
      <span class="chip" id="c-fecha">–</span>
      <span class="chip" id="c-sem">–</span>
      <span class="chip" id="c-tot">– tickets</span>
      <span class="chip" id="c-upd" style="color:var(--txt3)">Sin actualizar</span>
    </div>
  </div>
  <button class="rbtn" id="rbtn" onclick="loadData()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Actualizar datos
  </button>
</div>

<div class="tabs">
  <button class="tab on"  onclick="go('general')">Operación general</button>
  <button class="tab"     onclick="go('soporte')">Soporte</button>
  <button class="tab"     onclick="go('desarrollo')">Desarrollo</button>
  <button class="tab"     onclick="go('ant')">Antigüedad</button>
  <button class="tab"     onclick="go('todos')">Todos los tickets</button>
</div>

<div class="main" id="main">
  <!-- loader -->
  <div class="ldr" id="ldr">
    <div class="ring"></div>
    <div style="font-size:12px;color:var(--txt2)" id="lstep">Conectando con Google Sheets…</div>
  </div>

  <!-- views rendered dynamically -->
  <div id="v-general" style="display:none;flex-direction:column;gap:12px"></div>
  <div id="v-soporte"  style="display:none;flex-direction:column;gap:12px"></div>
  <div id="v-desarrollo" style="display:none;flex-direction:column;gap:12px"></div>
  <div id="v-ant"     style="display:none;flex-direction:column;gap:12px"></div>
  <div id="v-todos"   style="display:none;flex-direction:column;gap:12px"></div>
</div>

<div class="msk" id="msk" onclick="if(event.target===this)cm()">
  <div class="mbox" id="mbox"></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbySvHkMhKE-bY7NHKY2LXKSJ65xbx62Zo10Mbzlm7EbBb-EyIa6CrIv6Siojpq0gfy-0g/exec';
const ST=[{d:0,s:0,l:'Corriente'},{d:1,s:1,l:'1 día'},{d:2,s:2,l:'2 días'},{d:3,s:3,l:'3 días'},{d:4,s:5,l:'4 días'},{d:5,s:7,l:'5 días'},{d:6,s:9,l:'6 días'},{d:7,s:12,l:'7 días'},{d:15,s:20,l:'15 días'},{d:30,s:30,l:'30 días'},{d:45,s:40,l:'45 días'},{d:60,s:50,l:'60 días'},{d:90,s:60,l:'90 días'},{d:120,s:68,l:'120 días'},{d:180,s:75,l:'180 días'},{d:240,s:80,l:'240 días'},{d:300,s:84,l:'300 días'},{d:360,s:88,l:'360 días'},{d:540,s:92,l:'540 días'},{d:560,s:93,l:'560 días'},{d:620,s:95,l:'620 días'},{d:640,s:96,l:'640 días'},{d:700,s:98,l:'700 días'},{d:720,s:99,l:'720+ días'}];
const PS={urgent:400,high:300,normal:200,low:100,'':0};
const PC={urgent:{t:'Urgente',c:'#f85149'},high:{t:'Alto',c:'#d29922'},normal:{t:'Normal',c:'#388bfd'},low:{t:'Bajo',c:'#6e7681'},'':{t:'—',c:'#6e7681'}};
const SC={open:{t:'Abierto',c:'#f85149'},pending:{t:'Pendiente',c:'#d29922'},'':{t:'—',c:'#6e7681'}};
const MN=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const AB=[{k:'n',t:'≤7d',c:'#3fb950',x:7},{k:'r',t:'8-30d',c:'#388bfd',x:30},{k:'s',t:'31-90d',c:'#d29922',x:90},{k:'c',t:'91-365d',c:'#f85149',x:365},{k:'p',t:'+365d',c:'#8b949e',x:99999}];

let T=[],CH={},TAB='general';

function br(d){let b=ST[0];for(const e of ST){if(d>=e.d)b=e;else break;}return b;}
function ag(d){return AB.find(b=>d<=b.x)||AB[4];}
function act(s){if(s>=350)return{i:'🚨',t:'Resolver hoy',c:'rc'};if(s>=220)return{i:'⚠️',t:'Atender hoy',c:'rw'};if(s>=200)return{i:'📋',t:'Mañana',c:'rm'};if(s>=100)return{i:'',t:'Esta semana',c:''};return{i:'',t:'—',c:''};}
function wk(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}
function bdg(t,c){return`<span class="b" style="background:${c}20;color:${c}">${t}</span>`;}
function el(id){return document.getElementById(id);}
function fk(keys,pats){return keys.find(k=>pats.some(p=>new RegExp(p,'i').test(k)))||null;}

// ── Map Ant_Tickets rows → TICKETS ─────────────────────────────────────
function mapRows(rows){
  if(!rows.length)return[];
  const keys=Object.keys(rows[0]);
  const kId   =fk(keys,['^Id$','^ID$','^id$']);
  const kSt   =fk(keys,['^Status$','estado']);
  const kPr   =fk(keys,['^Priority$','prioridad']);
  const kOrg  =fk(keys,['Organization Name','Org','empresa','cliente']);
  const kSub  =fk(keys,['Subject','Asunto','subject']);
  const kSR   =fk(keys,['S-Responsable','s-responsable','Responsable']);
  const kCr   =fk(keys,['Created At','Created_At','Creado','Fecha']);
  const kAs   =fk(keys,['Assignee Name','Assignee','Asignado','Área']);
  const kDR   =fk(keys,['D-Responsable','d-responsable']);
  const kCa   =fk(keys,['S-CAUSA','Causa','causa']);
  const kMo   =fk(keys,['S-MODULO','Modulo','modulo']);
  const kSI   =fk(keys,['S-INTERNA','sinterna']);
  const kRa   =fk(keys,['Rango','rango','Días','dias','Bracket']);
  const kTi   =fk(keys,['Tipo','tipo','Customer','Implementa','Clasificacion']);
  const kMe   =fk(keys,['^Mes$','^mes$','Month']);
  const now=new Date();
  return rows.map(r=>{
    const id=parseInt(kId?r[kId]:'');
    if(!id||isNaN(id))return null;
    const cr=(kCr?r[kCr]||'':'').split(' ')[0];
    const days=cr?Math.max(0,Math.floor((now-new Date(cr))/86400000)):0;
    const b=br(days);
    const pri=(kPr?r[kPr]||'':'').toLowerCase().trim();
    const sc=(PS[pri]||0)+b.s;
    // find tiempo: any value matching hh:mm:ss pattern
    let tiempo='';
    for(const v of Object.values(r)){if(/^\d{1,4}:\d{2}:\d{2}$/.test((v||'').trim())){tiempo=v.trim();break;}}
    return{
      id,
      status:(kSt?r[kSt]||'':'').toLowerCase().trim(),
      priority:pri,
      org:kOrg?r[kOrg]||'':'',
      subject:kSub?r[kSub]||'':'',
      sResp:kSR?r[kSR]||'':'',
      created:cr,
      assignee:kAs?r[kAs]||'':'',
      dResp:kDR?r[kDR]||'':'',
      causa:kCa?r[kCa]||'':'',
      modulo:kMo?r[kMo]||'':'',
      sinterna:kSI?r[kSI]||'':'',
      days,bracket:b.l,score:sc,action:act(sc),age:ag(days),
      mes:cr?MN[new Date(cr).getMonth()+1]||'—':'—',
      tiempo,
      rango:kRa?r[kRa]||'':'',
      tipo:kTi?r[kTi]||'':'',
      mesAnt:kMe?r[kMe]||'':''
    };
  }).filter(Boolean);
}

// ── Charts ────────────────────────────────────────────────────────────────
function mkChart(id,type,labels,data,colors,horiz){
  if(CH[id])CH[id].destroy();
  const ctx=el(id);if(!ctx)return;
  CH[id]=new Chart(ctx,{type,
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:type==='doughnut'?2:0,borderColor:type==='doughnut'?'#161b22':undefined,borderRadius:type==='bar'?4:0}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw} tickets`}}},
      scales:type==='doughnut'?{}:{x:{ticks:{color:'#6e7681',font:{size:9}},grid:{color:'#2d333b40'}},y:{ticks:{color:'#6e7681',font:{size:9}},grid:{color:'#2d333b40'}}}}});
}

// ── Render general ────────────────────────────────────────────────────────
function renderGeneral(){
  const v=el('v-general');
  const now=new Date();
  const sinA=T.filter(t=>!t.sResp).length;
  const urgA=T.filter(t=>t.priority==='urgent'||t.priority==='high').length;
  const sla =T.filter(t=>t.days>7).length;
  const open=T.filter(t=>t.status==='open').length;
  const pen =T.filter(t=>t.status==='pending').length;
  const crit=T.filter(t=>t.score>=350).length;

  v.innerHTML=`
    <div class="card"><div class="ch"><span class="ct">KPIs de operación</span></div><div class="cb">
      <div class="kgrid">
        <div class="kpi"><div class="kl">Total tickets</div><div class="kv" style="color:var(--acc)">${T.length}</div></div>
        <div class="kpi"><div class="kl">Abiertos</div><div class="kv" style="color:var(--red)">${open}</div></div>
        <div class="kpi"><div class="kl">Pendientes</div><div class="kv" style="color:var(--orange)">${pen}</div></div>
        <div class="kpi"><div class="kl">Urgente / Alto</div><div class="kv" style="color:var(--orange)">${urgA}</div></div>
        <div class="kpi"><div class="kl">Score crítico ≥350</div><div class="kv" style="color:var(--red)">${crit}</div><div class="ks">Acción hoy</div></div>
        <div class="kpi"><div class="kl">Vencidos SLA +7d</div><div class="kv" style="color:var(--orange)">${sla}</div></div>
        <div class="kpi"><div class="kl">Sin responsable</div><div class="kv" style="color:var(--red)">${sinA}</div></div>
      </div>
    </div></div>
    <div class="crow">
      <div class="card"><div class="ch"><span class="ct">Por prioridad</span></div><div class="cb"><div class="cbox"><canvas id="cp"></canvas></div></div></div>
      <div class="card"><div class="ch"><span class="ct">Antigüedad</span></div><div class="cb"><div class="cbox"><canvas id="ca"></canvas></div></div></div>
      <div class="card"><div class="ch"><span class="ct">Por agente</span></div><div class="cb"><div class="cbox"><canvas id="cag"></canvas></div></div></div>
    </div>
    <div class="card">
      <div class="ch"><span class="ct">Sin responsable asignado</span>${bdg(sinA,'#f85149')}</div>
      <div class="cb" id="sa-body"></div>
    </div>`;

  // charts
  mkChart('cp','doughnut',['Urgente','Alto','Normal','Bajo'],
    ['urgent','high','normal','low'].map(k=>T.filter(t=>t.priority===k).length),
    ['#f85149','#d29922','#388bfd','#6e7681']);
  mkChart('ca','bar',AB.map(b=>b.t),AB.map(b=>T.filter(t=>t.age.k===b.k).length),AB.map(b=>b.c));
  const am={};T.forEach(t=>{const a=t.sResp||'Sin asignar';am[a]=(am[a]||0)+1;});
  const as=Object.entries(am).sort((a,b)=>b[1]-a[1]).slice(0,8);
  mkChart('cag','bar',as.map(x=>x[0]),as.map(x=>x[1]),as.map(()=>'#388bfd'),true);

  // sin asignar
  const sa=T.filter(t=>!t.sResp);
  el('sa-body').innerHTML=sa.length
    ?`<div class="tw"><table><thead><tr><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>Estado</th><th>Prioridad</th><th>Antigüedad</th></tr></thead><tbody>${
      sa.map(t=>`<tr onclick="om(${t.id})"><td style="font-family:var(--mono);color:var(--acc)">#${t.id}</td><td>${t.subject}</td><td>${t.org}</td><td>${bdg(SC[t.status]?.t||t.status,SC[t.status]?.c||'#6e7681')}</td><td>${bdg((PC[t.priority]||PC['']).t,(PC[t.priority]||PC['']).c)}</td><td>${bdg(t.age.t,t.age.c)}</td></tr>`).join('')
    }</tbody></table></div>`
    :`<div style="padding:14px;text-align:center;color:var(--txt3);font-size:13px">✓ Todos tienen responsable asignado</div>`;
}

// ── Render área ────────────────────────────────────────────────────────────
function renderArea(area){
  const v=el('v-'+area);
  const key=area==='soporte'?'Soporte 1':'Desarrollo 1';
  const list=[...T.filter(x=>x.assignee===key)].sort((a,b)=>b.score-a.score);
  const crit=list.filter(x=>x.score>=350).length;
  const ua=list.filter(x=>x.priority==='urgent'||x.priority==='high').length;
  const sla=list.filter(x=>x.days>7).length;
  const rows=list.map((x,i)=>{
    const sc=x.score>=350?'var(--red)':x.score>=220?'var(--orange)':x.score>=200?'var(--blue)':'var(--txt3)';
    return`<tr class="${x.action.c}" onclick="om(${x.id})">
      <td style="color:var(--txt3);font-family:var(--mono)">${i+1}</td>
      <td style="font-family:var(--mono);font-size:10px">${x.bracket}</td>
      <td style="font-family:var(--mono);font-size:10px;color:#3fb950">${x.tiempo||'—'}</td>
      <td>${bdg((PC[x.priority]||PC['']).t,(PC[x.priority]||PC['']).c)}</td>
      <td style="color:var(--txt2)">${x.sResp||'—'}</td>
      <td style="color:var(--txt2)">${x.dResp||'—'}</td>
      <td style="font-family:var(--mono);color:var(--acc)">#${x.id}</td>
      <td>${x.subject}</td>
      <td style="color:var(--txt2)">${x.org}</td>
      <td>${bdg(x.score,sc)}</td>
      <td style="font-size:10px;color:${sc}">${x.action.i} ${x.action.t}</td>
    </tr>`;
  }).join('');
  v.innerHTML=`<div class="card"><div class="ch"><span class="ct">${area==='soporte'?'Soporte':'Desarrollo'} — tickets activos</span></div><div class="cb">
    <div class="akrow">
      <div class="ak" style="background:var(--red2);border-color:var(--red)"><div class="an" style="color:var(--red)">${crit}</div><div class="al" style="color:var(--red)">🔴 Crítico ≥350</div></div>
      <div class="ak" style="background:var(--orange2);border-color:var(--orange)"><div class="an" style="color:var(--orange)">${ua}</div><div class="al" style="color:var(--orange)">🟡 Urgente/Alto</div></div>
      <div class="ak" style="background:var(--sur2);border-color:var(--bdr)"><div class="an" style="color:var(--txt2)">${sla}</div><div class="al" style="color:var(--txt2)">🕐 SLA +7d</div></div>
    </div>
    <div class="sg">
      <span class="si" style="background:var(--red2);border-color:var(--red);color:var(--red)">🚨 ≥350 Resolver hoy</span>
      <span class="si" style="background:var(--orange2);border-color:var(--orange);color:var(--orange)">⚠️ 220-349 Atender hoy</span>
      <span class="si" style="background:var(--blue2);border-color:var(--blue);color:var(--blue)">📋 200-219 Mañana</span>
      <span class="si" style="background:var(--sur2);border-color:var(--bdr);color:var(--txt2)">100-199 Esta semana</span>
    </div>
    <div class="tw"><table><thead><tr><th>N.</th><th>Antigüedad</th><th>⏱ Tiempo</th><th>Prioridad</th><th>Agente</th><th>Desarrollador</th><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>Score</th><th>Acción</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div></div>`;
}

// ── Render antigüedad ──────────────────────────────────────────────────────
function renderAnt(){
  const v=el('v-ant');
  const rangos=[...new Set(T.map(t=>t.rango).filter(Boolean))];
  const tipos =[...new Set(T.map(t=>t.tipo).filter(Boolean))];
  const meses =[...new Set(T.map(t=>t.mesAnt).filter(Boolean))];
  v.innerHTML=`
    <div class="crow">
      <div class="card"><div class="ch"><span class="ct">Por rango de días</span></div><div class="cb"><div class="cbox"><canvas id="car"></canvas></div></div></div>
      <div class="card"><div class="ch"><span class="ct">Por tipo de cliente</span></div><div class="cb"><div class="cbox"><canvas id="cat"></canvas></div></div></div>
      <div class="card"><div class="ch"><span class="ct">Por mes</span></div><div class="cb"><div class="cbox"><canvas id="cam"></canvas></div></div></div>
    </div>
    <div class="card">
      <div class="ch">
        <span class="ct">Detalle de antigüedad</span>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <select class="sel" id="far" onchange="rafilt()"><option value="">Todos los rangos</option>${rangos.map(r=>`<option>${r}</option>`).join('')}</select>
          <select class="sel" id="fat" onchange="rafilt()"><option value="">Todos los tipos</option>${tipos.map(r=>`<option>${r}</option>`).join('')}</select>
          <select class="sel" id="fam" onchange="rafilt()"><option value="">Todos los meses</option>${meses.map(r=>`<option>${r}</option>`).join('')}</select>
        </div>
      </div>
      <div class="tw" id="ant-tbl"></div>
    </div>`;
  mkChart('car','bar',rangos,rangos.map(r=>T.filter(t=>t.rango===r).length),['#3fb950','#388bfd','#d29922','#f85149','#8b949e','#a371f7']);
  mkChart('cat','doughnut',tipos,tipos.map(tp=>T.filter(t=>t.tipo===tp).length),['#388bfd','#a371f7','#3fb950','#d29922','#f85149']);
  mkChart('cam','bar',meses,meses.map(m=>T.filter(t=>t.mesAnt===m).length),meses.map(()=>'#a371f7'));
  rafilt();
}
function rafilt(){
  const fr=el('far')?.value||'',ft=el('fat')?.value||'',fm=el('fam')?.value||'';
  const list=T.filter(t=>{
    if(fr&&t.rango!==fr)return false;
    if(ft&&t.tipo!==ft)return false;
    if(fm&&t.mesAnt!==fm)return false;
    return true;
  });
  const rows=list.map(t=>{
    const sc=t.score>=350?'var(--red)':t.score>=220?'var(--orange)':t.score>=200?'var(--blue)':'var(--txt3)';
    return`<tr onclick="om(${t.id})"><td style="font-family:var(--mono);color:var(--acc)">#${t.id}</td><td>${t.subject}</td><td style="color:var(--txt2)">${t.org}</td><td style="font-family:var(--mono);color:#3fb950">${t.tiempo||'—'}</td><td>${t.rango?bdg(t.rango,'#d29922'):''}</td><td>${t.tipo?bdg(t.tipo,'#388bfd'):''}</td><td style="color:var(--txt2)">${t.mesAnt||'—'}</td><td style="color:var(--txt2)">${t.sResp||'—'}</td><td>${bdg(t.score,sc)}</td></tr>`;
  }).join('');
  el('ant-tbl').innerHTML=`<table><thead><tr><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>⏱ Tiempo</th><th>Rango</th><th>Tipo</th><th>Mes</th><th>Agente</th><th>Score</th></tr></thead><tbody>${rows||'<tr><td colspan="9" style="text-align:center;padding:16px;color:var(--txt3)">Sin resultados</td></tr>'}</tbody></table>`;
}

// ── Render todos ───────────────────────────────────────────────────────────
function renderTodos(){
  const v=el('v-todos');
  const agents=[...new Set(T.map(t=>t.sResp).filter(Boolean))].sort();
  v.innerHTML=`<div class="card">
    <div class="ch">
      <span class="ct">Todos los tickets</span>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <select class="sel" id="fs" onchange="tfilt()"><option value="">Todos los estados</option><option value="open">Abierto</option><option value="pending">Pendiente</option></select>
        <select class="sel" id="fp" onchange="tfilt()"><option value="">Todas las prioridades</option><option value="urgent">Urgente</option><option value="high">Alto</option><option value="normal">Normal</option><option value="low">Bajo</option></select>
        <select class="sel" id="fa" onchange="tfilt()"><option value="">Todos los agentes</option>${agents.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>
        <select class="sel" id="farea" onchange="tfilt()"><option value="">Todas las áreas</option><option value="Soporte 1">Soporte</option><option value="Desarrollo 1">Desarrollo</option></select>
      </div>
    </div>
    <div class="tw" id="tod-tbl"></div>
  </div>`;
  tfilt();
}
function tfilt(){
  const fs=el('fs')?.value||'',fp=el('fp')?.value||'',fa=el('fa')?.value||'',fr=el('farea')?.value||'';
  const list=[...T].filter(t=>{
    if(fs&&t.status!==fs)return false;
    if(fp&&t.priority!==fp)return false;
    if(fa&&t.sResp!==fa)return false;
    if(fr&&t.assignee!==fr)return false;
    return true;
  }).sort((a,b)=>b.score-a.score);
  const rows=list.map(t=>{
    const sc=t.score>=350?'var(--red)':t.score>=220?'var(--orange)':t.score>=200?'var(--blue)':'var(--txt3)';
    return`<tr class="${t.action.c}" onclick="om(${t.id})"><td style="font-family:var(--mono);color:var(--acc)">#${t.id}</td><td>${t.subject}</td><td style="color:var(--txt2)">${t.org}</td><td>${bdg(SC[t.status]?.t||t.status,SC[t.status]?.c||'#6e7681')}</td><td>${bdg((PC[t.priority]||PC['']).t,(PC[t.priority]||PC['']).c)}</td><td>${bdg(t.age.t,t.age.c)}</td><td style="font-family:var(--mono);font-size:10px;color:#3fb950">${t.tiempo||'—'}</td><td style="color:var(--txt2)">${t.sResp||'—'}</td><td style="color:var(--txt2)">${t.dResp||'—'}</td><td>${bdg(t.score,sc)}</td></tr>`;
  }).join('');
  if(el('tod-tbl'))el('tod-tbl').innerHTML=`<table><thead><tr><th>Ticket</th><th>Asunto</th><th>Cliente</th><th>Estado</th><th>Prioridad</th><th>Antigüedad</th><th>⏱ Tiempo</th><th>Agente</th><th>Desarrollador</th><th>Score</th></tr></thead><tbody>${rows||'<tr><td colspan="10" style="text-align:center;padding:16px;color:var(--txt3)">Sin resultados</td></tr>'}</tbody></table>`;
}

// ── Modal ──────────────────────────────────────────────────────────────────
function om(id){
  const t=T.find(x=>x.id===id);if(!t)return;
  const sc=t.score>=350?'var(--red)':t.score>=220?'var(--orange)':t.score>=200?'var(--blue)':'var(--txt2)';
  el('mbox').innerHTML=`
    <div class="mh"><div class="mt">${t.subject}</div><button class="mx" onclick="cm()">×</button></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px">
      ${bdg(SC[t.status]?.t||t.status,SC[t.status]?.c||'#6e7681')}
      ${bdg((PC[t.priority]||PC['']).t,(PC[t.priority]||PC['']).c)}
      ${bdg(t.age.t,t.age.c)}
    </div>
    <div style="font-family:var(--mono);font-size:21px;color:${sc};margin-bottom:2px">SCORE: ${t.score}</div>
    <div style="font-size:12px;color:${sc};margin-bottom:9px">${t.action.i} ${t.action.t}</div>
    ${t.tiempo?`<div class="tbox"><div><div style="font-family:var(--mono);font-size:18px;font-weight:500;color:#3fb950">${t.tiempo}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">Tiempo en espera</div></div>${t.rango?`<span>${bdg(t.rango,'#d29922')}</span>`:''} ${t.tipo?`<span>${bdg(t.tipo,'#388bfd')}</span>`:''}</div>`:''}
    <div class="md"></div>
    <div class="mr"><span class="ml">ID Ticket</span><span class="mv" style="font-family:var(--mono)">#${t.id}</span></div>
    <div class="mr"><span class="ml">Cliente</span><span class="mv">${t.org}</span></div>
    <div class="mr"><span class="ml">Creado</span><span class="mv" style="font-family:var(--mono)">${t.created} · ${t.days}d · ${t.bracket}</span></div>
    <div class="mr"><span class="ml">Área</span><span class="mv">${t.assignee}</span></div>
    <div class="mr"><span class="ml">Agente</span><span class="mv">${t.sResp||'— Sin asignar'}</span></div>
    <div class="mr"><span class="ml">Desarrollador</span><span class="mv">${t.dResp||'—'}</span></div>
    <div class="mr"><span class="ml">Tipo cliente</span><span class="mv">${t.tipo||'—'}</span></div>
    <div class="mr"><span class="ml">Causa</span><span class="mv">${t.causa||'—'}</span></div>
    <div class="mr"><span class="ml">Módulo</span><span class="mv">${t.modulo||'—'}</span></div>`;
  el('msk').classList.add('on');
}
function cm(){el('msk').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cm();});

// ── Tabs ───────────────────────────────────────────────────────────────────
function go(tab){
  TAB=tab;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['general','soporte','desarrollo','ant','todos'][i]===tab));
  ['general','soporte','desarrollo','ant','todos'].forEach(id=>{
    const v=el('v-'+id);if(v)v.style.display='none';
  });
  const v=el('v-'+tab);if(v)v.style.display='flex';
  if(tab==='soporte')renderArea('soporte');
  if(tab==='desarrollo')renderArea('desarrollo');
  if(tab==='ant')renderAnt();
  if(tab==='todos')renderTodos();
}

// ── Load ───────────────────────────────────────────────────────────────────
async function loadData(){
  const btn=el('rbtn');
  btn.disabled=true;btn.classList.add('spin');
  el('ldr').style.display='flex';
  ['general','soporte','desarrollo','ant','todos'].forEach(id=>{const v=el('v-'+id);if(v)v.style.display='none';});
  try{
    el('lstep').textContent='Leyendo Ant_Tickets…';
    const res=await fetch(`${API}?sheet=Ant_Tickets&t=${Date.now()}`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    T=mapRows(data.rows||[]);
    const now=new Date();
    el('c-fecha').textContent=now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
    el('c-sem').textContent='Semana '+wk(now);
    el('c-tot').textContent=T.length+' tickets';
    el('c-upd').textContent='Actualizado '+now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    el('ldr').style.display='none';
    // render current tab
    const v=el('v-'+TAB);if(v)v.style.display='flex';
    if(TAB==='general')renderGeneral();
    else if(TAB==='soporte')renderArea('soporte');
    else if(TAB==='desarrollo')renderArea('desarrollo');
    else if(TAB==='ant')renderAnt();
    else if(TAB==='todos')renderTodos();
    // pre-render general if on another tab
    if(TAB!=='general'){el('v-general').style.display='none';renderGeneral();el('v-general').style.display='none';}
  }catch(e){
    el('ldr').style.display='none';
    const v=el('v-general');
    if(v){v.style.display='flex';v.innerHTML=`<div style="background:var(--red2);border:1px solid var(--red);border-radius:var(--rl);padding:16px;font-size:13px;color:var(--red)"><strong>Error al cargar datos</strong><br>${e.message}<br><br><button onclick="loadData()" style="padding:4px 12px;border-radius:var(--r);border:1px solid var(--red);background:none;color:var(--red);cursor:pointer;font-size:12px;font-family:var(--font)">↺ Reintentar</button></div>`;}
    TAB='general';
    document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i===0));
  }finally{
    btn.disabled=false;btn.classList.remove('spin');
  }
}

loadData();
</script>
</body>
</html>
